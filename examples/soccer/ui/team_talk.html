<link rel="stylesheet" href="kit.css">
<style>
/* Old-engine desktop UI scale: authored px drew at min(view/1920x1080, 1); --u is one such px, measured against the game view (the host is a size container). */
:root { container-type: size; --u: min(100cqw / 1920, 100cqh / 1080, 1px); }

  .tt-scrim { pointer-events: auto; animation: sc-fade .3s ease-out both; }
  .tt { position: relative; width: min(calc(var(--rem)*86), calc(100% - calc(var(--rem)*8))); display: flex; flex-direction: column; gap: calc(var(--rem)*1.75); pointer-events: auto; animation: sc-fadeUp .4s var(--ease-out) both; }
  .tt-head { display: flex; align-items: flex-end; justify-content: space-between; gap: calc(var(--rem)*2); padding-bottom: calc(var(--rem)*1.5); border-bottom: 1px solid var(--c-line); }
  .tt-kicker { display: flex; align-items: center; gap: calc(var(--rem)*.75); font: 600 calc(var(--rem)*1.125)/1 var(--font-display); letter-spacing: .2em; text-transform: uppercase; color: var(--c-mint-200); white-space: nowrap; }
  .tt-kicker .ok { color: var(--c-mint-400); }
  .tt-h { font: italic 800 calc(var(--rem)*6.5)/.82 var(--font-display); text-transform: uppercase; margin-top: calc(var(--rem)*1); white-space: nowrap; }
  .tt-res { display: flex; flex-direction: column; align-items: flex-end; gap: calc(var(--rem)*.5); }
  .tt-res span { font: 600 calc(var(--rem)*1.125)/1 var(--font-display); letter-spacing: .2em; text-transform: uppercase; color: var(--c-mint-400); }
  .tt-res b { font: 800 calc(var(--rem)*5)/.85 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tt-next { display: flex; align-items: center; gap: calc(var(--rem)*1.75); }
  .tt-chip { display: flex; height: calc(var(--rem)*2.75); --sl: calc(var(--rem)*.625); font: 700 calc(var(--rem)*1.25)/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; flex: none; }
  .tt-chip > * { clip-path: polygon(var(--sl) 0, 100% 0, calc(100% - var(--sl)) 100%, 0 100%); display: flex; align-items: center; padding-inline: calc(var(--sl) + calc(var(--rem)*.875)); white-space: nowrap; }
  .tt-chip > * + * { margin-left: calc(var(--sl) * -1 + 3px); }
  .tt-chip .k { background: var(--c-ink); color: var(--c-pitch); }
  .tt-chip .t { background: var(--c-away); color: var(--c-away-ink); }
  .tt-chip .s { background: var(--c-pitch-700); color: var(--c-mint-200); }
  .tt-scout { font-size: calc(var(--rem)*1.25); line-height: 1.4; font-style: italic; color: var(--c-ink-2); }
  .tt-ask { display: flex; align-items: center; gap: calc(var(--rem)*1.25); font: 700 calc(var(--rem)*1.25)/1 var(--font-display); letter-spacing: .22em; text-transform: uppercase; }
  .tt-ask::after { content: ""; flex: 1; height: 1px; background: var(--c-line); }
  .tt-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--rem)*1.5); }
  .sc-root .tt-card { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: calc(var(--rem)*1); min-height: calc(var(--rem)*21); padding: calc(var(--rem)*2) calc(var(--rem)*2) calc(var(--rem)*1.625); background: var(--c-panel-solid); border: 1px solid var(--c-line); border-radius: 4px; box-shadow: var(--sh-panel); text-align: left; transition: transform .2s var(--ease-out), border-color .2s, background .2s, opacity .2s, box-shadow .2s; }
  .tt-card .sc-kbd { position: absolute; top: calc(var(--rem)*1.5); right: calc(var(--rem)*1.5); }
  .tt-ic { display: grid; place-items: center; width: calc(var(--rem)*4.25); height: calc(var(--rem)*4.25); border-radius: 4px; background: rgba(52,211,153,.12); color: var(--c-mint-400); transition: background .2s, color .2s; }
  .tt-ic svg { width: calc(var(--rem)*2.125); height: calc(var(--rem)*2.125); }
  .tt-t { font: 700 calc(var(--rem)*2.375)/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; margin-top: calc(var(--rem)*.5); }
  .tt-d { font-size: calc(var(--rem)*1.125); line-height: 1.45; color: var(--c-ink-2); }
  .tt-foot { margin-top: auto; display: flex; align-items: center; gap: calc(var(--rem)*.5); font: 700 calc(var(--rem)*1)/1 var(--font-display); letter-spacing: .18em; text-transform: uppercase; color: var(--c-ink-3); }
  .tt-foot .f-chosen, .tt-foot .f-tap { display: none; }
  .tt-chk { position: absolute; top: calc(var(--rem)*-1.125); right: calc(var(--rem)*1.5); display: none; place-items: center; width: calc(var(--rem)*2.5); height: calc(var(--rem)*2.5); border-radius: 50%; background: var(--c-gold); color: var(--c-gold-ink); box-shadow: var(--sh-drop); }
  .tt-chk svg { width: calc(var(--rem)*1.375); height: calc(var(--rem)*1.375); }
  .tt-cards:not(.locked) .tt-card:hover, .tt-cards:not(.locked) .tt-card:focus-visible { transform: translateY(calc(var(--rem)*-.5)); border-color: var(--c-mint-400); background: var(--c-pitch-700); box-shadow: 0 0 0 1px var(--c-mint-400), var(--sh-panel); }
  .tt-cards:not(.locked) .tt-card:hover .tt-ic, .tt-cards:not(.locked) .tt-card:focus-visible .tt-ic { background: var(--c-mint-400); color: var(--c-pitch); }
  .tt-cards:not(.locked) .tt-card:hover .tt-foot, .tt-cards:not(.locked) .tt-card:focus-visible .tt-foot { color: var(--c-mint-400); }
  .sc-root .tt-card.is-chosen { transform: translateY(calc(var(--rem)*-.5)); border-color: var(--c-gold); background: var(--c-pitch-700); box-shadow: 0 0 0 2px var(--c-gold), var(--glow-gold); }
  .tt-card.is-chosen .tt-ic { background: var(--c-gold); color: var(--c-gold-ink); }
  .tt-card.is-chosen .tt-foot { color: var(--c-gold); }
  .tt-card.is-chosen .tt-chk { display: grid; }
  .tt-card.is-chosen .sc-kbd, .tt-card.is-chosen .f-pick, .tt-card.is-chosen .f-tap { display: none; }
  .tt-card.is-chosen .f-chosen { display: inline; }
  .sc-root .tt-card.is-dim { opacity: .32; transform: scale(.98); border-color: var(--c-line); background: var(--c-panel-solid); box-shadow: none; }
  .tt-foot2 { display: flex; align-items: center; gap: calc(var(--rem)*.75); flex-wrap: wrap; }
  .tt-foot2 .lbl { font: 600 calc(var(--rem)*.875)/1 var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--c-ink-3); margin-right: calc(var(--rem)*.25); }
  .tt-foot2 .sc-hint { margin-left: auto; }
  .tt-foot2 .sc-hint .sc-kbd + .sc-kbd { margin-left: calc(var(--rem)*-.25); }
  .tt-pill { display: inline-flex; align-items: center; gap: calc(var(--rem)*.5); height: calc(var(--rem)*2.125); padding: 0 calc(var(--rem)*.875); border-radius: 999px; background: rgba(220,252,231,.08); border: 1px solid var(--c-line); font-size: calc(var(--rem)*.9375); font-weight: 600; }
  .tt-pill svg { width: calc(var(--rem)*1); height: calc(var(--rem)*1); color: var(--c-mint-400); }
  .tt-none { font-size: calc(var(--rem)*.9375); color: var(--c-ink-3); }
  @media (pointer: coarse) {
    .tt { width: calc(100% - var(--safe-l) - var(--safe-r)); gap: 9px; margin-bottom: var(--safe-b); }
    .tt-head { align-items: center; padding-bottom: 7px; }
    .tt-kicker { font-size: 11px; gap: 6px; letter-spacing: .18em; }
    .tt-h { font-size: 34px; margin-top: 3px; }
    .tt-res { gap: 3px; }
    .tt-res span { font-size: 11px; }
    .tt-res b { font-size: 32px; }
    .tt-next { flex-direction: column; align-items: flex-start; gap: 5px; }
    .tt-chip { height: 24px; font-size: 13px; --sl: 6px; }
    .tt-chip > * { padding-inline: calc(var(--sl) + 8px); }
    .tt-chip > * + * { margin-left: calc(var(--sl) * -1 + 2px); }
    .tt-scout { font-size: 13px; }
    .tt-ask, .tt-foot2, .tt-card .sc-kbd { display: none; }
    .tt-cards { grid-template-columns: repeat(3, minmax(0, 240px)); justify-content: space-between; gap: 12px; margin-top: 4px; }
    .sc-root .tt-card { min-height: 0; padding: 13px 14px 12px; gap: 7px; }
    .tt-ic { width: 36px; height: 36px; }
    .tt-ic svg { width: 19px; height: 19px; }
    .tt-t { font-size: 20px; margin-top: 2px; }
    .tt-d { font-size: 12.5px; line-height: 1.38; }
    .tt-foot { font-size: 11px; padding-top: 2px; }
    .tt-foot .f-pick { display: none; }
    .tt-foot .f-tap { display: inline; }
    .tt-chk { width: 26px; height: 26px; top: -10px; right: 12px; }
    .tt-chk svg { width: 15px; height: 15px; }
    .sc-root .tt-card.is-chosen { transform: translateY(-4px); }
    .tt-cards:not(.locked) .tt-card:hover { transform: none; border-color: var(--c-line); background: var(--c-panel-solid); box-shadow: var(--sh-panel); }
    .tt-cards:not(.locked) .tt-card:hover .tt-ic { background: rgba(52,211,153,.12); color: var(--c-mint-400); }
    .tt-cards:not(.locked) .tt-card:hover .tt-foot { color: var(--c-ink-3); }
  }
</style>
<div class="sc-root tt-wrap">
  <div class="sc-scrim tt-scrim"></div>
  <div class="sc-center">
    <section class="tt" role="dialog">
      <header class="tt-head">
        <div>
          <div class="tt-kicker"><span class="ok" data-text="won"></span> <span data-bind="won_stage"></span> <span class="sc-pips" data-each="pips"><template><i data-class-done="done" data-class-now="now" data-class-out="out" data-class-gold="gold"></i></template></span> <span><span data-text="round"></span> <span data-bind="round"></span> / <span data-bind="rounds"></span></span></div>
          <h1 class="tt-h" data-text="team_talk"></h1>
        </div>
        <div class="tt-res"><span data-text="through"></span><b data-bind="score"></b></div>
      </header>
      <div class="tt-next"><div class="tt-chip" data-attr-data-away="next_away"><span class="k" data-text="next_up"></span><span class="t" data-bind="next_opponent"></span><span class="s" data-bind="next_stage"></span></div><p class="tt-scout" data-bind="scout_report"></p></div>
      <p class="tt-ask" data-text="team_talk_prompt"></p>
      <div class="tt-cards" data-each="cards">
        <template>
          <button class="tt-card" data-action="pick" data-key="Digit{index1}">
            <span class="tt-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 5 13h6l-1 9 8-12h-6z"/></svg></span>
            <kbd class="sc-kbd" data-bind="number"></kbd>
            <span class="tt-t" data-bind="name"></span>
            <span class="tt-d" data-bind="description"></span>
            <span class="tt-foot"><span class="f-pick" data-text="pick_this"></span><span class="f-tap" data-text="tap_to_pick"></span> →</span>
          </button>
        </template>
      </div>
      <footer class="tt-foot2"><span class="lbl" data-text="in_the_squad"></span><span class="tt-none" data-hide="squad" data-text="nothing_yet"></span><span data-each="squad"><template><span class="tt-pill" data-bind="name"></span> </template></span><span class="sc-hint"><kbd class="sc-kbd">1</kbd><kbd class="sc-kbd">2</kbd><kbd class="sc-kbd">3</kbd> <span data-text="or_click"></span></span></footer>
    </section>
  </div>
</div>
