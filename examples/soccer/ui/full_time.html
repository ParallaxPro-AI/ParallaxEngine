<link rel="stylesheet" href="kit.css">
<style>
/* Old-engine desktop UI scale: authored px drew at min(view/1920x1080, 1); --u is one such px, measured against the game view (the host is a size container). */
:root { container-type: size; --u: min(100cqw / 1920, 100cqh / 1080, 1px); }

  .gx { position: fixed; inset: 0; pointer-events: auto; animation: sc-fade .3s ease-out both; }
  .gx-scrim { position: absolute; inset: 0; background: rgba(2,8,5,.88); }
  .gx.win .gx-scrim { background: radial-gradient(70% 70% at 50% 38%, rgba(251,191,36,.14), rgba(2,12,6,.84) 70%); }
  .gx-tape { position: absolute; inset: 0; overflow: hidden; pointer-events: none; display: none; }
  .gx.win .gx-tape { display: block; }
  .gx-tape i { position: absolute; top: -4cqh; left: var(--x); width: calc(var(--rem)*.625); height: calc(var(--rem)*1.375); background: var(--c); opacity: .9; animation: sc-tape var(--d) linear var(--dl) infinite; }
  .gx-c { position: absolute; inset: 0; display: grid; place-items: center; }
  .gx-ft { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: calc(var(--rem)*1.5); }
  .gx-top { display: contents; }
  .gx-ft > * { order: 3; }
  .gx-trophy { order: 0; }
  .gx-ft > .gx-where { order: 1; }
  .gx-h { order: 2; }
  .gx-trophy { display: none; width: calc(var(--rem)*9); height: calc(var(--rem)*9); color: var(--c-gold); filter: drop-shadow(0 0 calc(var(--rem)*2.5) rgba(251,191,36,.6)); animation: sc-rise .9s var(--ease-out) both; }
  .gx.win .gx-trophy { display: block; }
  .gx-trophy svg { width: 100%; height: 100%; }
  .gx-meta { font: 600 calc(var(--rem)*1)/1 var(--font-display); letter-spacing: .2em; text-transform: uppercase; color: var(--c-mint-200); display: flex; align-items: center; gap: calc(var(--rem)*.5); white-space: nowrap; }
  .gx-meta b { color: var(--c-gold); font-weight: 800; }
  .gx-h { font: italic 800 calc(var(--rem)*9.5)/.82 var(--font-display); text-transform: uppercase; white-space: nowrap; animation: sc-bIn .5s .25s var(--ease-out) both; }
  .gx.win .gx-h { color: var(--c-gold); text-shadow: 0 0 calc(var(--rem)*3) rgba(251,191,36,.35); }
  .gx-rule { width: calc(var(--rem)*7); height: 4px; background: var(--c-danger); transform: skewX(-30deg); }
  .gx.win .gx-rule { display: none; }
  .gx-line { display: flex; height: calc(var(--rem)*2.75); --sl: calc(var(--rem)*.625); font: 700 calc(var(--rem)*1.375)/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; }
  .gx-line > * { clip-path: polygon(var(--sl) 0, 100% 0, calc(100% - var(--sl)) 100%, 0 100%); display: flex; align-items: center; gap: calc(var(--rem)*.625); padding-inline: calc(var(--sl) + calc(var(--rem)*1)); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .gx-line > * + * { margin-left: calc(var(--sl) * -1 + 3px); }
  .gx-line .h { background: var(--c-home); color: #fff; }
  .gx-line .a { background: var(--c-away); color: var(--c-away-ink); }
  .gx-line .n { background: var(--c-panel-solid); color: var(--c-ink); }
  .gx.win .gx-line .n { background: var(--c-gold); color: var(--c-gold-ink); }
  .gx-stats { display: flex; margin-top: calc(var(--rem)*.75); border-block: 1px solid var(--c-line); background: rgba(3,23,11,.55); }
  .gx-stats > div { display: flex; flex-direction: column-reverse; align-items: center; gap: calc(var(--rem)*.625); padding: calc(var(--rem)*1.375) calc(var(--rem)*2.75); }
  .gx-stats > div + div { border-left: 1px solid var(--c-line); }
  .gx-stats dt { font: 600 calc(var(--rem)*.875)/1 var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--c-ink-3); white-space: nowrap; }
  .gx-stats dd { font: 700 calc(var(--rem)*3.25)/1 var(--font-display); font-variant-numeric: tabular-nums; text-transform: uppercase; white-space: nowrap; }
  .gx-stats .hl dd { color: var(--c-danger); }
  .gx.win .gx-stats .hl dd { color: var(--c-gold); }
  .gx-btns { display: flex; gap: calc(var(--rem)*1.25); margin-top: calc(var(--rem)*1.25); }
  .gx-gold { display: none; }
  .gx.win .gx-gold { display: inline-flex; }
  .gx.win .gx-prim { display: none; }
  .gx-cups { display: none; }
  .gx.win .gx-cups { display: flex; }
  .gx-cups svg { width: 1.25em; height: 1.25em; color: var(--c-gold); }
  @media (pointer: coarse) {
    .gx-ft { gap: 8px; margin-bottom: var(--safe-b); }
    .gx-top { display: flex; align-items: center; gap: 14px; order: 0; }
    .gx:not(.win) .gx-top { order: 2; }
    .gx-trophy { width: 58px; height: 58px; }
    .gx-h { font-size: 60px; }
    .gx-rule { width: 48px; height: 3px; }
    .gx-line { height: 24px; font-size: 13px; --sl: 6px; }
    .gx-line > * { padding-inline: calc(var(--sl) + 8px); gap: 6px; }
    .gx-line > * + * { margin-left: calc(var(--sl) * -1 + 2px); }
    .gx-stats { margin-top: 4px; }
    .gx-stats > div { padding: 9px 18px; gap: 5px; }
    .gx-stats dt { font-size: 9.5px; letter-spacing: .12em; }
    .gx-stats dd { font-size: 26px; }
    .gx-btns { margin-top: 6px; gap: 12px; }
    .gx-meta { font-size: 11px; }
    .gx-tape i { width: 6px; height: 13px; }
  }
</style>

--d:5.7s;--dl:-0.3s"></i><i style="--x:85.4%;--c:#fff;--d:6.4s;--dl:-1.6s"></i><i style="--x:21.0%;--c:var(--c-gold);--d:7.1s;--dl:-2.9s"></i></div>

    </section>
