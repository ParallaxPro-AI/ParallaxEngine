<style>

  @media (pointer: coarse) {

    .gch-combo { bottom: calc(var(--gc-sa-b) + 8px); }

  @container (orientation: portrait) {
    .gch { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 10px; }
    .gch-mid { display: none; }
    .gch-side { height: auto; }

</style>
<div class="gc-root gch" data-class-is-met="met" data-class-is-low="low" data-class-no-ice="no_ice">

<script>
  // The cascade callout pops in at each new tier and lingers 0.6 s (0.9 s on touch) after
  // the cascade ends, then fades: presentation timing the bindings can't express.
  (function () {
    var combo = document.getElementById('gch-combo');
    var last = 1, offTimer = 0, goneTimer = 0;
    function coarse() { return window.matchMedia && window.matchMedia('(pointer: coarse)').matches; }
    parallax.on_state(function (s) {
      var n = Number(s && s.combo) || 0;
      if (n >= 2) {
        clearTimeout(offTimer); clearTimeout(goneTimer); offTimer = goneTimer = 0;
        var t = n >= 6 ? 6 : n >= 4 ? 4 : n;
        if (n !== last || combo.classList.contains('is-gone') || combo.classList.contains('is-off')) {
          combo.className = 'gch-combo t' + t;
          document.getElementById('gch-combo-n').textContent = String(n);
          document.getElementById('gch-combo-l').textContent = t >= 6 ? s.grand_cascade : s.cascade;
          var core = combo.querySelector('.core');
          core.style.animation = 'none'; void core.offsetWidth; core.style.animation = '';
        }
        last = n;
        return;
      }
      last = 1;
      if (combo.classList.contains('is-gone') || offTimer) return;
      offTimer = setTimeout(function () {
        combo.classList.add('is-off');
        goneTimer = setTimeout(function () { combo.classList.add('is-gone'); offTimer = 0; }, 620);
      }, coarse() ? 900 : 600);
    });
  })();
</script>
