<style>
  .pss { position: fixed; inset: 0; pointer-events: auto; }
  .pss-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px calc(var(--ps-sa-r) + 12px) 12px calc(var(--ps-sa-l) + 12px); animation: ps-rise .52s var(--ps-ease); }

  .pss-cards { display: flex; gap: calc(40 * var(--ps-u)); margin-top: calc(56 * var(--ps-u)); }
  .ps-root .pss-card { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; width: calc(400 * var(--ps-u)); height: calc(470 * var(--ps-u)); padding: calc(48 * var(--ps-u)) calc(36 * var(--ps-u)) calc(34 * var(--ps-u)); font-family: var(--ps-font-ui); color: var(--ps-ink); background: linear-gradient(170deg, rgba(36,84,64,.94), rgba(18,56,46,.96)); border: 1px solid var(--ps-border); border-radius: var(--ps-r-card); box-shadow: var(--ps-shadow-panel), inset 0 0 0 calc(6 * var(--ps-u)) rgba(18,56,46,.6), inset 0 0 0 calc(7 * var(--ps-u)) rgba(145,182,159,.16); transition: transform .26s var(--ps-ease), border-color .26s, box-shadow .26s, opacity .26s; }
  .pss-medal { display: grid; place-items: center; flex: none; width: calc(100 * var(--ps-u)); height: calc(100 * var(--ps-u)); border-radius: 50%; border: 1px solid var(--ps-border-strong); background: radial-gradient(circle at 50% 35%, rgba(215,243,184,.2), rgba(18,56,46,.3)); color: var(--ps-leaf); transition: all .26s; }
  .pss-medal .i { width: 48%; height: 48%; }
  .pss-name { margin-top: calc(30 * var(--ps-u)); font: 600 calc(46 * var(--ps-u))/1.05 var(--ps-font-display); }
  .pss-desc { margin-top: calc(14 * var(--ps-u)); max-width: calc(310 * var(--ps-u)); font-weight: 500; font-size: calc(22 * var(--ps-u)); line-height: 1.42; color: var(--ps-ink-dim); text-wrap: pretty; }
  .pss-foot { margin-top: auto; display: flex; align-items: center; justify-content: center; gap: calc(14 * var(--ps-u)); }
  .pss-pips { display: flex; gap: calc(8 * var(--ps-u)); }
  .pss-pips i { width: calc(13 * var(--ps-u)); height: calc(13 * var(--ps-u)); border-radius: 50%; border: 1.5px solid var(--ps-sage-2); }
  .pss-pips i.own { background: var(--ps-sage-2); }
  .pss-pips i.gain { background: var(--ps-gold); border-color: var(--ps-gold); box-shadow: var(--ps-glow-gold); }
  .pss-stack { font-size: calc(18 * var(--ps-u)); color: var(--ps-gold); letter-spacing: .12em; }
  .pss-taken { position: absolute; inset: 0; display: grid; place-items: center; border-radius: inherit; font: italic 700 calc(72 * var(--ps-u))/1 var(--ps-font-display); color: var(--ps-gold); background: radial-gradient(closest-side, rgba(255,227,158,.32), rgba(18,56,46,.82)); opacity: 0; pointer-events: none; }
  .ps-root .pss-card:active { transform: translateY(calc(-6 * var(--ps-u))) scale(.98); }
  .ps-root .pss-card:focus-visible { outline: 2px solid var(--ps-gold); outline-offset: 6px; }
  @media (hover: hover) {
    .ps-root .pss-card:hover { transform: translateY(calc(-12 * var(--ps-u))); border-color: var(--ps-gold); box-shadow: var(--ps-shadow-lift), inset 0 0 0 calc(6 * var(--ps-u)) rgba(18,56,46,.6), inset 0 0 0 calc(7 * var(--ps-u)) rgba(255,227,158,.3), var(--ps-glow-gold); }
    .ps-root .pss-card:hover .pss-medal { color: var(--ps-gold); border-color: var(--ps-gold); box-shadow: var(--ps-glow-gold); }

  .ps-root .pss-card.maxed { opacity: .42; cursor: not-allowed; filter: saturate(.3); transform: none; border-color: var(--ps-border); box-shadow: var(--ps-shadow-panel); }

  .pss-card.taken .pss-medal { color: var(--ps-gold); border-color: var(--ps-gold); }
  .pss-card.taken .pss-taken { animation: ps-fadein .3s .12s var(--ps-ease) forwards; }
  .ps-root.pss.has-taken .pss-card:not(.taken) { opacity: .25; transform: scale(.95); pointer-events: none; }
  @keyframes pss-taken { 0% { box-shadow: 0 0 0 rgba(255,227,158,0); } 30% { box-shadow: 0 0 calc(90 * var(--ps-u)) rgba(255,227,158,.9); filter: brightness(1.4); } 100% { box-shadow: var(--ps-glow-gold); filter: none; } }
  .pss-build { margin-top: calc(54 * var(--ps-u)); display: flex; align-items: baseline; flex-wrap: wrap; justify-content: center; gap: calc(18 * var(--ps-u)); max-width: 90cqw; }

  .pss-buildv b { color: var(--ps-gold); }
  .pss-buildv .dot { color: var(--ps-sage); }
  .pss-buildv em { font-family: var(--ps-font-display); color: var(--ps-ink-dim); }

    .pss-sub { margin-top: calc(6 * var(--ps-u)); }
    .pss-cards { gap: calc(14 * var(--ps-u)); margin-top: calc(18 * var(--ps-u)); }
    .ps-root .pss-card { width: calc(236 * var(--ps-u)); height: max(176px, calc(200 * var(--ps-u))); padding: calc(16 * var(--ps-u)) calc(16 * var(--ps-u)) calc(13 * var(--ps-u)); }
    .ps-root .pss-card:active { transform: translateY(calc(-3 * var(--ps-u))) scale(.98); }
    .pss-medal { width: calc(42 * var(--ps-u)); height: calc(42 * var(--ps-u)); }
    .pss-name { margin-top: calc(9 * var(--ps-u)); font-size: calc(22 * var(--ps-u)); }
    .pss-desc { margin-top: calc(6 * var(--ps-u)); font-size: max(12px, calc(13 * var(--ps-u))); line-height: 1.35; max-width: none; }
    .pss-foot { gap: calc(9 * var(--ps-u)); }
    .pss-pips { gap: calc(5 * var(--ps-u)); }
    .pss-pips i { width: calc(8 * var(--ps-u)); height: calc(8 * var(--ps-u)); }
    .pss-stack { font-size: calc(11 * var(--ps-u)); }
    .pss-taken { font-size: calc(34 * var(--ps-u)); }
    .pss-build { margin-top: calc(16 * var(--ps-u)); gap: calc(10 * var(--ps-u)); }
    .pss-buildv { font-size: calc(13 * var(--ps-u)); }
  }
  .pss-glyph { display: block; width: 48%; height: 48%; background: currentColor; -webkit-mask: var(--glyph) center / contain no-repeat; mask: var(--glyph) center / contain no-repeat; }
  .ps-root .pss-card:active .pss-taken { animation: ps-fadein .12s var(--ps-ease) forwards; }
  .pss-buildv b { margin-left: .2em; }
  .pss-pips > span { display: contents; }
  .mask { display: block; background: currentColor; -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
</style>
<div class="ps-root pss" role="dialog" aria-modal="true">
  <div class="ps-veil"></div>
  <div class="pss-wrap">
    <span class="pss-orn"><span class="i mask" style="--m: url(&quot;data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cellipse cx=%2212%22 cy=%226.8%22 rx=%223.3%22 ry=%224.6%22 fill=%22%23000%22/%3E%3Cellipse cx=%2212%22 cy=%226.8%22 rx=%223.3%22 ry=%224.6%22 fill=%22%23000%22 transform=%22rotate%2872 12 12%29%22/%3E%3Cellipse cx=%2212%22 cy=%226.8%22 rx=%223.3%22 ry=%224.6%22 fill=%22%23000%22 transform=%22rotate%28144 12 12%29%22/%3E%3Cellipse cx=%2212%22 cy=%226.8%22 rx=%223.3%22 ry=%224.6%22 fill=%22%23000%22 transform=%22rotate%28216 12 12%29%22/%3E%3Cellipse cx=%2212%22 cy=%226.8%22 rx=%223.3%22 ry=%224.6%22 fill=%22%23000%22 transform=%22rotate%28288 12 12%29%22/%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%222.4%22 fill=%22%23ffe39e%22/%3E%3C/svg%3E&quot;)"></span></span>
    <h1 class="pss-title" data-text="shrine_title"></h1>
    <p class="pss-sub" data-bind="subtitle"></p>
    <div class="pss-cards" data-each="options">
      <template>
        <button class="pss-card" data-class-maxed="maxed" data-attr-disabled="maxed" data-action="choose" data-key="Digit{index1}">
          <span class="pss-medal"><span class="pss-glyph" data-style---glyph="glyph"></span></span>

</div>
