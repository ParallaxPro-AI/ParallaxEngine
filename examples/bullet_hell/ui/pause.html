<link rel="stylesheet" href="garden.css">
<style>
  .psp { position: fixed; inset: 0; display: grid; place-items: center; padding: 12px calc(var(--ps-sa-r) + 12px) 12px calc(var(--ps-sa-l) + 12px); pointer-events: auto; }
  .psp-card { position: relative; width: min(100%, calc(560 * var(--ps-u))); max-height: calc(100cqh - 24px); overflow-y: auto; padding: calc(52 * var(--ps-u)) calc(64 * var(--ps-u)) calc(44 * var(--ps-u)); display: flex; flex-direction: column; align-items: center; text-align: center; animation: ps-rise .26s var(--ps-ease); }
  .psp-orn { width: calc(44 * var(--ps-u)); height: calc(44 * var(--ps-u)); margin-bottom: calc(18 * var(--ps-u)); color: var(--ps-moon); }
  .psp-orn .i { width: 100%; height: 100%; }
  .psp-title { font: 600 var(--ps-fs-title)/1 var(--ps-font-display); letter-spacing: .22em; padding-left: .22em; text-transform: uppercase; color: var(--ps-ink); }
  .psp-stack { display: flex; flex-direction: column; width: 100%; gap: calc(16 * var(--ps-u)); margin-top: calc(40 * var(--ps-u)); }
  .ps-root .psp-stack .ps-btn { width: 100%; }
  .psp-hint { margin-top: calc(30 * var(--ps-u)); font: 600 var(--ps-fs-label)/1 var(--ps-font-ui); letter-spacing: .1em; color: var(--ps-ink-dim); }
  @media (pointer: coarse) { .psp-hint { display: none; } }
  @container (max-height: 500px) {
    .psp-card { width: min(100%, calc(340 * var(--ps-u))); padding: calc(20 * var(--ps-u)) calc(28 * var(--ps-u)) calc(22 * var(--ps-u)); }
    .psp-orn { width: calc(20 * var(--ps-u)); height: calc(20 * var(--ps-u)); margin-bottom: calc(8 * var(--ps-u)); }
    .psp-stack { gap: calc(9 * var(--ps-u)); margin-top: calc(16 * var(--ps-u)); }
    .psp-hint { margin-top: calc(14 * var(--ps-u)); }
  }
  .mask { display: block; background: currentColor; -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
</style>
<div class="ps-root psp">
  <div class="ps-veil"></div>
  <div class="ps-panel psp-card" role="dialog" aria-modal="true" aria-label="Paused">
    <span class="psp-orn"><span class="i mask" style="--m: url(&quot;data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath d=%22M15.5 3.2A9 9 0 1 0 20.8 16 7.2 7.2 0 1 1 15.5 3.2z%22 fill=%22%23000%22/%3E%3C/svg%3E&quot;)"></span></span>
    <h1 class="psp-title" data-text="paused"></h1>
    <div class="psp-stack">
      <button class="ps-btn ps-btn-leaf" data-action="resume"><span class="i mask" style="--m: url(&quot;data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath d=%22M8 5.5v13l10.5-6.5z%22 fill=%22%23000%22/%3E%3C/svg%3E&quot;)"></span><span data-text="resume"></span></button>
      <button class="ps-btn" data-action="settings" data-text="settings"></button>
      <button class="ps-btn" data-action="quit" data-text="quit_run"></button>
    </div>
    <p class="psp-hint"><span data-text="press"></span> <span class="ps-key">P</span> <span data-text="to_resume"></span></p>
  </div>
</div>
