<div id="dm-root" class="dl" data-class-dm-low="low" data-class-dm-scoped="scoped" data-class-dm-elim="eliminated"
     data-style---dm-feed="feed_seconds" data-style---dm-banner="banner_seconds">
  <div id="dm-score">
    <div><span class="lbl" data-text="score_label"></span><span class="dm-num dm-scoreval num" data-bind="score"></span><span class="dm-streak num" data-bind="streak_text"></span></div>
    <div>
      <span class="lbl num"><span data-text="round_word"></span> <b data-bind="round"></b> / <span data-bind="rounds"></span></span>
      <span class="dm-rname" data-bind="round_name"></span>
      <span class="dm-segs" data-each="segs"><template><i data-class-on="on"></i></template></span>
      <span class="lbl num"><b data-bind="frags"></b> / <span data-bind="frag_target"></span> <span data-text="frags_word"></span> · <span data-bind="alive"></span> <span data-text="on_field"></span></span>
    </div>
    <div><span class="lbl" data-text="lives_label"></span><span class="dm-num num" data-bind="lives"></span><span class="dm-pips" data-each="pips"><template><i data-class-on="on"></i></template></span></div>
  </div>

  <div id="dm-feed" data-each="feed"><template>
    <div class="dm-fl" data-class-death="death" data-class-buff="buff" data-class-elite="elite" data-class-streak="streak">
      <span data-bind="text"></span><b data-show="points" data-bind="points"></b><small class="num" data-show="multiplier" data-bind="multiplier"></small>
    </div>
  </template></div>

  <div id="dm-tl">
    <div class="dm-sector"><span class="lbl" data-text="sector_label"></span><span class="dm-sector-name" data-bind="sector"></span></div>
    <div id="dm-perks" data-each="perks"><template><span class="dl-chip"><span class="g" data-bind="icon"></span><span data-bind="name"></span></span></template></div>
  </div>

  <div id="dm-clock"><span class="lbl" data-text="run_label"></span><span class="num" data-bind="clock"></span></div>

  <div id="dm-vitals">
    <div class="dm-vrow dm-hp"><span class="lbl" data-text="health_label"></span><span class="dm-vnum num"><span data-bind="health"></span><small>/<span data-bind="health_max"></span></small></span><span class="bar"><i data-style-width="health_fill"></i></span></div>
    <div class="dm-vrow dm-ar"><span class="lbl" data-text="armor_label"></span><span class="dm-vnum num"><span data-bind="armor"></span><small>/<span data-bind="armor_max"></span></small></span><span class="bar"><i data-style-width="armor_fill"></i></span></div>
  </div>

  <div id="dm-weapon" data-class-reloading="reloading">
    <span class="dm-wname" data-bind="weapon"></span>
    <span class="dm-ammo num"><span class="dm-mag" data-class-low="mag_low" data-bind="loaded"></span><span class="dm-res">/ <span data-bind="reserve"></span></span></span>
    <span class="dm-reload"><span data-text="reloading"></span> <span class="bar"><i></i></span></span>
  </div>

  <div id="dm-loadout" data-each="slots"><template>
    <div class="dm-slot" data-class-on="on"><span class="k num" data-bind="key"></span><span class="n"><span data-bind="label"></span><em class="num" data-bind="count"></em></span></div>
  </template></div>

  <div id="dm-banner" data-class-on="banner_on">
    <div class="dm-rs-big"><span data-text="round_word"></span> <span data-bind="round"></span></div>
    <div class="dm-rs-sub" data-bind="round_name"></div>
    <div class="dm-rs-tag" data-bind="tagline"></div>
    <div class="dm-rs-target"><span class="lbl num"><span data-text="frag_target_label"></span> <b data-bind="frag_target"></b></span><span class="lbl num"><span data-text="bots_label"></span> <b data-bind="roster"></b></span></div>
  </div>

  <div id="dm-respawn" data-class-on="eliminated" aria-live="assertive">
    <div class="dm-e-title" data-text="eliminated"></div>
    <div class="dm-e-sub num"><span data-text="respawning_in"></span> <b data-bind="respawn_in"></b>…</div>
    <span class="bar dm-e-bar"><i data-style-width="respawn_fill"></i></span>
    <div class="dm-e-lives"><span class="dm-pips" data-each="pips"><template><i data-class-on="on"></i></template></span><span class="lbl num"><b data-bind="lives"></b> <span data-text="lives_left"></span></span></div>
  </div>

</div>
