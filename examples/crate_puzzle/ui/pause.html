<link rel="stylesheet" href="dockbot.css">
<link rel="stylesheet" href="menus.css">
<div class="scrim">
  <div class="card">
    <i class="br tl"></i><i class="br tr"></i><i class="br bl"></i><i class="br bR"></i>
    <div class="paused"><div class="glyph"><i></i><i></i></div><h2 class="title" data-text="paused"></h2></div>
    <div class="rule"><i></i></div>
    <div class="label" data-text="graphics"></div>
    <div class="seg">
      <button class="opt" data-action="quality" data-quality="low" data-class-on="low" data-text="low"></button>
      <button class="opt" data-action="quality" data-quality="medium" data-class-on="medium" data-text="medium"></button>
      <button class="opt" data-action="quality" data-quality="high" data-class-on="high" data-text="high"></button>
    </div>
    <div class="actions">
      <button class="btn btn--primary" data-action="resume" data-text="resume"></button>
      <button class="btn" data-action="quit" data-text="menu"></button>
    </div>
    <p class="label center desktop-only" style="margin-top: 18px"><span data-text="press"></span> <span class="kbd">P</span> <span data-text="to_resume"></span></p>
  </div>
</div>
