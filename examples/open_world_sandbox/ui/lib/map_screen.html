<link rel="stylesheet" href="theme.css">
<style>
  .lib-map { position: fixed; overflow: hidden; background: var(--lib-panel); border: 1px solid var(--lib-line); }
  .lib-map.corner { right: 12px; bottom: 12px; width: 11em; height: 11em; border-radius: var(--lib-radius); }
  .lib-map.corner.round { border-radius: 50%; }
  .lib-map.full { inset: 6cqh 6cqw; border-radius: var(--lib-radius); }
  .lib-map .turn { position: absolute; inset: 0; }
  .lib-map .base { position: absolute; max-width: none; opacity: 0.95; filter: sepia(0.35) hue-rotate(150deg) saturate(1.4); }
  .lib-map .route { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; }
  .lib-map .icon { position: absolute; transform: translate(-50%, -50%); text-shadow: 0 0 2px #000; white-space: nowrap; }
  .lib-map .icon i { display: inline-block; font-style: normal; }
  .lib-map .icon small { margin-left: 0.3em; color: var(--lib-ink); }
  .lib-map .me { position: absolute; left: 50%; top: 50%; }
  .lib-map .me b { position: absolute; left: -0.5em; top: -0.62em; width: 1em; text-align: center; color: #5ad1ff; }
</style>
<div class="lib-hud" data-show="shown">
  <div class="lib-map full" data-class-round="round">
    <div class="turn" data-style-transform="turn">
      <img class="base" alt="" data-show="base" data-attr-src="base" data-style-left="base_left" data-style-top="base_top" data-style-width="base_width" data-style-height="base_height">
      <img class="route" alt="" data-show="has_route" data-attr-src="route_image">
    </div>
    <div data-each="icons"><template>
      <span class="icon" data-class-edge="edge" data-style-left="x" data-style-top="y" data-style-color="color" data-style-font-size="size"><i data-style-transform="turn" data-bind="glyph"></i><small data-bind="label"></small></span>
    </template></div>
    <span class="me"><b data-style-transform="player_turn">▲</b></span>
  </div>
</div>
