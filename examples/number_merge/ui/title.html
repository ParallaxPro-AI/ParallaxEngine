<link rel="stylesheet" href="twofold.css">
<style>

    max-height: calc(calc(1080 * var(--u)) - calc(32 * var(--u))); overflow-y: auto; padding: calc(40 * var(--u)) calc(38 * var(--u)) calc(34 * var(--u)); text-align: center;
    border-radius: calc(16 * var(--u)); border: calc(1 * var(--u)) solid rgba(237, 194, 46, 0.35);

    box-shadow: 0 calc(24 * var(--u)) calc(70 * var(--u)) rgba(0, 0, 0, 0.55), 0 0 calc(50 * var(--u)) rgba(237, 194, 46, 0.16), inset 0 calc(1 * var(--u)) 0 rgba(255, 235, 190, 0.08);

  .best b { color: var(--gold); font-size: calc(18 * var(--u)); letter-spacing: calc(1 * var(--u)); }

    text-transform: uppercase; cursor: pointer; border-radius: calc(12 * var(--u)); border: calc(2 * var(--u)) solid transparent;

<div class="view">

</div>
