<style>

:root { container-type: size; --u: min(100cqw / 1920, 100cqh / 1080, 1px); }

#gw-hud .legend span{display:flex;gap:calc(.4 * var(--gw-r))}

<div class="gw" id="gw-hud" data-class-is-night="night" data-class-is-hurt="hurt">
<div class="vig night"></div>
<div class="vig hurt"></div>
<section class="vitals gw-panel">
<div class="lives" data-show="challenge"><b data-text="expedition_lives"></b><span class="hearts" data-each="hearts"><template><img class="gw-ic" data-attr-src="picture" alt=""></template></span></div>
<div class="vital hp"><img class="gw-ic" src="../assets/images/icons/heart.svg" alt=""><div class="lbl"><span data-text="hud_health"></span><div class="gw-bar"><i data-style---v="health_pct"></i></div></div><b class="val" data-bind="health"></b></div>
<div class="vital hu" data-class-low="hunger_low"><img class="gw-ic" src="../assets/images/icons/cooked_meat.svg" alt=""><div class="lbl"><span data-text="hud_hunger"></span><div class="gw-bar"><i data-style---v="hunger_pct"></i></div></div><b class="val" data-bind="hunger"></b></div>
<div class="airrow" data-show="underwater"><span class="bubbles" data-each="bubbles"><template><i data-class-on="on"></i></template></span><b><span data-text="hud_air"></span> <span data-bind="air"></span>s</b></div>
</section>
<button class="pause gw-panel" data-action="pause" aria-label="Pause"><span><i></i><i></i></span></button>
<div class="cap gw-panel"><div class="bars"><div class="gw-bar hp"><i data-style---v="health_pct"></i></div><div class="gw-bar hu" data-class-low="hunger_low"><i data-style---v="hunger_pct"></i></div></div><span class="clk"><span data-text="day_short"></span><span data-bind="day"></span> <span data-bind="clock"></span></span><i class="sun"></i></div>
<div class="quest gw-panel gw-pill" data-show="objective"><i class="gw-diamond"></i><div class="q"><small data-text="hud_objective"></small><span data-bind="objective"></span></div></div>
<div class="siege" data-show="siege_left"><div class="t"><span data-text="hud_siege"></span> <b data-bind="siege_clock"></b></div><div class="s" data-text="siege_sub"></div></div>
<section class="world gw-panel">
<div class="clock"><i class="sun"></i><span><span data-text="hud_day"></span> <span data-bind="day"></span> · <span data-bind="clock"></span></span></div>
<dl class="facts"><dt data-text="hud_tool"></dt><dd data-bind="tool"></dd><dt>X / Y / Z</dt><dd data-bind="coordinates"></dd></dl>
</section>
<div class="aim"><div class="target" data-show="target"><span data-bind="target"></span><span data-show="target_usable"> · <span data-text="hud_press_use"></span></span></div><div class="mine" data-show="mining"><i data-style-width="mining_pct"></i></div><div class="blocked" data-show="too_weak"><i></i><span data-bind="too_weak"></span></div></div>
</div>
