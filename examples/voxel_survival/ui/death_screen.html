<link rel="stylesheet" href="greenwood.css">
<style>
/* Old-engine desktop UI scale: authored px drew at min(view/1920x1080, 1); --u is one such px, measured against the game view (the host is a size container). */
:root { container-type: size; --u: min(100cqw / 1920, 100cqh / 1080, 1px); }

#gw-death{position:fixed;inset:0;pointer-events:none}
#gw-death .fade{position:absolute;inset:0;background:radial-gradient(ellipse 80% 75% at 50% 50%,rgba(70,10,10,.62) 0%,rgba(22,3,3,.94) 100%);animation:gw-fade .4s ease-out both}
#gw-death .col{position:absolute;inset:0;padding:0 calc(4.8 * var(--gw-r));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(2.2 * var(--gw-r));text-align:center}
#gw-death h1{font:900 calc(15.4 * var(--gw-r))/.9 var(--gw-font-display);color:var(--gw-ink);text-shadow:0 calc(.5 * var(--gw-r)) 0 #4a1414,0 0 calc(6 * var(--gw-r)) rgba(220,40,40,.45);animation:gw-slam .5s .25s var(--gw-ease) both}
#gw-death p{max-width:40ch;font:700 calc(2.5 * var(--gw-r))/1.4 var(--gw-font-ui);color:var(--gw-ink-2);animation:gw-fade .4s .4s ease-out both}
#gw-death .bag{display:flex;align-items:center;gap:calc(1 * var(--gw-r));padding:calc(.8 * var(--gw-r)) calc(1.6 * var(--gw-r)) calc(.8 * var(--gw-r)) calc(1 * var(--gw-r));border-radius:calc(999 * var(--u));background:rgba(23,34,29,.8);border:calc(1.5 * var(--u)) solid rgba(245,207,118,.35);font:800 calc(1.7 * var(--gw-r))/1.2 var(--gw-font-ui);color:var(--gw-gold);font-variant-numeric:tabular-nums;animation:gw-fade .4s .5s ease-out both}
#gw-death .bag .gw-ic{width:calc(2.4 * var(--gw-r));height:calc(2.4 * var(--gw-r))}
#gw-death .ret{width:calc(32 * var(--gw-r));height:calc(.8 * var(--gw-r));border-radius:calc(.5 * var(--gw-r));background:rgba(0,0,0,.5);box-shadow:0 0 0 calc(1 * var(--u)) rgba(252,165,165,.2);overflow:hidden}
#gw-death .ret i{display:block;height:100%;border-radius:calc(.5 * var(--gw-r));background:var(--gw-bad);animation:gw-fill 3s linear both}
#gw-death .lives{display:flex;align-items:center;gap:calc(1.2 * var(--gw-r));font:800 calc(1.7 * var(--gw-r))/1.2 var(--gw-font-ui);color:var(--gw-bad)}
#gw-death .lives .hearts{display:flex;gap:calc(.6 * var(--gw-r))}
#gw-death .lives .gw-ic{width:calc(2.6 * var(--gw-r));height:calc(2.6 * var(--gw-r))}
@media (pointer:coarse){
#gw-death .col{bottom:calc(2.1 * var(--gw-r));gap:calc(1.2 * var(--gw-r))}
#gw-death h1{font-size:calc(7.2 * var(--gw-r));text-shadow:0 calc(.3 * var(--gw-r)) 0 #4a1414,0 0 calc(3.6 * var(--gw-r)) rgba(220,40,40,.45)}
#gw-death p{font-size:calc(1.5 * var(--gw-r))}
#gw-death .bag{gap:calc(.8 * var(--gw-r));padding:calc(.5 * var(--gw-r)) calc(1.2 * var(--gw-r)) calc(.5 * var(--gw-r)) calc(.8 * var(--gw-r));font-size:calc(1.3 * var(--gw-r))}
#gw-death .bag .gw-ic{width:calc(1.8 * var(--gw-r));height:calc(1.8 * var(--gw-r))}
#gw-death .ret{width:calc(20 * var(--gw-r));height:calc(.6 * var(--gw-r));border-radius:calc(.4 * var(--gw-r))}
#gw-death .lives{gap:calc(.8 * var(--gw-r));font-size:calc(1.3 * var(--gw-r))}
#gw-death .lives .hearts{gap:calc(.4 * var(--gw-r))}
#gw-death .lives .gw-ic{width:calc(1.8 * var(--gw-r));height:calc(1.8 * var(--gw-r))}
}
</style>
<div class="gw" id="gw-death">
<div class="fade"></div>
<div class="col">
<h1 data-text="death_title"></h1>
<p data-text="death_grave_hint"></p>
<div class="lives" data-show="challenge"><span class="hearts" data-each="hearts"><template><img class="gw-ic" data-attr-src="picture" alt=""></template></span><span data-bind="lives_text"></span></div>
<button class="gw-btn primary" data-action="respawn" data-key="Enter" data-text="death_respawn"></button>
</div>
</div>
