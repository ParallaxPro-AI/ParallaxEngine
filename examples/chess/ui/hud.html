<!-- Ported from the template: chess match HUD - side columns around the board with difficulty, material, captured pieces, whose turn, the move list, a check banner, a Resign button and a touch pause button -->
<link rel="stylesheet" href="kit.css">
<style>
  .mh { position: fixed; inset: 0; pointer-events: none; }
  .mh-col {
    position: absolute; display: flex; flex-direction: column; gap: var(--cx-gap-col);
    --mh-w: max(0px, min(var(--cx-col-max), calc(50cqw - var(--cx-board-half) - var(--cx-col-gap) - var(--cx-edge))));
    width: var(--mh-w);
    top: calc(50cqh - var(--cx-board-half));
    height: calc(var(--cx-board-half) * 2);
  }
  .mh-left { left: calc(50cqw - var(--cx-board-half) - var(--cx-col-gap) - var(--mh-w)); }
  .mh-right { right: calc(50cqw - var(--cx-board-half) - var(--cx-col-gap) - var(--mh-w)); }

  .mh-diffrow { display: block; }
  .mh-diffval { font: 500 var(--cx-fs-value)/1.05 var(--cx-f-display); margin-top: var(--cx-s-2); display: block; }
  .mh-mat { font: 600 calc(var(--cx-fs-mono) * 1.1)/1 var(--cx-f-mono); }
  .mh-mat[data-tone="pos"] { color: var(--cx-pos); }
  .mh-mat[data-tone="neg"] { color: var(--cx-neg); }
  .mh-mat[data-tone="even"] { color: var(--cx-ink-2); }

  .mh-caps { margin-top: var(--cx-s-2); }
  .mh-cap { display: grid; grid-template-columns: var(--cx-cap-k) 1fr; align-items: center; gap: var(--cx-s-3); padding: var(--cx-s-3) 0; border-top: 1px solid var(--cx-line); }
  .mh-cap:first-child { border-top: 0; }
  .mh-cap-k { font: 500 var(--cx-fs-label)/1 var(--cx-f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--cx-ink-2); }
  .mh-cap .cx-glyphs { word-break: break-all; }

  .mh-hint { margin-top: auto; align-self: flex-start; padding: var(--cx-s-3) var(--cx-s-4); background: var(--cx-panel); border: 1px solid var(--cx-line); box-shadow: var(--cx-shadow-panel); }
  .mh-hint .cx-kbd { background: var(--cx-bg-1); }

  .mh-turnp { position: relative; min-height: var(--cx-turn-h); transition: border-color var(--cx-t-med) var(--cx-ease); }
  .mh-turn { display: flex; align-items: center; gap: var(--cx-s-4); margin-top: var(--cx-s-4); }
  .mh-pip { flex: none; width: var(--cx-pip); height: var(--cx-pip); background: var(--cx-accent); transform: rotate(45deg); transition: all var(--cx-t-med) var(--cx-ease); }
  .mh-turn-text { font: 600 var(--cx-fs-turn)/1.15 var(--cx-f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--cx-accent); transition: color var(--cx-t-med) var(--cx-ease); }
  .mh[data-turn="you"] .mh-turnp { border-color: var(--cx-accent-line); }
  .mh[data-turn="thinking"] .mh-pip { background: transparent; box-shadow: inset 0 0 0 1px var(--cx-ink-3); }
  .mh[data-turn="thinking"] .mh-turn-text { color: var(--cx-ink-2); }
  .mh[data-turn="over"] .mh-pip { background: var(--cx-ink-3); }
  .mh[data-turn="over"] .mh-turn-text { color: var(--cx-ink-3); }
  .mh-dots { position: absolute; top: calc(var(--cx-pad-panel) + 3px); right: var(--cx-pad-panel); display: none; gap: 5px; }
  .mh[data-turn="thinking"] .mh-dots { display: flex; }
  .mh-dots i { width: 5px; height: 5px; background: var(--cx-ink-2); animation: mh-think 1.2s var(--cx-ease) infinite; }
  .mh-dots i:nth-child(2) { animation-delay: .15s; }
  .mh-dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes mh-think { 0%, 70%, 100% { opacity: .2; } 35% { opacity: 1; } }

  .mh-logp { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .mh-log { list-style: none; padding: 0; margin: var(--cx-s-3) 0 0; overflow-y: auto; flex: 1; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--cx-line-2) transparent; pointer-events: auto; }
  .mh-log li { display: grid; grid-template-columns: var(--cx-log-n) 1fr 1fr; align-items: baseline; padding: var(--cx-log-py) var(--cx-s-2); font: 400 var(--cx-fs-mono)/1.3 var(--cx-f-mono); color: var(--cx-ink); }
  .mh-log li:nth-child(odd) { background: rgba(245,245,244,.03); }
  .mh-log .mh-n { color: var(--cx-ink-3); font-size: .85em; }
  .mh-log .mh-last { color: var(--cx-accent); }
  .mh-log li.mh-empty { display: block; background: none; padding: var(--cx-s-2) 0; font: italic 400 var(--cx-fs-body)/1.3 var(--cx-f-display); color: var(--cx-ink-3); }

  .mh-resign { width: 100%; flex: none; }
  .mh-resign.cx-btn.cx-danger { background: var(--cx-panel); box-shadow: var(--cx-shadow-panel); }
  .mh-resign.cx-btn.cx-danger:hover { background: #2a1c19; }
  .mh-resign.cx-btn:disabled { background: var(--cx-panel); }
  .mh-resign svg { width: 1em; height: 1em; flex: none; }

  .mh-banner {
    position: absolute; z-index: 2; left: 50%; transform: translateX(-50%);
    top: calc(50cqh - var(--cx-board-half) + (var(--cx-frame-band) - var(--cx-banner-h)) / 2);
    width: min(calc(480 * var(--cx-u)), calc(var(--cx-board-half) * 2 - 4cqh));
    height: var(--cx-banner-h);
    display: flex; align-items: center; justify-content: center; gap: var(--cx-s-3); padding: 0 var(--cx-s-4); text-align: center;
    background: var(--cx-bg-1); border: 1px solid var(--cx-accent); color: var(--cx-accent);
    font: 600 var(--cx-fs-turn)/1.1 var(--cx-f-display); letter-spacing: .12em; text-transform: uppercase;
    box-shadow: var(--cx-shadow-panel); animation: mh-banner-in var(--cx-t-med) var(--cx-ease) both;
  }
  .mh-banner[data-tone="danger"] { border-color: var(--cx-danger); color: var(--cx-danger-ink); background: #2a1c19; }
  .mh-bpip { flex: none; width: calc(var(--cx-pip) * .8); height: calc(var(--cx-pip) * .8); background: currentColor; transform: rotate(45deg); }
  @keyframes mh-banner-in { from { opacity: 0; margin-top: -10px; } }

  .mh-pause {
    position: absolute; top: max(8px, calc(50cqh - var(--cx-board-half))); right: max(10px, env(safe-area-inset-right, 0px));
    width: 44px; height: 44px; padding: 0; display: none; place-items: center;
    background: var(--cx-touch-fill); border: 1px solid var(--cx-touch-stroke); color: var(--cx-touch-ink);
    box-shadow: 0 8px 20px rgba(0,0,0,.3); cursor: pointer; pointer-events: auto;
    transition: background var(--cx-t-fast), border-color var(--cx-t-fast), color var(--cx-t-fast), transform var(--cx-t-fast);
  }
  .mh-pause:active { background: var(--cx-touch-fill-pressed); border-color: var(--cx-accent); color: var(--cx-accent); transform: scale(.96); }
  .mh-pause svg { width: 16px; height: 16px; }

  .mh-tall-only { display: block; }
  .mh-short-only { display: none; }

  @media (pointer: coarse) {
    .mh-pause { display: grid; }
    .mh-hint { display: none; }
    .mh-right { top: calc(50cqh - var(--cx-board-half) + 54px); height: calc(var(--cx-board-half) * 2 - 54px); }
  }

  @container (max-height: 500px) {
    .mh-tall-only { display: none; }
    .mh-short-only { display: block; }
    .mh-pause { display: grid; }
    .mh-hint { display: none; }
    .mh-right { top: calc(50cqh - var(--cx-board-half) + 54px); height: calc(var(--cx-board-half) * 2 - 54px); }
    .mh-diffrow { display: flex; justify-content: space-between; align-items: baseline; gap: var(--cx-s-3); }
    .mh-diffval { margin-top: 0; line-height: 1; }
    .mh-banner {
      left: calc(50cqw - var(--cx-board-half) - var(--cx-col-gap) - max(0px, min(var(--cx-col-max), calc(50cqw - var(--cx-board-half) - var(--cx-col-gap) - var(--cx-edge)))));
      transform: none; top: calc(50cqh - var(--cx-board-half));
      width: max(0px, min(var(--cx-col-max), calc(50cqw - var(--cx-board-half) - var(--cx-col-gap) - var(--cx-edge))));
      font-size: var(--cx-fs-turn); line-height: 1.2;
    }
  }

  /* Portrait: the camera's minWidth fits the board to the screen WIDTH, so
     the side columns have no room. Stack them above and below the board. */
  @container (max-aspect-ratio: 1/1) {
    .mh { --cx-board-half: 46.08cqw; --mh-band: calc(50cqh - var(--cx-board-half) - var(--cx-col-gap)); }
    .mh-tall-only { display: block; }
    .mh-short-only { display: none; }
    .mh-col { left: var(--cx-edge); right: var(--cx-edge); width: auto; }
    .mh-left {
      top: calc(env(safe-area-inset-top, 0px) + 116px); height: auto;
      max-height: calc(var(--mh-band) - 116px); flex-direction: row; align-items: stretch;
    }
    .mh-left > .cx-panel { flex: 1 1 0; min-width: 0; }
    .mh-right {
      top: calc(50cqh + var(--cx-board-half) + var(--cx-col-gap)); height: auto;
      bottom: max(var(--cx-edge), env(safe-area-inset-bottom, 0px));
      display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto minmax(0, 1fr);
    }
    .mh-right > .mh-turnp { grid-column: 1; grid-row: 1; min-height: 0; }
    .mh-right > .mh-turnp .cx-label { display: none; }
    .mh-right > .mh-turnp .mh-turn { margin-top: 0; }
    .mh-right > .mh-resign { grid-column: 2; grid-row: 1; width: auto; height: auto; align-self: stretch; }
    .mh-right > .mh-logp { grid-column: 1 / -1; grid-row: 2; }
    .mh-pause { top: max(10px, env(safe-area-inset-top, 0px)); width: 96px; height: 96px; }
    .mh-pause svg { width: 34px; height: 34px; }
    .mh-right > .mh-resign { font-size: var(--cx-fs-btn); }
    .mh-banner { left: 50%; transform: translateX(-50%); top: calc(50cqh - var(--cx-board-half) - var(--cx-banner-h) - 8px); width: calc(100cqw - 2 * var(--cx-edge)); }
  }
</style>
<div class="cx-root mh" data-attr-data-turn="turn_state">
  <div class="mh-banner" data-attr-data-tone="banner_tone" data-show="banner_on" role="status" aria-live="assertive"><i class="mh-bpip"></i><span data-bind="banner"></span></div>

  <button class="mh-pause" data-action="pause" aria-label="Pause"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" fill="currentColor"/></svg></button>

  <aside class="mh-col mh-left">
    <section class="cx-panel mh-turnp mh-short-only" aria-live="polite">
      <div class="cx-label" data-text="turn_label"></div>
      <div class="mh-turn"><i class="mh-pip"></i><span class="mh-turn-text" data-bind="turn"></span></div>
      <div class="mh-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </section>
    <section class="cx-panel">
      <div class="mh-diffrow"><span class="cx-label" data-text="stat_difficulty"></span><span class="mh-diffval" data-bind="difficulty"></span></div>
      <div class="cx-rule"></div>
      <div class="cx-row"><span class="cx-label" data-text="material_label"></span><span class="mh-mat" data-attr-data-tone="advantage_tone" data-bind="advantage"></span></div>
    </section>
    <section class="cx-panel">
      <div class="cx-label" data-text="captured_label"></div>
      <div class="mh-caps">
        <div class="mh-cap"><span class="mh-cap-k">You</span><span class="cx-glyphs" data-class-is-dim="none_by_you" data-bind="taken_by_you"></span></div>
        <div class="mh-cap"><span class="mh-cap-k">Them</span><span class="cx-glyphs is-dim" data-bind="taken_by_them"></span></div>
      </div>
    </section>
    <div class="cx-keyhint mh-hint"><span class="cx-kbd">P</span><span data-text="pause"></span></div>
  </aside>

  <aside class="mh-col mh-right">
    <section class="cx-panel mh-turnp mh-tall-only" aria-live="polite">
      <div class="cx-label" data-text="turn_label"></div>
      <div class="mh-turn"><i class="mh-pip"></i><span class="mh-turn-text" data-bind="turn"></span></div>
      <div class="mh-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    </section>
    <section class="cx-panel mh-logp">
      <div class="cx-label" data-text="moves_label"></div>
      <ol class="mh-log" id="mh-log" aria-label="Move list">
        <li class="mh-empty" data-hide="has_moves">No moves yet.</li>
        <div style="display:contents" data-each="move_log">
          <template>
            <li><span class="mh-n" data-bind="number"></span><span data-class-mh-last="white_last" data-bind="white"></span><span data-class-mh-last="black_last" data-bind="black"></span></li>
          </template>
        </div>
      </ol>
    </section>
    <button class="cx-btn cx-danger mh-resign" data-action="resign" data-attr-disabled="over"><svg viewBox="0 0 18 18" aria-hidden="true"><path d="M4 1.5v15M4 3h10l-2.5 3.25L14 9.5H4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span data-text="resign"></span></button>
  </aside>
</div>
<script>
  // Presentation only: keep the newest move in view.
  (function () {
    var log = document.getElementById('mh-log');
    new MutationObserver(function () { log.scrollTop = log.scrollHeight; }).observe(log, { childList: true, subtree: true });
  })();
</script>
