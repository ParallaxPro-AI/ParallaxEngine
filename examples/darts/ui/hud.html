<div class="ta-root">
  <div class="strip ta-card">
    <div class="cell who d-only">
      <div class="tour" data-bind="tier"></div>
      <div class="leg" data-bind="leg_name"></div>
    </div>
    <div class="cell"><div class="ta-lbl" data-text="col_leg"></div><div class="num"><span data-bind="leg_number"></span><span class="dim">/<span data-bind="leg_count"></span></span></div></div>
    <div class="cell rem"><div class="ta-lbl" data-text="remaining_label"></div><div class="num big" data-bind="remaining"></div></div>
    <div class="cell"><div class="ta-lbl" data-text="darts_label"></div><div class="num"><span data-bind="darts"></span><span class="aside d-only"> (<span data-bind="total_darts"></span> <span data-text="total_label"></span>)</span></div></div>
    <div class="cell"><div class="ta-lbl" data-text="to_par_label"></div><div class="num" data-class-under="under_par" data-class-over="over_par" data-bind="to_par"></div></div>
    <div class="cell d-only"><div class="ta-lbl" data-text="score_label"></div><div class="num gold" data-bind="score"></div></div>
    <div class="cell cut"><div class="ta-lbl"><span class="d-only" data-text="cut_label"></span><span class="t-only">Cut</span></div><div class="num" data-class-warn="cut_close" data-bind="budget_left"></div></div>
    <button class="chip t-only" id="chip" aria-label="Leg details"><span class="ct" data-bind="tier"></span><span class="cs" data-bind="score"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
  </div>

  <div class="more t-only ta-card" id="more">
    <div class="mrow"><span class="mname" data-bind="leg_name"></span><span class="mpar">par <span data-bind="leg_par"></span></span></div>
    <div class="mrow"><span class="ta-lbl">Start</span><span class="mv" data-bind="leg_start"></span></div>
    <div class="mrow"><span class="ta-lbl" data-text="last_dart_label"></span><span class="mlast" data-class-miss="last_miss"><span data-bind="last_dart"></span> <small><span data-bind="last_value"></span> scored</small></span></div>
    <div class="mrow"><span class="ta-lbl" data-text="score_label"></span><span class="mscore" data-bind="score"></span></div>
  </div>

  <button class="menu t-only" data-action="pause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

  <div class="stack ta-card d-only">
    <div class="sec">
      <div class="ta-lbl" data-text="col_leg"></div>
      <div class="row"><span class="lname" data-bind="leg_name"></span><span class="par">par <span data-bind="leg_par"></span></span></div>
    </div>
    <div class="row start sec"><span class="ta-lbl">Start</span><span class="startv" data-bind="leg_start"></span></div>
    <div class="sec last-sec">
      <div class="ta-lbl" data-text="last_dart_label"></div>
      <div class="last" data-class-miss="last_miss" data-bind="last_dart"></div>
      <div class="last-sub"><span data-bind="last_value"></span> scored</div>
    </div>
  </div>

  <div class="draught ta-card d-only">
    <div class="ta-lbl" data-text="draught_label"></div>
    <div class="dial">
      <svg class="face" viewBox="0 0 140 140" fill="none"><circle cx="70" cy="70" r="66" stroke="rgba(230,190,130,.35)" stroke-width="1.5"/><circle cx="70" cy="70" r="52" stroke="rgba(230,190,130,.12)" stroke-width="1"/><path d="M70 6v10M70 124v10M6 70h10M124 70h10" stroke="#c9a15f" stroke-width="2" stroke-linecap="round"/></svg>
      <div class="needle" data-class-still="still_air" data-style-transform="needle"><i></i><b></b></div>
      <div class="hub"></div>
    </div>
    <div class="speed"><span data-bind="draught_speed" style="font:inherit;color:inherit"></span> <span>m/s</span></div>
    <div class="dlabel"><div class="dname" data-bind="draught_name"></div><div class="dfrom" data-bind="draught_from"></div></div>
  </div>

  <div class="mini t-only">
    <div class="mdial"><div class="needle" data-class-still="still_air" data-style-transform="needle"><i></i><b></b></div><div class="hub"></div></div>
    <div class="mspeed"><span data-bind="draught_speed" style="font:inherit;color:inherit"></span> <span>m/s</span></div>
    <div class="mdname" data-bind="draught_name"></div>
  </div>

  <div class="toast" data-class-show="callout_on" data-class-green="callout_green" data-class-red="callout_red"><span class="lab" data-bind="callout"></span><span class="pts" data-bind="callout_points"></span></div>

  <div class="power" data-class-on="aiming">
    <div class="head ta-lbl"><span data-text="power_label"></span><span class="c-lab">clean</span><span class="pct" data-class-in="in_band" data-bind="power_pct"></span></div>
    <div class="bar"><div class="band" data-style-left="band_left" data-style-width="band_width"></div><div class="fill" data-style-width="fill_width"></div><div class="mark" data-class-in="in_band" data-style-left="mark_left"></div></div>
    <div class="clean-row ta-lbl"><span data-style-left="band_mid">clean</span></div>
  </div>

  <div class="legend d-only">
    <div><span class="ta-key">A</span><span class="ta-key">D</span>Aim ◀▶</div>
    <div><span class="ta-key">W</span><span class="ta-key">S</span>Aim ▲▼</div>
    <div><span class="ta-key" style="min-width:calc(76 * var(--u))">Space</span>Hold, release to throw</div>
    <div><span class="ta-key">P</span>Pause</div>
  </div>

  <svg class="ring t-only" data-class-on="charging" viewBox="0 0 166 166" fill="none"><rect x="2" y="2" width="162" height="162" rx="42" stroke="rgba(240,190,110,.22)" stroke-width="3"/><rect x="2" y="2" width="162" height="162" rx="42" data-attr-stroke="ring_color" stroke-width="3" pathLength="100" data-attr-stroke-dasharray="ring_dash" stroke-linecap="round"/></svg>
</div>
<script>
  // Presentation only: the touch chip opens the leg details.
  (function () {
    var chip = document.getElementById('chip'), more = document.getElementById('more');
    chip.addEventListener('click', function () {
      var open = !chip.classList.contains('open');
      chip.classList.toggle('open', open);
      more.classList.toggle('open', open);
    });
  })();
</script>
