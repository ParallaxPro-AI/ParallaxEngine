<!-- A card in each chef's half, ported from the template's hud/chef_p1_card + chef_p2_card and
     hud/chef_task_p1 + chef_task_p2 (one PlayerPanel, so one file for both seats; seat 2
     takes the template's P2 side and colour). The card: Player n (left / right), the
     movement cross + interact key caps, what the chef is holding with its ingredient dot,
     the chef's own score. The station prompt: the interact key cap + the verb low in the
     half, dimmed with the reason when there is nothing to do there. The task banner: the
     STEP n chip (red while carrying burnt food), the next task, where to do it, and the
     feedback chip under it that pops in for each action and fades (green tick for progress,
     charcoal and red for a burn or a wrong dish). -->
<link rel="stylesheet" href="kitchen_kit.css">
<style>
  /* One seat's half of the vertical split: the design unit is the full screen's. */
  .kr-root { --kr-u: min(calc(200cqw / 1920), calc(100cqh / 1080)); --kr-safe-l: calc(var(--kr-u) * 28); --kr-safe-r: calc(var(--kr-u) * 28); --kr-safe-t: calc(var(--kr-u) * 28); --kr-safe-b: calc(var(--kr-u) * 28); }
  @media (pointer: coarse) { .kr-root { --kr-u: min(calc(200cqw / 844), calc(100cqh / 390)); } }
  .krc { position: fixed; top: var(--kr-safe-t); width: calc(var(--kr-u) * 300); padding: calc(var(--kr-u) * 16) calc(var(--kr-u) * 18) calc(var(--kr-u) * 14); display: flex; flex-direction: column; gap: calc(var(--kr-u) * 12); border-top: calc(var(--kr-u) * 4) solid var(--pc); pointer-events: none; z-index: 5; }
  .krc-p1 { left: var(--kr-safe-l); --pc: var(--kr-p1); }
  .krc-p2 { right: var(--kr-safe-r); --pc: var(--kr-p2); }
  .krc-head { display: flex; align-items: center; gap: calc(var(--kr-u) * 8); font: 400 calc(var(--kr-u) * 24)/1 var(--kr-font-display); color: var(--pc); }
  .krc-head .krc-who { font: inherit; color: inherit; }
  .krc-head span { font: 700 calc(var(--kr-u) * 15)/1 var(--kr-font-body); color: var(--kr-text-dim); }
  .krc-ctrls { display: flex; align-items: flex-end; gap: calc(var(--kr-u) * 10); }
  .krc-pad { display: grid; grid-template-columns: repeat(3, calc(var(--kr-u) * 32)); gap: calc(var(--kr-u) * 4); }
  .krc-pad .kr-key:first-child { grid-column: 2; }
  .krc-pad .kr-key:nth-child(2) { grid-column: 1; }
  .krc-ctrls .lbl { font: 700 calc(var(--kr-u) * 14)/1 var(--kr-font-body); color: var(--kr-text-dim); padding-bottom: calc(var(--kr-u) * 8); }
  .krc-ctrls .sep { flex: 1; }
  .krc-ctrls > .kr-key { margin-bottom: 0; }
  .krc-row { display: flex; justify-content: space-between; align-items: center; gap: calc(var(--kr-u) * 10); padding-top: calc(var(--kr-u) * 10); border-top: 1px solid var(--kr-glass-line); font: 700 calc(var(--kr-u) * 15)/1.2 var(--kr-font-body); }
  .krc-row .k { color: var(--kr-text-dim); text-transform: uppercase; letter-spacing: .12em; font-size: calc(var(--kr-u) * 12); font-weight: 800; }
  .krc-row .score { font: 400 calc(var(--kr-u) * 30)/1 var(--kr-font-display); color: var(--kr-cream); }
  .krc-row .item { display: flex; align-items: center; gap: calc(var(--kr-u) * 7); white-space: nowrap; }
  .krc-row .item i { width: calc(var(--kr-u) * 12); height: calc(var(--kr-u) * 12); border-radius: 50%; background: var(--c, transparent); flex: none; }
  .krc-row .item.none { color: var(--kr-text-dim); }
  .krc-row .item.none i { display: none; }
  .krp { position: fixed; bottom: calc(var(--kr-u) * 290); transform: translateX(-50%); display: none; align-items: center; gap: calc(var(--kr-u) * 14); padding: calc(var(--kr-u) * 8) calc(var(--kr-u) * 22) calc(var(--kr-u) * 8) calc(var(--kr-u) * 8); border-radius: 999px; font: 400 calc(var(--kr-u) * 26)/1 var(--kr-font-display); color: var(--kr-cream); white-space: nowrap; pointer-events: none; z-index: 5; }
  .krp.on { display: flex; }
  .krp-p1 { left: 50%; }
  .krp.idle { font-size: calc(var(--kr-u) * 22); color: var(--kr-text-dim); }
  .krp.idle .kr-key { display: none; }
  .krp.idle { padding-left: calc(var(--kr-u) * 22); }
  @media (pointer: coarse) {
    .krp-p1 { left: auto; right: calc(var(--kr-safe-r) + calc(var(--kr-u) * 112)); bottom: calc(var(--kr-safe-b) + calc(var(--kr-u) * 48)); transform: translateY(50%); padding: calc(var(--kr-u) * 8) calc(var(--kr-u) * 14) calc(var(--kr-u) * 7); font-size: calc(var(--kr-u) * 15); gap: 0; }
    .krp-p1 .kr-key { display: none; }
    .krp.idle { font-size: calc(var(--kr-u) * 15); padding-left: calc(var(--kr-u) * 14); }
  }
  .krb { position: fixed; top: var(--kr-safe-t); width: calc(var(--kr-u) * 440); display: flex; flex-direction: column; align-items: center; gap: calc(var(--kr-u) * 12); pointer-events: none; z-index: 6; }
  .krb-p1 { left: calc(var(--kr-u) * 366); --pc: var(--kr-p1); }
  .krb-p2 { right: calc(var(--kr-u) * 366); --pc: var(--kr-p2); }
  .krb-bn { width: 100%; padding: calc(var(--kr-u) * 12) calc(var(--kr-u) * 24) calc(var(--kr-u) * 16); text-align: center; }
  .krb-step { display: inline-block; white-space: nowrap; font: 800 calc(var(--kr-u) * 13)/1.3 var(--kr-font-body); letter-spacing: .18em; text-transform: uppercase; color: #14110e; background: var(--pc); padding: calc(var(--kr-u) * 4) calc(var(--kr-u) * 10); border-radius: calc(var(--kr-u) * 6); }
  .krb-t { font: 400 calc(var(--kr-u) * 36)/1.05 var(--kr-font-display); color: var(--kr-cream); margin-top: calc(var(--kr-u) * 8); }
  .krb-s { font: 700 calc(var(--kr-u) * 18)/1.25 var(--kr-font-body); color: var(--kr-text-dim); margin-top: calc(var(--kr-u) * 4); }
  .krb-bn.burnt .krb-step { background: var(--kr-bar-bad); color: #fff; }
  .krb-fb { display: inline-flex; white-space: nowrap; align-items: center; gap: calc(var(--kr-u) * 8); font: 800 calc(var(--kr-u) * 18)/1.2 var(--kr-font-body); padding: calc(var(--kr-u) * 8) calc(var(--kr-u) * 16); border-radius: 999px; opacity: 0; }
  .krb-fb.ok { background: var(--kr-positive); color: #10260d; }
  .krb-fb.bad { background: var(--kr-burnt); color: #ffd2c4; box-shadow: inset 0 0 0 2px var(--kr-bar-bad); }
  .krb-fb.go { animation: kr-fb 3.2s var(--kr-ease-out) forwards; }
  /* Every new line alternates go / go2 so the chip's animation starts over. */
  .krb-fb.go2 { animation: kr-fb2 3.2s var(--kr-ease-out) forwards; }
  @keyframes kr-fb2{0%{opacity:1;transform:translateY(calc(var(--kr-u) * 8)) scale(.94);}8%{opacity:1;transform:none;}70%{opacity:1;transform:none;}100%{opacity:0;transform:translateY(calc(var(--kr-u) * -6));}}
  @media (pointer: coarse) {
    .krb-p1 { left: 50%; top: calc(var(--kr-u) * 66); width: auto; transform: translateX(-50%); gap: calc(var(--kr-u) * 6); }
    .krb-bn { width: auto; display: flex; align-items: center; gap: calc(var(--kr-u) * 8); padding: calc(var(--kr-u) * 5) calc(var(--kr-u) * 14) calc(var(--kr-u) * 5) calc(var(--kr-u) * 5); border-radius: 999px; white-space: nowrap; max-width: calc(var(--kr-u) * 420); }
    .krb-step { flex: none; font-size: max(9px, calc(var(--kr-u) * 10)); letter-spacing: .14em; background: var(--kr-mustard); padding: calc(var(--kr-u) * 3) calc(var(--kr-u) * 8); border-radius: 99px; }
    .krb-t { flex: none; font-size: calc(var(--kr-u) * 15); line-height: 1; margin: 0; }
    .krb-s { font-size: max(10px, calc(var(--kr-u) * 12)); margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .krb-s::before { content: '· '; }
    .krb-fb { font-size: max(10px, calc(var(--kr-u) * 12)); padding: calc(var(--kr-u) * 4) calc(var(--kr-u) * 11); }
  }
</style>
<div class="kr-root">
  <div class="krc kr-glass" data-class-krc-p1="p1" data-class-krc-p2="p2">
    <div class="krc-head"><span class="krc-who" data-bind="player"></span> <span data-bind="side"></span></div>
    <div class="krc-ctrls">
      <div class="krc-pad"><span class="kr-key" data-bind="key_up"></span><span class="kr-key" data-bind="key_left"></span><span class="kr-key" data-bind="key_down"></span><span class="kr-key" data-bind="key_right"></span></div>
      <span class="lbl" data-text="move"></span><span class="sep"></span>
      <span class="kr-key" data-bind="key_use"></span><span class="lbl" data-text="interact"></span>
    </div>
    <div class="krc-row"><span class="k" data-text="holding"></span><span class="item" data-class-none="empty"><i data-style-background="held_color"></i><span data-bind="holding"></span></span></div>
    <div class="krc-row"><span class="k" data-text="chef_score"></span><span class="score" data-bind="score"></span></div>
  </div>
  <div class="krp krp-p1 kr-glass" data-class-on="has_prompt" data-class-idle="idle"><span class="kr-key lg" data-bind="key_use"></span><span data-bind="prompt"></span></div>
  <div class="krb" data-class-krb-p1="p1" data-class-krb-p2="p2">
    <div class="krb-bn kr-glass" data-class-burnt="burnt"><span class="krb-step" data-bind="step"></span><div class="krb-t" data-bind="task"></div><div class="krb-s" data-bind="hint"></div></div>
    <div class="krb-fb" data-class-ok="said_ok" data-class-bad="said_bad" data-class-go="go" data-class-go2="go2" data-bind="said"></div>
  </div>
</div>
