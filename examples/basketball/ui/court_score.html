  .bb { width: 100%; height: 100%; padding: 0; border: 14px solid #2a2e36; background: #07080a; display: flex; flex-direction: column; }
  .disp { font-family: 'Bebas Neue', 'Oswald', Impact, 'Arial Narrow', sans-serif; font-weight: 400; letter-spacing: .02em; line-height: .92; }
  .num { font-family: 'Oswald', 'Bebas Neue', 'Arial Narrow', sans-serif; font-weight: 600; line-height: 1; }
  .top { height: 110px; flex: none; background: #f28c33; color: #14161b; display: flex; align-items: center; justify-content: center; font-size: 64px; padding-top: 6px; white-space: nowrap; overflow: hidden; }
  .mid { flex: 1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 30px; }
  .team { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .team .disp { font-size: 52px; white-space: nowrap; }
  .team .num { font-size: 150px; line-height: .85; }
  .clock { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 20px; }
  .q { font-size: 46px; color: #f2f0ea; }
  .time { font-size: 104px; color: #ffb627; text-shadow: 0 0 14px rgba(255,182,39,.45); }
  .bot { height: 110px; flex: none; display: flex; align-items: center; justify-content: center; gap: 22px; border-top: 3px solid #2a2e36; background: #07080a; }
  .bot .disp { font-size: 56px; color: #bdbab2; padding-top: 6px; }
  .shot { font-size: 84px; color: #ffb627; text-shadow: 0 0 14px rgba(255,182,39,.45); }
  .warn .bot { background: #2a0f0e; }
  .warn .shot { color: #ff4a3d; text-shadow: 0 0 22px rgba(255,74,61,.7); }
</style>
<div class="bb" data-class-warn="shot_urgent">
  <div class="top disp" data-style-background-color="crew_color" data-bind="top"></div>
  <div class="mid">
    <div class="team" data-style-color="home_color"><span class="disp">YOU</span><span class="num" data-bind="home_score"></span></div>
    <div class="clock"><span class="num q" data-bind="period"></span><span class="num time" data-bind="clock"></span></div>
    <div class="team" data-style-color="crew_color"><span class="disp" data-bind="crew_upper"></span><span class="num" data-bind="away_score"></span></div>
  </div>
  <div class="bot"><span class="disp">SHOT</span><span class="num shot" data-bind="shot_text"></span></div>
</div>
