<!-- Ported from the template: Cellar Purge pause menu - stone card with the floor line, Resume / Settings / Main Menu chamfered buttons and a Graphics Low / Medium / High settings view -->
<link rel="stylesheet" href="kit.css">
<style>
  .cpp { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(5,4,3,.78); font-family: var(--cp-font-ui); color: var(--cp-ink); pointer-events: auto; animation: cp-fade 200ms ease both; }
  .cpp-card { width: calc(560 * var(--u)); display: flex; flex-direction: column; align-items: stretch; gap: calc(16 * var(--u)); padding: calc(52 * var(--u)) calc(64 * var(--u)) calc(56 * var(--u)); background: var(--cp-panel-solid); box-shadow: 0 calc(40 * var(--u)) calc(100 * var(--u)) rgba(0,0,0,.8), inset 0 0 0 calc(7 * var(--u)) rgba(11,9,8,.7), inset 0 0 0 calc(8 * var(--u)) rgba(148,130,114,.2); animation: cp-rise 300ms var(--cp-ease-out) both; }
  .cpp-view { display: flex; flex-direction: column; align-items: stretch; gap: calc(16 * var(--u)); }
  .cpp-view[hidden] { display: none; }
  .cpp-title { text-align: center; font: 900 calc(64 * var(--u))/1 var(--cp-font-display); letter-spacing: .14em; padding-left: .14em; margin: 0 0 calc(8 * var(--u)); }
  .cpp-floor { text-align: center; font-size: calc(22 * var(--u)); line-height: 1.2; color: var(--cp-umber); margin-bottom: calc(20 * var(--u)); }
  .cpp-floor:empty { display: none; }
  .cpp-card .cp-btn { width: 100%; }
  .cpp-card .cp-btn > span { height: calc(68 * var(--u)); font-size: calc(24 * var(--u)); padding: 0 calc(24 * var(--u)); }
  .cpp-hint { margin-top: calc(8 * var(--u)); text-align: center; font-size: calc(18 * var(--u)); font-weight: 600; letter-spacing: .16em; color: var(--cp-umber); text-transform: uppercase; }
  .cpp-hint .cp-key { height: auto; min-width: 0; padding: 1px calc(9 * var(--u)); font-size: calc(18 * var(--u)); }
  .cpp-settings-title { text-align: center; font: 900 calc(52 * var(--u))/1 var(--cp-font-display); letter-spacing: .14em; padding-left: .14em; margin: 0 0 calc(20 * var(--u)); }
  .cpp-gfx-label { font-size: calc(18 * var(--u)); letter-spacing: .24em; }
  .cpp-seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid rgba(148,130,114,.5); margin-bottom: calc(20 * var(--u)); }
  .cpp-opt { height: calc(60 * var(--u)); margin: 0; padding: 0; border: 0; background: transparent; color: var(--cp-ink); font: 700 calc(22 * var(--u))/1 var(--cp-font-display); letter-spacing: .1em; cursor: pointer; pointer-events: auto; }
  .cpp-opt:hover, .cpp-opt:focus-visible { background: rgba(245,197,24,.12); outline: none; }
  .cpp-opt[aria-pressed="true"] { background: var(--cp-gold); color: var(--cp-stone-2); }

  @media (pointer: coarse) {
    .cpp { background: radial-gradient(ellipse at center, rgba(29,24,19,.85), rgba(5,4,3,.95)); }
    .cpp-card { width: calc(680 * var(--u)); max-height: calc(100cqh - calc(40 * var(--u))); overflow-y: auto; gap: calc(20 * var(--u)); padding: calc(44 * var(--u)) calc(56 * var(--u)) calc(48 * var(--u)); box-shadow: inset 0 0 0 calc(8 * var(--u)) rgba(11,9,8,.7), inset 0 0 0 calc(10 * var(--u)) rgba(148,130,114,.2); }
    .cpp-view { gap: calc(20 * var(--u)); }
    .cpp-title { font-size: calc(68 * var(--u)); margin-bottom: calc(12 * var(--u)); }
    .cpp-floor { display: none; }
    .cpp-card .cp-btn > span { height: calc(100 * var(--u)); font-size: calc(34 * var(--u)); }
    .cpp-settings-title { font-size: calc(56 * var(--u)); margin-bottom: calc(20 * var(--u)); }
    .cpp-gfx-label { font-size: calc(26 * var(--u)); }
    .cpp-opt { height: calc(96 * var(--u)); font-size: calc(32 * var(--u)); }
    .cpp-seg { margin-bottom: calc(28 * var(--u)); }
  }
</style>
<div class="cpp">
  <div class="cp-panel cpp-card">
    <div class="cpp-view" id="cpp-menu">
      <h1 class="cpp-title">PAUSED</h1>
      <div class="cpp-floor cp-flavor" data-bind="floor"></div>
      <button class="cp-btn is-primary" data-action="resume"><span>Resume</span></button>
      <button class="cp-btn" id="cpp-settings-open"><span>Settings</span></button>
      <button class="cp-btn" data-action="abandon"><span>Main Menu</span></button>
      <div class="cpp-hint d-only"><span class="cp-key">P</span> to resume</div>
    </div>
    <div class="cpp-view" id="cpp-settings" hidden>
      <h2 class="cpp-settings-title">SETTINGS</h2>
      <span class="cp-label cpp-gfx-label">Graphics</span>
      <div class="cpp-seg">
        <button class="cpp-opt" data-action="quality" data-quality="low" data-attr-aria-pressed="quality_low">Low</button>
        <button class="cpp-opt" data-action="quality" data-quality="medium" data-attr-aria-pressed="quality_medium">Medium</button>
        <button class="cpp-opt" data-action="quality" data-quality="high" data-attr-aria-pressed="quality_high">High</button>
      </div>
      <button class="cp-btn" id="cpp-back"><span>Back</span></button>
    </div>
  </div>
</div>
<script>
  // Presentation only: the card flips to its graphics view and back.
  (function () {
    var menu = document.getElementById('cpp-menu'), settings = document.getElementById('cpp-settings');
    document.getElementById('cpp-settings-open').addEventListener('click', function () { menu.hidden = true; settings.hidden = false; });
    document.getElementById('cpp-back').addEventListener('click', function () { settings.hidden = true; menu.hidden = false; });
  })();
</script>
