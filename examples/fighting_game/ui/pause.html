<link rel="stylesheet" href="card.css">
<div class="fct">
  <div class="dim"></div>
  <section class="card">
    <div class="card-main">
      <h1 class="title"><span data-text="pause_title_1"></span><span class="g" data-text="pause_title_2"></span></h1>
      <p class="tag" data-text="pause_desc"></p>
      <span class="ctx" data-bind="where"></span>
    </div>
    <nav class="menu">
      <button class="btn primary" data-action="resume"><span data-text="resume_fight"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="btn" data-action="retry"><span data-text="fight_again"></span><span class="meta" data-bind="restart"></span></button>
      <button class="btn" data-action="main_menu"><span data-text="main_menu"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="btn ghost" data-action="moves"><svg class="ic-set" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span data-text="settings_moves"></span></button>
    </nav>
  </section>
</div>
