<div class="cdt">
  <div class="cdt-tint"></div>
  <div class="cdt-mark" aria-hidden="true">
    <svg class="cdt-sun" viewBox="0 0 260 150" focusable="false">
      <rect x="0" y="38" width="96" height="9" fill="#ffc979"/>
      <rect x="22" y="58" width="74" height="9" fill="#ffc979"/>
      <rect x="44" y="78" width="52" height="9" fill="#ffc979"/>
      <circle cx="160" cy="72" r="48" fill="#ffcf49" stroke="#713829" stroke-width="7"/>
      <polygon points="70,150 112,100 214,100 252,150" fill="#713829"/>
    </svg>
    <svg class="cdt-pennant" viewBox="0 0 1100 360" focusable="false">
      <defs>
        <linearGradient id="cdt-pennant-fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffc979"/><stop offset="0.38" stop-color="#ffc979"/>
          <stop offset="0.38" stop-color="#dc7337"/><stop offset="0.7" stop-color="#dc7337"/>
          <stop offset="0.7" stop-color="#b64f2f"/><stop offset="1" stop-color="#b64f2f"/>
        </linearGradient>
      </defs>
      <polygon transform="translate(16,16)" points="30,30 1070,8 1038,70 1086,122 1030,176 1082,232 1034,290 1062,338 20,328 62,262 8,192 56,124 14,62" fill="#713829"/>

      <button class="cd-skew is-primary cdt-play" data-action="play" data-endless="false" data-key="Enter" data-text="title_journey"></button>
      <button class="cd-skew cdt-endless" data-action="play" data-endless="true" data-show="endless_unlocked" data-text="title_endless"></button>
    </div>
    <div class="cdt-bests">
      <div class="cdt-best" data-show="has_best"><span>BEST</span><b data-bind="best_journey"></b></div>
      <div class="cdt-best" data-show="has_best_endless"><span>ENDLESS BEST</span><b data-bind="best_endless"></b></div>

      <div class="cdt-row m-only"><span class="cdt-chip">HOP</span><em>jump</em></div>
      <div class="cdt-row m-only"><span class="cdt-chip is-duck">HOLD DUCK</span><em>slide / drop</em></div>
      <div class="cdt-rule"></div>
      <p class="cdt-goal">Collect coins. Reach the far rim.</p>

</div>
<script>
  // Presentation only: the ? button opens the How to Play card.
  (function () {
    var button = document.getElementById('help-toggle'), help = document.getElementById('help');
    button.addEventListener('click', function () {
      help.hidden = !help.hidden;
      button.setAttribute('aria-expanded', String(!help.hidden));
    });
  })();
</script>
