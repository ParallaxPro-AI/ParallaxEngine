<!-- While the hero is down: the lantern ring fills over the respawn wait, as on the template. -->
<link rel="stylesheet" href="sundermere.css">
<style>
.dr-bg { position: fixed; inset: 0; background: radial-gradient(circle calc(420 * var(--u)) at 50% 44%, rgba(255,190,110,.16) 0%, rgba(255,190,110,0) 100%), rgba(5,8,9,.55); box-shadow: inset 0 0 calc(240 * var(--u)) rgba(0,0,0,.85); animation: sm-fade .4s ease-out both; }
.dr-black { position: fixed; inset: 0; background: #050809; opacity: 0; animation: dr-out 3s linear both; }
@keyframes dr-out { 0%, 82% { opacity: 0; } 100% { opacity: 1; } }
.dr { position: fixed; left: 50%; top: 50%; width: calc(900 * var(--u)); max-width: calc(100cqw - 32px); display: flex; flex-direction: column; align-items: center; text-align: center; transform: translate(-50%, -50%); animation: sm-fade .5s ease-out both; }
.dr-ring { position: relative; width: calc(96 * var(--u)); height: calc(96 * var(--u)); display: grid; place-items: center; }
.dr-ring svg.r { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.dr-ring .trk { stroke: rgba(214,187,120,.14); }
.dr-ring .arc { stroke: #e0c48c; stroke-dasharray: 100; stroke-dashoffset: 100; animation: dr-fill 3s linear both; }
@keyframes dr-fill { to { stroke-dashoffset: 0; } }
.dr-ring .sm-ico { position: relative; width: calc(40 * var(--u)); height: calc(40 * var(--u)); animation: dr-glow 3s ease-in both; }
@keyframes dr-glow { from { filter: drop-shadow(0 0 2px rgba(255,190,110,.3)); } to { filter: drop-shadow(0 0 12px rgba(255,190,110,.95)); } }
.dr-eb { margin-top: calc(34 * var(--u)); font: 600 calc(13 * var(--u))/1 var(--sm-font-ui); letter-spacing: .32em; color: var(--sm-gold); }
.dr-title { margin-top: calc(20 * var(--u)); font: 600 calc(72 * var(--u))/1 var(--sm-font-display); text-shadow: 0 0 40px rgba(255,190,110,.2); }
.sm-root .dr-line { margin-top: calc(24 * var(--u)); max-width: calc(700 * var(--u)); font: 400 calc(25 * var(--u))/1.45 var(--sm-font-speech); color: rgba(244,239,220,.82); text-wrap: pretty; }
.dr-rift { margin-top: calc(28 * var(--u)); display: none; align-items: center; gap: calc(12 * var(--u)); padding: calc(10 * var(--u)) calc(20 * var(--u)); border-radius: calc(6 * var(--u)); background: linear-gradient(180deg, rgba(64,22,24,.85), rgba(42,18,46,.85)); border: 1px solid rgba(232,116,58,.7); box-shadow: 0 0 30px rgba(232,116,58,.35), 0 0 60px rgba(138,90,168,.3); }
.dr-rift.on { display: flex; }
.dr-rift > b { width: calc(8 * var(--u)); height: calc(8 * var(--u)); transform: rotate(45deg); background: var(--sm-ember); box-shadow: 0 0 10px #ffb070; }
.dr-rift > strong { font: 700 calc(20 * var(--u))/1 var(--sm-font-ui); color: var(--sm-ember-ink); }
.dr-rift > span { font: 600 calc(13 * var(--u))/1 var(--sm-font-ui); letter-spacing: .2em; color: rgba(255,197,154,.85); }
@container (max-height: 500px) {
  .dr-bg { background: radial-gradient(circle calc(220 * var(--u)) at 50% 40%, rgba(255,190,110,.15) 0%, rgba(255,190,110,0) 100%), rgba(5,8,9,.55); box-shadow: inset 0 0 calc(120 * var(--u)) rgba(0,0,0,.85); }
  .dr { width: calc(620 * var(--u)); }
  .dr-ring { width: calc(56 * var(--u)); height: calc(56 * var(--u)); }
  .dr-ring .sm-ico { width: calc(24 * var(--u)); height: calc(24 * var(--u)); }
  .dr-eb { margin-top: calc(16 * var(--u)); font-size: calc(11 * var(--u)); letter-spacing: .3em; }
  .dr-title { margin-top: calc(10 * var(--u)); font-size: calc(36 * var(--u)); }
  .sm-root .dr-line { margin-top: calc(12 * var(--u)); font-size: calc(18 * var(--u)); line-height: 1.35; color: rgba(244,239,220,.84); }
  .dr-rift { margin-top: calc(14 * var(--u)); gap: calc(8 * var(--u)); padding: calc(7 * var(--u)) calc(14 * var(--u)); border-radius: calc(5 * var(--u)); box-shadow: 0 0 20px rgba(232,116,58,.35); }
  .dr-rift > b { display: none; }
  .dr-rift > strong { font-size: calc(16 * var(--u)); }
  .dr-rift > span { font-size: calc(11 * var(--u)); letter-spacing: .18em; }
}
</style>
<div class="sm-root">
  <div class="dr-bg"></div>
  <main class="dr">
    <div class="dr-ring">
      <svg class="r" viewBox="0 0 36 36" fill="none" stroke-width="1"><circle class="trk" cx="18" cy="18" r="17.5"/><circle class="arc" cx="18" cy="18" r="17.5" pathLength="100"/></svg>
      <span class="sm-ico"><svg viewBox="0 0 24 24" fill="none" stroke="#f2dca6" stroke-width="1.5" stroke-linejoin="round"><path d="M9 4h6M12 2v2M8 7h8l-1 11H9Z"/><path d="M7 21h10"/><path d="M12 10c1 1.5 1.5 2.5 0 4.5-1.5-2-1-3 0-4.5Z" fill="#ffc46e" stroke="none"/></svg></span>
    </div>
    <div class="dr-eb" data-text="fallen_eyebrow"></div>
    <h1 class="dr-title" data-text="fallen_title"></h1>
    <p class="dr-line" data-bind="line"></p>
    <div class="dr-rift" data-class-on="rift_open"><b></b><strong data-bind="rift_cost"></strong><span data-text="fallen_rift"></span></div>
  </main>
  <div class="dr-black"></div>
</div>
