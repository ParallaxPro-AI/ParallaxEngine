<style>
/* Old-engine desktop UI scale: authored px drew at min(view/1920x1080, 1); --u is one such px, measured against the game view (the host is a size container). */
:root { container-type: size; --u: min(100cqw / 1920, 100cqh / 1080, 1px); }

  .hud, .hud * { margin: 0; padding: 0; box-sizing: border-box; }
  .hud {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    color: #eef2f8;
    background: transparent;
    pointer-events: none;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "Courier New", Consolas, monospace; }

  .hud { position: fixed; inset: 0; pointer-events: none; }

  .card {
    background: linear-gradient(180deg, rgba(28,33,43,0.9), rgba(18,21,28,0.9));
    border: calc(1 * var(--u)) solid rgba(143,183,224,0.22);
    box-shadow: 0 calc(14 * var(--u)) calc(40 * var(--u)) rgba(0,0,0,0.42);
    border-radius: calc(10 * var(--u));
  }

  /* ── legend (top-left) ── */
  .legend { position: absolute; top: calc(16 * var(--u)); left: calc(16 * var(--u)); width: calc(210 * var(--u)); padding: calc(12 * var(--u)) calc(14 * var(--u)); }
  .legend-title { font-size: calc(10 * var(--u)); font-weight: 800; letter-spacing: calc(3 * var(--u)); text-transform: uppercase; color: #8fb7e0; }
  .legend-row { margin-top: calc(8 * var(--u)); display: flex; align-items: center; gap: calc(10 * var(--u)); }
  .legend-row + .legend-row { margin-top: calc(6 * var(--u)); }
  .badge { font-size: calc(20 * var(--u)); line-height: 1; width: calc(26 * var(--u)); text-align: center; }
  .badge.sun { color: #f6b73c; }
  .badge.moon { color: #9fc4ea; }
  .who { font-size: calc(13 * var(--u)); font-weight: 700; color: #cdd6e2; }
  .who small { display: block; font-size: calc(10 * var(--u)); font-weight: 600; letter-spacing: calc(1 * var(--u)); text-transform: uppercase; color: #6f7d90; }

  /* ── record (top-right) ── */
  .rec { position: absolute; top: calc(16 * var(--u)); right: calc(16 * var(--u)); width: calc(200 * var(--u)); padding: calc(12 * var(--u)) calc(14 * var(--u)); text-align: right; }
  .rec-label { font-size: calc(10 * var(--u)); font-weight: 800; letter-spacing: calc(3 * var(--u)); text-transform: uppercase; color: #8fb7e0; }
  .rec-vals { margin-top: calc(6 * var(--u)); display: flex; justify-content: flex-end; gap: calc(14 * var(--u)); }
  .rec-item .v { font-size: calc(22 * var(--u)); font-weight: 800; color: #eef2f8; }
  .rec-item .k { font-size: calc(9 * var(--u)); font-weight: 700; letter-spacing: calc(1.5 * var(--u)); text-transform: uppercase; color: #6f7d90; }
  .streak { margin-top: calc(8 * var(--u)); font-size: calc(12 * var(--u)); color: #a7b3c4; }
  .streak b { color: #f6b73c; }

  /* ── turn strip (top-centre) ── */
  .turn {
    position: absolute; top: calc(16 * var(--u)); left: 50%; transform: translateX(-50%);
    padding: calc(9 * var(--u)) calc(20 * var(--u)); border-radius: calc(999 * var(--u));
    font-size: calc(12 * var(--u)); font-weight: 800; letter-spacing: calc(3 * var(--u)); text-transform: uppercase;
    background: rgba(18,21,28,0.86); border: calc(1 * var(--u)) solid rgba(143,183,224,0.2);
    color: #cdd6e2; white-space: nowrap;
  }
  .turn.you { border-color: rgba(246,183,60,0.6); color: #f6b73c; }
  .turn.them { color: #9fc4ea; border-color: rgba(159,196,234,0.45); }

  /* ── banner (centre) ── */
  .banner {
    position: absolute; top: calc(74 * var(--u)); left: 50%; transform: translateX(-50%);
    padding: calc(10 * var(--u)) calc(24 * var(--u)); border-radius: calc(8 * var(--u)); opacity: 0;
    background: rgba(12,14,19,0.88); border: calc(1 * var(--u)) solid rgba(143,183,224,0.3);
    color: #eef2f8; font-size: calc(14 * var(--u)); font-weight: 700; letter-spacing: calc(0.5 * var(--u));
    white-space: nowrap; transition: opacity 0.25s ease;
  }
  .banner.on { opacity: 1; }

  /* ── mobile / touch branch ───────────────────────────────────────────────
     Keyed off `(pointer: coarse)`, NOT a max-width query, and every number
     below is roughly DOUBLE its desktop value. Both of those are the same
     fact: a `pp-responsive` panel is laid out on a canvas 1/0.5 = 2x the
     device width and then CSS-scaled by MOBILE_RESPONSIVE_SCALE (0.5), so
     this document's viewport on a 390px phone is 780px and on an 844px
     landscape phone 1688px. The old `@media (max-width: 760px)` therefore
     could NEVER match on a phone — it only ever fired on a small desktop
     window, where it made things smaller for no reason — while every size
     outside it was already shipping at HALF its authored value (.turn 12px =
     6 device px, .rec-item .v 22px = 11 device px, .legend-title 10px = 5
     device px). Read any px below as device px by halving it. Copy this
     pattern, not a max-width breakpoint, into any HUD you write. */
  @media (pointer: coarse) {
    /* The mobile system tray (the always-on ☰ at the top-right, ~38 device px
       tall) is drawn by the engine OUTSIDE this panel and printed straight
       over the record card. --pp-top-clear is the engine's published tray
       clearance (88 panel px = 44 device px on coarse, 0 on desktop), so this
       stays a no-op with a mouse. */
    .rec {
      top: calc(calc(16 * var(--u)) + var(--pp-top-clear, 0px));
      width: calc(230 * var(--u));
      padding: calc(14 * var(--u)) calc(16 * var(--u));
    }
    .rec-label { font-size: calc(18 * var(--u)); letter-spacing: calc(3 * var(--u)); }
    .rec-vals { margin-top: calc(8 * var(--u)); gap: calc(18 * var(--u)); }
    .rec-item .v { font-size: calc(34 * var(--u)); }
    .rec-item .k { font-size: calc(16 * var(--u)); }
    .streak { margin-top: calc(10 * var(--u)); font-size: calc(20 * var(--u)); }

    /* The legend is decoration, and at 2x type it would collide with the turn
       strip: on the narrowest phone (375 device = 750 panel px) the strip is
       ~322 panel px wide and centred, i.e. it starts at 214. Dropping the
       heading + the flavour sub-labels keeps the legend under 172 and leaves
       the badges legible at 15 device px. */
    .legend { width: calc(156 * var(--u)); padding: calc(12 * var(--u)) calc(14 * var(--u)); }
    .legend-title { display: none; }
    .legend-row { margin-top: 0; gap: calc(8 * var(--u)); }
    .legend-row + .legend-row { margin-top: calc(10 * var(--u)); }
    .badge { font-size: calc(30 * var(--u)); width: calc(34 * var(--u)); }
    .who { font-size: calc(22 * var(--u)); }
    .who small { display: none; }

    .turn { font-size: calc(24 * var(--u)); letter-spacing: calc(2 * var(--u)); padding: calc(14 * var(--u)) calc(26 * var(--u)); }

    /* The banner moves off the top edge: at 844x390 the board's top edge is
       only ~55 device px down, so a banner at top:74px (37 device px) printed
       across the slate frame. Bottom-centre is clear of the board at every
       audited viewport (landscape leaves ~55 device px below it, portrait
       ~280), and consuming --pp-rail-h means it still clears an action rail if
       a game derived from this template adds one. */
    .banner {
      top: auto;
      bottom: calc(calc(16 * var(--u)) + var(--pp-rail-h, 0px));
      font-size: calc(26 * var(--u));
      padding: calc(16 * var(--u)) calc(32 * var(--u));
    }
  }

  /* Touch only: the old engine's control tray carried pause on phones. */
  .pause-plate { display: none; }
  @media (pointer: coarse) {
    .pause-plate { display: block; position: fixed; right: calc(14 * var(--u)); bottom: calc(14 * var(--u)); width: calc(44 * var(--u)); height: calc(44 * var(--u)); border-radius: calc(10 * var(--u));
      border: calc(1 * var(--u)) solid rgba(143, 183, 224, 0.24); background: rgba(18, 21, 28, 0.9); color: #eef2f8; font: 800 calc(14 * var(--u))/1 "Courier New", monospace; pointer-events: auto; }
  }
</style>
<div class="hud">
  <section class="card legend">
    <div class="legend-title mono" data-text="legend_title"></div>
    <div class="legend-row">
      <span class="badge sun">&#9788;</span>
      <span class="who"><span data-text="you"></span><small data-text="the_sun"></small></span>
    </div>
    <div class="legend-row">
      <span class="badge moon">&#9790;</span>
      <span class="who"><span data-text="moon"></span><small data-text="perfect_play"></small></span>
    </div>
  </section>

  <div class="turn mono" data-class-you="yours" data-class-them="theirs" data-bind="status"></div>
  <div class="banner" data-class-on="banner" data-text="banner"></div>

  <section class="card rec">
    <div class="rec-label mono" data-text="record_title"></div>
    <div class="rec-vals">
      <div class="rec-item"><div class="v" data-bind="wins"></div><div class="k" data-text="won"></div></div>
      <div class="rec-item"><div class="v" data-bind="losses"></div><div class="k" data-text="lost"></div></div>
      <div class="rec-item"><div class="v" data-bind="draws"></div><div class="k" data-text="drew"></div></div>
    </div>
    <div class="streak mono"><span data-text="streak_label"></span> <b data-bind="streak"></b></div>
  </section>
</div>
<button class="pause-plate" data-action="pause" aria-label="Pause">II</button>
