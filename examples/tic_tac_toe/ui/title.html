<link rel="stylesheet" href="menu_kit.css">
<style>
/* Old-engine desktop UI scale: authored px drew at min(view/1920x1080, 1); --u is one such px, measured against the game view (the host is a size container). */
:root { container-type: size; --u: min(100cqw / 1920, 100cqh / 1080, 1px); }

  /* Theme the shared title kit (.pp-menu-* live in the engine bundle). Only the
     Sun-vs-Moon palette, the bespoke two-column board (glyph strip + panel),
     the boxed record stats and the monospace hint are authored here; the scene,
     card shell, entrance fade, button mechanics and the coarse-pointer touch
     floor for the button are inherited. */
  .pp-menu-scene { --pp-menu-in-dur: 0.6s; padding: calc(24 * var(--u)); }

  .card {
    --pp-menu-font: 'Inter', 'Segoe UI', system-ui, sans-serif;
    --pp-menu-ink: #eef2f8;
    --pp-menu-w: min(calc(560 * var(--u)), calc(100cqw - calc(40 * var(--u))));
    --pp-menu-pad: 0;
    --pp-menu-r: calc(16 * var(--u));
    --pp-menu-border: calc(1 * var(--u)) solid rgba(143, 183, 224, 0.24);
    --pp-menu-bg: linear-gradient(180deg, rgba(28,33,43,0.94), rgba(18,21,28,0.96));
    --pp-menu-shadow: 0 calc(26 * var(--u)) calc(74 * var(--u)) rgba(0,0,0,0.55);
    --pp-menu-blur: 0;
    /* Set Sail (primary) — the amber Sun */
    --pp-menu-btn-bg: linear-gradient(135deg, #f6b73c, #e89a2a);
    --pp-menu-btn-ink: #1c1206;
    --pp-menu-btn-r: calc(10 * var(--u));
    --pp-menu-btn-shadow: 0 calc(12 * var(--u)) calc(28 * var(--u)) rgba(0,0,0,0.32);
    /* Two-column board with square-clipped corners + left-aligned type (the kit
       centers by default). Bespoke layout, so set these directly on the card. */
    display: grid;
    grid-template-columns: calc(150 * var(--u)) 1fr;
    overflow: hidden;
    text-align: left;
  }

  .grid-strip {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: calc(50 * var(--u));
    gap: calc(4 * var(--u));
    padding: calc(12 * var(--u));
    background: #171b24;
    border-right: calc(1 * var(--u)) solid rgba(143, 183, 224, 0.18);
    align-content: center;
  }

  .glyph {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: calc(8 * var(--u));
    background: rgba(255,255,255,0.03);
    font-size: calc(24 * var(--u));
    font-weight: 900;
    line-height: 1;
  }
  .glyph.sun { color: #f6b73c; }
  .glyph.moon { color: #9fc4ea; }

  .panel { padding: calc(28 * var(--u)) calc(30 * var(--u)) calc(30 * var(--u)); }

  .eyebrow {
    font-family: "Courier New", Consolas, monospace;
    font-size: calc(11 * var(--u)); font-weight: 800; letter-spacing: calc(3 * var(--u));
    text-transform: uppercase; color: #8fb7e0;
  }

  .game-title {
    margin-top: calc(8 * var(--u));
    font-size: clamp(calc(40 * var(--u)), 8cqw, calc(62 * var(--u)));
    font-weight: 900;
    line-height: 0.92;
    text-transform: uppercase;
    letter-spacing: calc(2 * var(--u));
    color: #fafcff;
    text-shadow: 0 0 calc(24 * var(--u)) rgba(143,183,224,0.24);
  }

  .subtitle {
    margin-top: calc(10 * var(--u));
    color: #a7b3c4;
    font-size: calc(14 * var(--u));
    line-height: 1.5;
    max-width: 42ch;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: calc(8 * var(--u));
    margin-top: calc(22 * var(--u));
  }
  .stat {
    padding: calc(10 * var(--u)) calc(8 * var(--u));
    border-radius: calc(8 * var(--u));
    border: calc(1 * var(--u)) solid rgba(143,183,224,0.16);
    background: rgba(143,183,224,0.05);
    text-align: center;
  }
  .stat-val { font-size: calc(20 * var(--u)); font-weight: 800; color: #eef2f8; }
  .stat-lbl {
    margin-top: calc(2 * var(--u)); font-size: calc(10 * var(--u)); font-weight: 700; letter-spacing: calc(1.5 * var(--u));
    text-transform: uppercase; color: #6f7d90;
  }

  /* The hint sits beside the button on one row; .pp-menu-actions would stack it
     full-width above, so keep this bespoke two-column group. */
  .btn-group {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: calc(16 * var(--u));
    margin-top: calc(26 * var(--u));
  }

  .hint {
    font-family: "Courier New", Consolas, monospace;
    font-size: calc(11 * var(--u)); font-weight: 700; letter-spacing: calc(1 * var(--u));
    text-transform: uppercase; color: #6f7d90;
  }

  /* Reuse .pp-menu-btn (structure + press + touch floor); the borderless amber
     skin + this game's compact type and lift-on-hover are layered back on. */
  .menu-btn {
    width: auto;
    min-width: calc(200 * var(--u));
    padding: calc(15 * var(--u)) calc(26 * var(--u));
    border: none;
    font-size: calc(15 * var(--u));
    font-weight: 800;
  }
  .menu-btn:hover {
    transform: translateY(calc(-2 * var(--u)));
    filter: brightness(1.06);
    box-shadow: 0 calc(16 * var(--u)) calc(34 * var(--u)) rgba(246,183,60,0.32);
  }

  /* Bespoke-content mobile sizing under pp-responsive's 0.5 scale (each px below
     reads at ~half device px otherwise). The button touch floor is the kit's;
     only the hand-authored strip/type/stats + the single-column switch are sized
     here. The strip collapses to one row of nine to reclaim height for landscape. */
  @media (pointer: coarse) {
    .card {
      grid-template-columns: 1fr;
      width: min(calc(760 * var(--u)), calc(100cqw - calc(32 * var(--u))));
      max-height: calc(100cqh - calc(32 * var(--u)));
      overflow-y: auto;
    }
    .grid-strip {
      grid-template-columns: repeat(9, 1fr);
      grid-auto-rows: calc(44 * var(--u));
      border-right: 0;
      border-bottom: calc(1 * var(--u)) solid rgba(143,183,224,0.18);
    }
    .glyph { font-size: calc(26 * var(--u)); }
    .panel { padding: calc(26 * var(--u)) calc(26 * var(--u)) calc(28 * var(--u)); }
    .eyebrow { font-size: calc(20 * var(--u)); letter-spacing: calc(4 * var(--u)); }
    .game-title { font-size: clamp(calc(64 * var(--u)), 11cqw, calc(92 * var(--u))); }
    .subtitle { font-size: calc(26 * var(--u)); line-height: 1.45; max-width: none; }
    .stats { margin-top: calc(20 * var(--u)); }
    .stat { padding: calc(14 * var(--u)) calc(8 * var(--u)); }
    .stat-val { font-size: calc(34 * var(--u)); }
    .stat-lbl { font-size: calc(17 * var(--u)); }
    .btn-group { grid-template-columns: 1fr; justify-items: stretch; gap: calc(18 * var(--u)); }
    .hint { font-size: calc(19 * var(--u)); }
    .menu-btn { width: 100%; min-width: 0; font-size: calc(26 * var(--u)); padding: calc(22 * var(--u)) calc(26 * var(--u)); }
  }
</style>
<div class="pp-menu-scene">
  <main class="pp-menu-card card">
    <aside class="grid-strip" aria-hidden="true">
      <span class="glyph sun">&#9788;</span>
      <span class="glyph"></span>
      <span class="glyph moon">&#9790;</span>
      <span class="glyph"></span>
      <span class="glyph sun">&#9788;</span>
      <span class="glyph"></span>
      <span class="glyph moon">&#9790;</span>
      <span class="glyph"></span>
      <span class="glyph sun">&#9788;</span>
    </aside>

    <section class="panel">
      <div class="eyebrow" data-text="eyebrow"></div>
      <h1 class="game-title" data-text="game_title"></h1>
      <p class="subtitle" data-text="subtitle"></p>

      <div class="stats">
        <div class="stat"><div class="stat-val" data-bind="record"></div><div class="stat-lbl" data-text="record_label"></div></div>
        <div class="stat"><div class="stat-val" data-bind="streak"></div><div class="stat-lbl" data-text="streak_label"></div></div>
        <div class="stat"><div class="stat-val" data-bind="best_streak"></div><div class="stat-lbl" data-text="best_label"></div></div>
      </div>

      <div class="btn-group">
        <span class="hint" data-bind="hint"></span>
        <button class="pp-menu-btn menu-btn" data-action="start" data-text="start"></button>
      </div>
    </section>
  </main>
</div>
