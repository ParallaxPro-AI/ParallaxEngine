<link rel="stylesheet" href="street.css">
<style>
/* Old-engine desktop UI scale: authored px drew at min(view/1920x1080, 1); --u is one such px, measured against the game view (the host is a size container). */
:root { container-type: size; --u: min(100cqw / 1920, 100cqh / 1080, 1px); }

  .cg-root { pointer-events: none; overflow: hidden; }
  .cgo { position: fixed; inset: 0; z-index: 200; pointer-events: auto; overflow: hidden; }
  .cgo.never { display: none; }
  .bg { position: absolute; inset: 0; animation: cg-fade .4s ease both; }
  .bg-loss { background: radial-gradient(80% 70% at 50% 30%, rgba(120,10,10,.55), rgba(3,14,19,.85)); box-shadow: inset 0 0 calc(var(--cg-u) * 260) calc(var(--cg-u) * 40) rgba(255,50,50,.35); }
  .bg-win { background: radial-gradient(120% 80% at 50% 40%, rgba(58,143,176,.55) 0%, rgba(26,79,99,.6) 45%, rgba(10,33,41,.8) 100%); }
  .sun { position: absolute; left: 50%; top: calc(var(--cg-u) * 260); width: calc(var(--cg-u) * 2600); height: calc(var(--cg-u) * 2600); transform: translate(-50%, -50%); background: repeating-conic-gradient(rgba(255,218,120,.16) 0deg 7deg, transparent 7deg 18deg); animation: cgo-spin 60s linear infinite; }
  .bg-win::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(3,14,19,0) 30%, rgba(3,14,19,.8) 100%); }
  .cgo.win .bg-loss, .cgo:not(.win) .bg-win, .cgo.win .burst, .cgo:not(.win) .vhead, .cgo.win .prog, .cgo:not(.win) .night, .cgo.win .note { display: none; }
  @keyframes cgo-spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  @keyframes cgo-slam { 0% { transform: rotate(-5deg) scale(2.2); opacity: 0 } 30% { transform: rotate(-5deg) scale(.94); opacity: 1 } 45%, 100% { transform: rotate(-5deg) scale(1) } }
  @keyframes cgo-rise { 0% { transform: translateY(calc(var(--cg-u) * 40)); opacity: 0 } 100% { transform: none; opacity: 1 } }

  .lead { position: absolute; left: 0; right: 0; top: calc(var(--cg-u) * 60); display: flex; flex-direction: column; align-items: center; }
  .burst { position: relative; width: calc(var(--cg-u) * 900); height: calc(var(--cg-u) * 360); display: grid; place-items: center; }
  .burst .s1, .burst .s2 { position: absolute; clip-path: var(--burst); }

  .burst .s2 { width: calc(var(--cg-u) * 820); height: calc(var(--cg-u) * 330); background: var(--cg-danger); }
  .burst .w { position: relative; font-size: calc(var(--cg-u) * 210); color: var(--cg-ink); text-shadow: calc(var(--cg-u) * 8) calc(var(--cg-u) * 8) 0 var(--cg-teal-700), calc(var(--cg-u) * 16) calc(var(--cg-u) * 16) 0 rgba(2,12,16,.4); letter-spacing: .02em; animation: cgo-slam .6s ease-out both; white-space: nowrap; }
  .vhead { display: flex; flex-direction: column; align-items: center; margin-top: calc(var(--cg-u) * 10); animation: cgo-rise .7s var(--cg-pop) both; }
  .vtag { padding: calc(var(--cg-u) * 6) calc(var(--cg-u) * 22); border-radius: calc(var(--cg-u) * 8); background: var(--cg-teal-900); border: calc(var(--cg-u) * 3) solid var(--cg-yellow-hi); font-size: calc(var(--cg-u) * 44); letter-spacing: .24em; color: var(--cg-yellow-hi); }
  .vword { margin-top: calc(var(--cg-u) * 14); font-family: var(--cg-font-word); font-size: calc(var(--cg-u) * 150); line-height: 1; color: var(--cg-yellow-hi); text-shadow: calc(var(--cg-u) * 7) calc(var(--cg-u) * 7) 0 var(--cg-teal-700), calc(var(--cg-u) * 14) calc(var(--cg-u) * 14) 0 rgba(2,12,16,.4); white-space: nowrap; }
  .vword br { display: none; }
  .vline { margin-top: calc(var(--cg-u) * 14); font-size: calc(var(--cg-u) * 28); font-weight: 600; font-style: italic; color: var(--cg-ink-2); white-space: nowrap; }
  .sc-m { display: none; }

  .card { position: absolute; left: 50%; top: calc(var(--cg-u) * 440); transform: translateX(-50%); width: calc(var(--cg-u) * 1240); padding: calc(var(--cg-u) * 36) calc(var(--cg-u) * 48) calc(var(--cg-u) * 40); display: flex; flex-direction: column; gap: calc(var(--cg-u) * 26); border-color: var(--cg-danger); animation: cgo-card .4s .15s ease-out both; }
  @keyframes cgo-card { from { opacity: 0; transform: translate(-50%, calc(var(--cg-u) * 24)); } to { opacity: 1; transform: translateX(-50%); } }
  .cgo.win .card { top: calc(var(--cg-u) * 470); border-color: var(--cg-yellow); gap: calc(var(--cg-u) * 24); padding-top: calc(var(--cg-u) * 34); }
  .r1 { display: flex; justify-content: space-between; align-items: flex-end; gap: calc(var(--cg-u) * 40); }
  .cgo.win .r1 { align-items: center; gap: calc(var(--cg-u) * 32); }
  .kick { font: 800 calc(var(--cg-u) * 24)/1.2 var(--cg-font-num); letter-spacing: .24em; color: var(--cg-danger-soft); white-space: nowrap; text-transform: uppercase; }
  .cgo.win .kick { color: var(--cg-mint); }
  .score { display: flex; align-items: baseline; gap: calc(var(--cg-u) * 16); margin-top: calc(var(--cg-u) * 4); }
  .score .n { font-size: calc(var(--cg-u) * 128); color: var(--cg-gold-hi); }
  .score .u { font: 700 calc(var(--cg-u) * 30)/1 var(--cg-font-num); letter-spacing: .12em; color: var(--cg-ink-2); }
  .cgo.win .score .u { display: none; }
  .prog { flex: 1; max-width: calc(var(--cg-u) * 520); padding-bottom: calc(var(--cg-u) * 16); }
  .prog-h { display: flex; justify-content: space-between; gap: calc(var(--cg-u) * 12); font: 700 calc(var(--cg-u) * 20)/1 var(--cg-font-num); letter-spacing: .1em; white-space: nowrap; color: var(--cg-ink-2); }
  .prog-h span:last-child { color: var(--cg-mint); }
  .bar { position: relative; height: calc(var(--cg-u) * 16); margin-top: calc(var(--cg-u) * 8); border-radius: calc(var(--cg-u) * 8); background: rgba(3,16,21,.8); }
  .bar .f { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: inherit; background: linear-gradient(90deg, #ff9a3c, #e66bff, #f5c518); transition: width .8s .3s ease-out; }
  .bar .t { position: absolute; top: 0; bottom: 0; width: calc(var(--cg-u) * 3); background: rgba(255,246,222,.6); }
  .bar .b { position: absolute; top: calc(var(--cg-u) * -8); bottom: calc(var(--cg-u) * -8); width: calc(var(--cg-u) * 4); margin-left: calc(var(--cg-u) * -2); border-radius: calc(var(--cg-u) * 2); background: var(--cg-mint); }
  .night { width: calc(var(--cg-u) * 520); display: flex; align-items: center; gap: calc(var(--cg-u) * 20); padding: calc(var(--cg-u) * 18) calc(var(--cg-u) * 22); border-radius: calc(var(--cg-u) * 20); background: linear-gradient(90deg, #4a1260, #2a1050); border: calc(var(--cg-u) * 3) solid var(--cg-neon); animation: cg-shine 2.4s ease-in-out infinite; transform: rotate(1.5deg); }
  .night-i { flex: none; width: calc(var(--cg-u) * 64); height: calc(var(--cg-u) * 64); border-radius: calc(var(--cg-u) * 16); background: var(--cg-neon); display: grid; place-items: center; }
  .night-i svg { width: calc(var(--cg-u) * 36); height: calc(var(--cg-u) * 36); }
  .night-t { font-size: calc(var(--cg-u) * 32); white-space: nowrap; }
  .night-s { font-size: calc(var(--cg-u) * 19); font-weight: 600; margin-top: calc(var(--cg-u) * 6); color: #f3d9ff; }
  .stats { display: grid; grid-template-columns: repeat(var(--n, 7), minmax(min-content, 1fr)); border-radius: calc(var(--cg-u) * 18); background: rgba(3,16,21,.55); overflow: hidden; }
  .st { padding: calc(var(--cg-u) * 18) calc(var(--cg-u) * 20); border-right: 1px solid rgba(141,219,208,.15); min-width: 0; }
  .st:last-child { border-right: 0; }
  .st.wal { background: rgba(255,218,120,.1); }
  .st .k { font: 700 calc(var(--cg-u) * 18)/1.2 var(--cg-font-num); letter-spacing: .16em; white-space: nowrap; color: var(--cg-ink-muted); text-transform: uppercase; }
  .st .k .km { display: none; }
  .st .v { font: 800 calc(var(--cg-u) * 40)/1.1 var(--cg-font-num); white-space: nowrap; color: var(--sc, var(--cg-ink)); }
  .st .v small { font-size: .58em; color: var(--cg-mint); }
  .st .v.long { font-size: calc(var(--cg-u) * 32); }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: calc(var(--cg-u) * 20); }
  .cgo.win .foot { justify-content: flex-end; }
  .note { font-size: calc(var(--cg-u) * 22); font-weight: 600; color: var(--cg-ink-2); }
  .note b { font-weight: 600; color: var(--cg-gold); }
  .btns { display: flex; gap: calc(var(--cg-u) * 16); }
  .cg-root .btns .cg-btn { height: calc(var(--cg-u) * 84); font-size: calc(var(--cg-u) * 34); padding: 0 calc(var(--cg-u) * 36); }
  .cg-root .btns .cg-btn.gold { font-size: calc(var(--cg-u) * 40); }

  @media (pointer: coarse) {
    .bg-loss { background: radial-gradient(80% 80% at 25% 40%, rgba(120,10,10,.6), rgba(3,14,19,.88)); box-shadow: inset 0 0 calc(var(--cg-u) * 90) calc(var(--cg-u) * 16) rgba(255,50,50,.35); }
    .sun { left: calc(var(--cg-u) * 210); top: calc(var(--cg-u) * 150); width: calc(var(--cg-u) * 1400); height: calc(var(--cg-u) * 1400); }
    .bg-win { background: radial-gradient(120% 90% at 30% 40%, rgba(58,143,176,.55) 0%, rgba(26,79,99,.6) 45%, rgba(10,33,41,.85) 100%); }
    .bg-win::after { display: none; }
    .lead { left: var(--cg-sl); right: auto; top: calc(var(--cg-st) + calc(var(--cg-u) * 6)); bottom: var(--cg-sb); width: calc(var(--cg-u) * 330); justify-content: center; gap: calc(var(--cg-u) * 6); }
    .cgo.win .lead { left: calc(var(--cg-sl) + calc(var(--cg-u) * 8)); align-items: flex-start; justify-content: flex-start; top: calc(var(--cg-st) + calc(var(--cg-u) * 14)); }
    .burst { width: calc(var(--cg-u) * 330); height: calc(var(--cg-u) * 170); }
    .burst .s1 { width: calc(var(--cg-u) * 330); height: calc(var(--cg-u) * 170); }
    .burst .s2 { width: calc(var(--cg-u) * 300); height: calc(var(--cg-u) * 148); }
    .burst .w { font-size: calc(var(--cg-u) * 76); text-shadow: calc(var(--cg-u) * 4) calc(var(--cg-u) * 4) 0 var(--cg-teal-700); }
    .vhead { align-items: flex-start; margin: 0; gap: calc(var(--cg-u) * 6); }
    .vtag { padding: calc(var(--cg-u) * 2) calc(var(--cg-u) * 12); border-width: calc(var(--cg-u) * 2); border-radius: calc(var(--cg-u) * 6); font-size: calc(var(--cg-u) * 20); letter-spacing: .22em; }
    .vword { margin: 0; font-size: calc(var(--cg-u) * 50); line-height: .98; text-shadow: calc(var(--cg-u) * 4) calc(var(--cg-u) * 4) 0 var(--cg-teal-700); transform: rotate(-3deg); transform-origin: left; }
    .vword br { display: inline; }
    .vline { display: none; }
    .sc-m { display: flex; flex-direction: column; align-items: center; gap: calc(var(--cg-u) * 4); }
    .cgo.win .sc-m { align-items: flex-start; margin-top: calc(var(--cg-u) * 6); }
    .sc-m .kick { font-size: calc(var(--cg-u) * 12); letter-spacing: .2em; }
    .sc-m .score { margin: 0; gap: calc(var(--cg-u) * 8); }
    .sc-m .score .n { font-size: calc(var(--cg-u) * 58); }
    .cgo.win .sc-m .score .n { font-size: calc(var(--cg-u) * 56); text-shadow: calc(var(--cg-u) * 3) calc(var(--cg-u) * 3) 0 var(--cg-teal-700); }
    .sc-m .score .u { font-size: calc(var(--cg-u) * 15); }
    .sc-d { display: none; }
    .card { left: auto; right: var(--cg-sr); top: calc(var(--cg-st) + calc(var(--cg-u) * 6)); bottom: calc(var(--cg-sb) + calc(var(--cg-u) * 5)); transform: none; width: calc(var(--cg-u) * 410); padding: calc(var(--cg-u) * 14) calc(var(--cg-u) * 16); gap: calc(var(--cg-u) * 10); animation: cg-fade .3s ease both; }
    .cgo.win .card { top: calc(var(--cg-st) + calc(var(--cg-u) * 6)); padding-top: calc(var(--cg-u) * 14); gap: calc(var(--cg-u) * 10); }
    .r1 { display: block; }
    .prog { max-width: none; padding: 0; }
    .prog-h { font-size: calc(var(--cg-u) * 12); letter-spacing: .08em; }
    .bar { height: calc(var(--cg-u) * 8); margin-top: calc(var(--cg-u) * 5); border-radius: calc(var(--cg-u) * 4); }
    .bar .t { display: none; }
    .bar .b { top: calc(var(--cg-u) * -4); bottom: calc(var(--cg-u) * -4); width: calc(var(--cg-u) * 3); }
    .night { width: auto; gap: calc(var(--cg-u) * 10); padding: calc(var(--cg-u) * 8) calc(var(--cg-u) * 12); border-radius: calc(var(--cg-u) * 12); border-width: calc(var(--cg-u) * 2); transform: none; animation: none; box-shadow: 0 calc(var(--cg-u) * 4) 0 #3b0a4a; }
    .night-i { width: calc(var(--cg-u) * 30); height: calc(var(--cg-u) * 30); border-radius: calc(var(--cg-u) * 8); }
    .night-i svg { width: calc(var(--cg-u) * 18); height: calc(var(--cg-u) * 18); }
    .night-t { font-size: calc(var(--cg-u) * 16); }
    .night-s { font-size: calc(var(--cg-u) * 11); margin-top: calc(var(--cg-u) * 3); }
    .stats { flex: 1; min-height: 0; grid-template-columns: repeat(var(--nm, 4), minmax(0, 1fr)); gap: 1px; border-radius: calc(var(--cg-u) * 12); background: rgba(141,219,208,.15); }
    .st { padding: calc(var(--cg-u) * 6) calc(var(--cg-u) * 8); border: 0; background: rgb(8,51,68); display: flex; flex-direction: column; justify-content: center; }
    .st.wal { background: #173f45; }
    .st.span2 { grid-column: span 2; }
    .st .k { font-size: calc(var(--cg-u) * 11); letter-spacing: .12em; }
    .st .k .kd { display: none; }
    .st .k .km { display: inline; }
    .st .v { font-size: calc(var(--cg-u) * 20); }
    .st .v { overflow: hidden; text-overflow: ellipsis; }
    .st .v.long { font-size: calc(var(--cg-u) * 15); }
    .note { display: none; }
    .btns { width: 100%; gap: calc(var(--cg-u) * 8); }
    .cg-root .btns .cg-btn { flex: 1; height: max(48px, calc(var(--cg-u) * 52)); font-size: calc(var(--cg-u) * 20); padding: 0 calc(var(--cg-u) * 10); }
    .cg-root .btns .cg-btn.gold { flex: 1.4; font-size: calc(var(--cg-u) * 24); }
  }
</style>
<div class="cgo cg-root" data-class-win="won">
  <div class="bg bg-loss"></div>
  <div class="bg bg-win"><div class="sun"></div></div>
  <div class="lead">
    <div class="burst" style="--burst: polygon(100.0% 50.0%,85.7% 55.1%,97.0% 63.9%,82.0% 64.9%,87.6% 78.0%,72.7% 74.2%,75.0% 88.3%,61.4% 81.7%,58.5% 95.8%,46.8% 85.4%,40.6% 98.5%,31.8% 82.0%,24.9% 92.8%,19.8% 76.4%,10.9% 83.5%,10.6% 66.2%,2.0% 70.1%,7.9% 55.9%,0.0% 50.0%,7.9% 44.1%,2.0% 29.9%,10.6% 33.8%,10.9% 16.5%,19.8% 23.6%,24.9% 7.2%,31.8% 18.0%,40.6% 1.5%,46.8% 14.6%,58.5% 4.2%,61.4% 18.3%,75.0% 11.7%,72.7% 25.8%,87.6% 22.0%,82.0% 35.1%,97.0% 36.1%,85.7% 44.9%)"><span class="s1"></span><span class="s2"></span><span class="w cg-display" data-text="busted_title"></span></div>
    <div class="vhead">
      <div class="vtag cg-display" data-text="victory"></div>
      <div class="vword"><span data-text="vword_1"></span><br> <span data-text="vword_2"></span></div>
      <div class="vline" data-text="vline"></div>
    </div>
    <div class="sc-m">
      <div class="kick" data-bind="kick"></div>
      <div class="score"><span class="n cg-num" data-bind="score"></span><span class="u" data-text="points_caps"></span></div>
    </div>
  </div>
  <div class="card cg-panel">
    <div class="r1">
      <div class="sc-d">
        <div class="kick" data-bind="kick"></div>
        <div class="score"><span class="n cg-num" data-bind="score"></span><span class="u" data-text="points_caps"></span></div>
      </div>
      <div class="prog">
        <div class="prog-h"><span data-bind="progress_left"></span><span data-bind="progress_right"></span></div>
        <div class="bar"><span class="f" data-style-width="progress_pct"></span><span class="b" data-show="has_best" data-style-left="best_pct"></span></div>
      </div>
      <div class="night">
        <span class="night-i"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#2a0838"/><circle cx="16" cy="9" r="7.5" fill="#e66bff"/></svg></span>
        <div><div class="night-t cg-display" data-bind="night_title"></div><div class="night-s" data-bind="night_line"></div></div>
      </div>
    </div>
    <div class="stats" data-style---n="stat_count" data-style---nm="stat_mobile" data-each="stats"><template><div class="st" data-class-wal="wallet" data-class-span2="span2" data-style---sc="color"><div class="k"><span class="kd" data-bind="label"></span><span class="km" data-bind="short"></span></div><div class="v" data-bind="value"></div></div></template></div>
    <div class="foot">
      <div class="note"><span data-text="wallet_kept"></span> <b data-bind="reach"></b></div>
      <div class="btns">
        <button class="cg-btn" data-action="quit" data-text="over_quit"></button>
        <button class="cg-btn gold" data-action="retry" data-key="Enter" data-text="play_again"></button>
      </div>
    </div>
  </div>
</div>
