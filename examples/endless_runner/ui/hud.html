<div class="cgh cg-root" data-class-closing="closing" data-class-build="build" data-class-dim="counting" data-style---acc="district_tint" data-style---gc="guard_color" data-style---gb="guard_bar" data-style---gbm="guard_bar_mobile">
  <div class="vig"></div>
  <div class="d-top d">
    <div class="route cg-glass">
      <div class="route-h"><span class="dname cg-display" data-bind="district"></span><span class="dnum cg-caps" data-bind="district_number"></span></div>
      <div class="route-n"><span class="dist cg-num"><span data-bind="distance"></span><small>m</small></span><span class="pts"><span data-bind="score"></span> <span data-text="points"></span></span></div>
      <div class="prog"><i data-style-width="progress_pct"></i></div>
      <div class="prog-l"><span class="end" data-bind="goal"></span></div>
    </div>
    <div class="money cg-glass">
      <div class="money-n"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#ffda78" stroke="#a8761a" stroke-width="1.5"/><circle cx="12" cy="12" r="7" fill="none" stroke="#c9922a" stroke-width="1.5"/><rect x="10.8" y="8" width="2.4" height="8" rx="1" fill="#a8761a"/></svg><span class="coins cg-num" data-bind="coins"></span></div>
      <div class="combo cg-caps"><span data-text="coins_caps"></span> · <b>×<span data-bind="combo"></span></b></div>
    </div>
  </div>
  <div class="d-buffs d">
    <div class="pill on" data-show="shields" style="--bc:#8ddbd0"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z" fill="#102e3b"/></svg></span><span class="t"><span data-text="buff_shield"></span> <em>×<span data-bind="shields"></span></em></span></div>
    <span data-each="buffs"><template><div class="pill on" data-style---bc="color"><span class="ic" data-bind="glyph"></span><span class="t"><span data-bind="name"></span> <em><span data-bind="left"></span>s</em></span><span class="bar" data-style-width="fill_pct"></span></div></template></span>
  </div>
  <div class="d-guard d">
    <div class="g-h">
      <div class="g-l"><span class="g-dot"></span><span class="g-label cg-display" data-bind="guard_label"></span></div>
      <div class="g-gap"><span class="cg-caps" data-text="gap"></span><span class="g-v cg-num"><span data-bind="gap"></span><small>m</small></span></div>
    </div>
    <div class="g-bar"><span class="g-bust" data-style-width="bust_pct"></span><span class="g-fill" data-style-width="danger_pct"></span></div>
    <div class="g-leg"><span><span data-text="safe"></span> · <span data-bind="gap_max"></span> m</span><span data-text="guard"></span><span><span data-bind="catch"></span> m · <span data-text="busted_word"></span></span></div>
  </div>
  <div class="d-pause d">
    <button class="pbtn" data-action="pause" aria-label="Pause"><i></i><i></i></button>
    <span class="cg-kbd">P</span>
  </div>
  <div class="goal" data-class-done="goal_done">
    <span class="goal-i"><svg class="open" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#102e3b" stroke-width="2.5"/><circle cx="12" cy="12" r="4" fill="#102e3b"/></svg><svg class="ok" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="#102e3b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <div class="goal-b">
      <div class="goal-t"><span class="long" data-bind="goal_title"></span><span class="short" data-bind="goal_title_short"></span></div>
      <div class="goal-l"><span class="long" data-bind="goal_line"></span><span class="short" data-bind="goal_line_short"></span></div>
      <div class="goal-s"><i><b data-style-width="goal_fill"></b></i><i data-class-on="goal_pip_1"></i><i data-class-on="goal_pip_2"></i><i data-class-on="goal_pip_3"></i></div>
    </div>
  </div>

  <div class="coach" data-class-on="coach_on">
    <div class="c-keys"><span data-each="coach_keys"><template><span class="cg-kbd" data-bind="key"></span></template></span></div>
    <div class="c-arrows"><span data-each="coach_arrows"><template><i data-class-l="l" data-class-r="r" data-class-u="u" data-class-dn="dn"></i></template></span></div>
    <div class="c-box"><div class="c-t cg-display"><span class="d-only" data-bind="coach_title"></span><span class="m-only" data-bind="coach_title_touch"></span></div><div class="c-x" data-bind="coach_line"></div></div>
    <div class="c-step cg-caps"><span data-bind="coach_step"></span>/3</div>
  </div>

  <div class="m-strip m">
    <div class="m-card">
      <div class="m-dn"><span class="dname cg-display" data-bind="district"></span><span class="cg-caps"><span data-bind="score"></span> PTS</span></div>
      <span class="m-dist cg-num"><span data-bind="distance"></span><small>m</small></span>
      <div class="prog"><i data-style-width="progress_pct"></i></div>
      <span class="m-goal" data-bind="goal"></span>
      <span class="m-div"></span>
      <div class="m-coins"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#ffda78" stroke="#a8761a" stroke-width="1.5"/><circle cx="12" cy="12" r="7" fill="none" stroke="#c9922a" stroke-width="1.5"/><rect x="10.8" y="8" width="2.4" height="8" rx="1" fill="#a8761a"/></svg><span class="coins cg-num" data-bind="coins"></span><span class="m-x">×<span data-bind="combo"></span></span></div>
    </div>
    <button class="pbtn" data-action="pause" aria-label="Pause"><i></i><i></i></button>
  </div>
  <div class="m-guard m">
    <span class="g-bust" data-style-width="bust_pct"></span><span class="g-fill" data-style-width="danger_pct"></span>
    <div class="m-gt"><span data-bind="guard_label"></span><span><span data-text="gap"></span> <span data-bind="gap"></span>m</span></div>
  </div>
</div>
