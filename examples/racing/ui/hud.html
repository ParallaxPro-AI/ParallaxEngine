  <div class="srh-keys">
    <div class="srh-key"><span class="sr-kbd">Space</span><div class="sr-lbl" data-text="drift"></div></div>
    <div class="srh-key"><span class="sr-kbd">Shift</span><div class="sr-lbl" data-text="nitro_label"></div></div>
    <div class="srh-key"><span class="sr-kbd">E</span><div class="sr-lbl" data-text="respawn"></div></div>
    <div class="srh-key"><span class="sr-kbd">P</span><div class="sr-lbl" data-text="pause_key"></div></div>
  </div>

  <div class="srh-strip">
    <div class="sr-plate srh-gauge">
      <div class="srh-gauge-row">
        <div class="srh-gear"><span class="sr-num" data-bind="gear"></span><div class="sr-lbl" data-text="gear_label"></div></div>
        <div class="srh-mspd"><span class="sr-num" data-bind="speed"></span><div class="sr-lbl" data-text="kmh"></div></div>
      </div>
      <div class="srh-rpm" data-each="rpm_segs"><template><i data-class-is-on="on" data-class-is-red="red"></i></template></div>
    </div>
    <div class="srh-chips">
      <span class="srh-chip is-spin" data-class-is-on="wheelspin"><i></i><span data-text="wheelspin"></span></span>
      <span class="srh-chip is-drift" data-class-is-on="drifting"><i></i><span data-text="drift"></span></span>
    </div>
  </div>

  <div class="srh-mtimes">
    <div class="sr-plate is-tick srh-mt">
      <div class="srh-mrow"><div class="sr-lbl" data-text="lap_label"></div><span class="sr-num"><span data-bind="lap_current"></span>/<span data-bind="lap_max"></span></span><i class="srh-div"></i><span class="sr-num" data-bind="lap_time"></span></div>
      <div class="srh-mrow">
        <div class="srh-mcell is-best" data-class-is-rec="record"><div class="sr-lbl" data-bind="best_cell_label"></div><span class="sr-num" data-bind="best_lap"></span></div>
        <div class="srh-mcell"><div class="sr-lbl" data-text="total_label"></div><span class="sr-num" data-bind="race_time"></span></div>
      </div>
    </div>
    <div class="srh-mround" data-class-on="has_round"><div class="sr-lbl" data-bind="round_name"></div><span class="sr-num" data-bind="round_n"></span></div>
  </div>

  <button class="srh-pause" data-action="pause" aria-label="Pause race"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
  <div class="srh-respawn" data-class-is-on="respawn_active">
    <div class="srh-ring">
      <svg viewBox="0 0 112 112" aria-hidden="true"><circle cx="56" cy="56" r="48" fill="rgba(14,10,12,0.82)" stroke="rgba(255,247,237,0.14)" stroke-width="8"/><circle cx="56" cy="56" r="48" fill="none" stroke="#f97316" stroke-width="8" data-attr-stroke-dasharray="respawn_ring"/></svg>
      <div class="srh-ring-c"><span class="sr-kbd">E</span></div>
    </div>
    <div class="sr-lbl" data-text="hold_to_respawn"></div>
  </div>
</div>
