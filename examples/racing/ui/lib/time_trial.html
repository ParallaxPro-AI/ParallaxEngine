<link rel="stylesheet" href="theme.css">
<div class="lib-hud">
  <div class="lib-chip" style="position: absolute; top: calc(16 * var(--u)); right: calc(16 * var(--u)); text-align: right;">
    <div class="lib-big" data-bind="time" data-format="time" data-class-lib-good="finished"></div>
    <div data-show="has_best"><span data-text="time_trial_best"></span> <span data-bind="best" data-format="time"></span></div>
    <div><span data-text="time_trial_gold"></span> <span data-bind="gold" data-format="time"></span></div>
    <div data-bind="pace"></div>
  </div>
</div>
