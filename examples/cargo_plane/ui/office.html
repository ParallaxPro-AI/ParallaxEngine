<div class="sfo sf-root">
  <div class="sfo-scrim"></div>
  <div class="sfo-paper sfo-in">
    <div class="sfo-head">
      <div class="sfo-id">
        <span class="sfo-kick" data-bind="kicker"></span>
        <h1 data-text="depot_office"></h1>
        <span class="sfo-sub" data-bind="standing"></span>
      </div>
      <div class="sfo-stats">
        <div class="sfo-stat bank"><span data-text="office_bank"></span><b data-bind="bank"></b></div>
        <div class="sfo-stat rank"><span data-text="office_rank"></span><b data-bind="rank"></b></div>
        <div class="sfo-stat"><span data-text="office_airframes"></span><b data-bind="frames"></b></div>
      </div>
      <button class="sfo-close" data-action="close" aria-label="close"><svg class="sf-i" viewBox="0 0 18 18"><path d="M4 4l10 10M14 4L4 14" stroke-width="2.2"/></svg></button>
    </div>
    <div class="sfo-bar">
      <div class="sfo-loan"><span data-text="airfield_loan"></span><div class="sfo-track"><i data-style-width="loan_pct"></i></div><b><span class="sfo-loan-bank" data-bind="loan_bank"></span> <span data-bind="loan_of"></span></b></div>
    </div>
    <div class="sfo-cols">
      <div class="sfo-col board">
        <div class="sfo-col-h"><b data-text="contract_board"></b><span data-bind="gate"></span></div>
        <div class="sfo-list">
          <div class="sfo-hold" data-show="loaded">
            <span class="sfo-hold-tag" data-text="in_the_hold"></span>
            <p><span data-text="hold_full"></span> <b data-bind="hold_cargo"></b><span data-text="hold_fly_to"></span> <b data-bind="hold_to"></b> <span data-text="hold_before"></span></p>
            <span data-bind="hold_meta"></span>
          </div>
          <div class="sfo-empty" data-show="empty" data-text="board_empty"></div>
          <div class="sfo-list" data-each="offers">
            <template>
              <button class="sfo-card" data-class-on="signed" data-action="take">
                <div class="sfo-top"><span class="sfo-name" data-bind="cargo"></span><span class="sfo-pay" data-bind="pay"></span></div>
                <div class="sfo-chips">
                  <span class="sfo-chip" data-bind="route"></span>
                  <span class="sfo-chip" data-bind="deadline"></span>
                  <span class="sfo-chip urgent" data-show="urgent" data-text="urgent"></span>
                  <span class="sfo-chip fragile" data-show="fragile" data-text="fragile"></span>
                  <span class="sfo-chip manifest" data-show="signed" data-text="on_the_manifest"></span>
                </div>
                <span class="sfo-blurb" data-bind="blurb"></span>
              </button>
            </template>
          </div>
        </div>
      </div>
      <div class="sfo-col hangar">
        <div class="sfo-col-h"><b data-text="hangar"></b><span data-text="paid_from_bank"></span></div>
        <div class="sfo-list" data-each="upgrades">
          <template>
            <div class="sfo-card hangar" data-class-dim="dim">
              <div class="sfo-top"><span class="sfo-name" data-bind="name"></span><span class="sfo-pay" data-class-no="dim" data-bind="price"></span></div>
              <div class="sfo-chips"><span class="sfo-chip" data-bind="effect"></span><span class="sfo-chip" data-bind="tier"></span></div>
              <span class="sfo-blurb" data-bind="blurb"></span>
              <div class="sfo-act">
                <span class="sfo-capped" data-show="capped" data-bind="capped"></span>
                <button class="sfo-buy" data-show="afford" data-action="buy" data-bind="buy_label"></button>
                <span class="sfo-short" data-show="short" data-bind="short"></span>
              </div>
            </div>
          </template>
        </div>
        <div class="sfo-mhint" data-text="hangar_hint"></div>
      </div>
    </div>
    <div class="sfo-foot">
      <span data-text="hangar_hint"></span>
      <button class="sfo-back" data-action="close" data-key="KeyB"><i>B</i><span data-text="back_to_apron"></span></button>
    </div>
  </div>
</div>
