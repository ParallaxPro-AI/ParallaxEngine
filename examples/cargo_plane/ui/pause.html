<link rel="stylesheet" href="sky_freight.css">
<link rel="stylesheet" href="pause.css">
<div class="sfp sf-root">
  <div class="sfp-scrim"></div>
  <div class="sf-sheet sfp-card">
    <div class="sfp-view">
      <div class="sf-sheet-head sfp-head"><span data-text="pause_head"></span><span>P</span></div>
      <div class="sfp-title"><span class="sf-lbl sfp-kick" data-text="pause_head"></span><h2 data-text="paused"></h2></div>
      <div class="sfp-stack">
        <button class="sf-btn sf-btn-primary" data-action="resume" data-text="resume"></button>
        <button class="sf-btn" data-action="main_menu" data-text="main_menu"></button>
        <button class="sf-btn sfp-more" data-action="settings"><span data-text="settings"></span><span>→</span></button>
      </div>
    </div>
  </div>
</div>
