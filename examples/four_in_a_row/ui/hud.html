<!-- HUD: the template's turn pill (your drop / teal is thinking / game over), the discs-dropped tally,
     the collapsible How to play card (a ? chip on phones) and the touch pause button. -->
<link rel="stylesheet" href="dropline.css">
<style>
  .mh { position: fixed; inset: 0; pointer-events: none; }
  .mh-turn { position: absolute; top: calc(40 * var(--dl-u)); left: 50%; transform: translateX(-50%); height: calc(56 * var(--dl-u)); padding: 0 calc(28 * var(--dl-u)) 0 calc(20 * var(--dl-u)); display: flex; align-items: center; gap: calc(14 * var(--dl-u)); border-radius: var(--dl-r-pill); background: var(--dl-panel); border: 2px solid rgba(142,164,200,.45); color: var(--dl-peri-muted); font-size: calc(17 * var(--dl-u)); font-weight: 700; letter-spacing: .2em; white-space: nowrap; transition: border-color var(--dl-dur), color var(--dl-dur), box-shadow var(--dl-dur); }
  .mh-tdisc { width: calc(20 * var(--dl-u)); height: calc(20 * var(--dl-u)); }
  .mh-dots { display: inline-flex; width: 1.6em; }
  .mh-dots i { font-style: normal; animation: dl-dot 1.2s infinite; }
  .mh-dots i:nth-child(2) { animation-delay: .18s; }
  .mh-dots i:nth-child(3) { animation-delay: .36s; }
  .mh.is-your .mh-turn { border-color: var(--dl-amber); color: var(--dl-gold); box-shadow: var(--dl-glow-amber); }
  .mh.is-your .mh-tdisc { animation: dl-pulse 1.4s ease-out infinite; }
  .mh.is-over .mh-turn { padding: 0 calc(28 * var(--dl-u)); border-color: rgba(234,242,255,.35); color: var(--dl-ink); }

  .mh-tally { position: absolute; left: var(--dl-edge-l); bottom: calc(48 * var(--dl-u)); padding: calc(18 * var(--dl-u)) calc(24 * var(--dl-u)) calc(20 * var(--dl-u)); }
  .mh-lbl { font-size: calc(12 * var(--dl-u)); color: var(--dl-peri-muted); margin-bottom: calc(10 * var(--dl-u)); }
  .mh-trow { display: flex; align-items: center; gap: calc(18 * var(--dl-u)); }
  .mh-who { display: flex; align-items: center; gap: calc(10 * var(--dl-u)); }
  .mh-who .dl-disc { width: calc(22 * var(--dl-u)); height: calc(22 * var(--dl-u)); }
  .mh-nm { font-size: calc(14 * var(--dl-u)); color: var(--dl-ink-2); }
  .mh-n { font-size: calc(40 * var(--dl-u)); line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 1.2ch; }
  .mh-n.am { color: var(--dl-amber); }
  .mh-n.te { color: var(--dl-teal); }
  .mh-sep { color: var(--dl-peri-muted); font-size: calc(24 * var(--dl-u)); }

  .mh-howto { position: absolute; right: var(--dl-edge-r); bottom: calc(48 * var(--dl-u)); width: calc(400 * var(--dl-u)); overflow: hidden; }
  .mh-head { list-style: none; cursor: pointer; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: calc(18 * var(--dl-u)) calc(22 * var(--dl-u)); color: var(--dl-peri); font-size: calc(13 * var(--dl-u)); pointer-events: auto; }
  .mh-head:hover { color: var(--dl-ink); }
  .mh-chev { width: calc(18 * var(--dl-u)); height: calc(18 * var(--dl-u)); transition: transform var(--dl-dur) var(--dl-ease); }
  .mh-howto:not([open]) .mh-chev { transform: rotate(180deg); }
  .mh-body { padding: 0 calc(22 * var(--dl-u)) calc(20 * var(--dl-u)); }
  .mh-body p { font-size: calc(16 * var(--dl-u)); line-height: 1.55; color: var(--dl-ink-2); text-wrap: pretty; }
  .mh-body b { color: var(--dl-ink); font-weight: 700; }
  .mh-keys { display: flex; gap: calc(20 * var(--dl-u)); margin-top: calc(14 * var(--dl-u)); font-size: calc(12 * var(--dl-u)); color: var(--dl-peri-muted); }
  .mh-keys span { display: flex; align-items: center; gap: calc(8 * var(--dl-u)); }

  .mh-help, .mh-pause { display: none; position: absolute; width: 44px; height: 44px; border-radius: 50%; place-items: center; pointer-events: auto; transition: transform var(--dl-dur-fast) var(--dl-ease), border-color var(--dl-dur-fast), color var(--dl-dur-fast); }
  .mh-help { right: var(--dl-edge-r); bottom: max(calc(16 * var(--dl-u)), env(safe-area-inset-bottom, 0px)); font-size: 20px; font-weight: 700; color: var(--dl-peri); }
  .mh-pause { right: max(12px, env(safe-area-inset-right, 0px)); top: max(12px, env(safe-area-inset-top, 0px)); background: rgba(6,12,26,.72); border: 1.5px solid rgba(127,166,230,.4); color: var(--dl-ink); }
  .mh-pause svg { width: 16px; height: 16px; }
  .mh-help:active, .mh-pause:active { transform: scale(.94); background: rgba(28,86,200,.55); border-color: var(--dl-peri); }
  .mh-help-toggle:checked ~ .mh-help { border-color: var(--dl-teal); color: var(--dl-teal); }
  .mh-pop-h { display: none; }

  @media (pointer: coarse) {
    .mh-pause { display: grid; }
  }

  @container ((max-height: 500px) and (orientation: landscape)) or ((orientation: portrait) and (max-width: 600px)) {
    .mh-turn { top: max(calc(16 * var(--dl-u)), env(safe-area-inset-top, 0px)); left: var(--dl-edge-l); transform: none; height: calc(34 * var(--dl-u)); padding: 0 calc(14 * var(--dl-u)) 0 calc(10 * var(--dl-u)); gap: calc(8 * var(--dl-u)); border-width: 1.5px; font-size: calc(11 * var(--dl-u)); letter-spacing: .14em; }
    .mh.is-over .mh-turn { padding: 0 calc(14 * var(--dl-u)); }
    .mh-tdisc { width: calc(14 * var(--dl-u)); height: calc(14 * var(--dl-u)); }
    .mh-tally { left: var(--dl-edge-l); top: 50%; bottom: auto; transform: translateY(-50%); width: calc(176 * var(--dl-u)); padding: calc(14 * var(--dl-u)) calc(16 * var(--dl-u)); }
    .mh-lbl { font-size: calc(10 * var(--dl-u)); }
    .mh-trow { flex-direction: column; align-items: stretch; gap: calc(8 * var(--dl-u)); }
    .mh-sep { display: none; }
    .mh-who { gap: calc(8 * var(--dl-u)); }
    .mh-who .dl-disc { width: calc(18 * var(--dl-u)); height: calc(18 * var(--dl-u)); }
    .mh-nm { font-size: calc(12 * var(--dl-u)); }
    .mh-n { margin-left: auto; font-size: calc(28 * var(--dl-u)); }
    .mh-help { display: grid; }
    .mh-howto { display: none; right: var(--dl-edge-r); bottom: calc(max(calc(16 * var(--dl-u)), env(safe-area-inset-bottom, 0px)) + 56px); width: calc(212 * var(--dl-u)); padding: calc(14 * var(--dl-u)) calc(16 * var(--dl-u)); animation: dl-rise var(--dl-dur) var(--dl-ease) both; }
    .mh-help-toggle:checked ~ .mh-howto { display: block; }
    .mh-head { display: none; }
    .mh-pop-h { display: block; font-size: calc(11 * var(--dl-u)); color: var(--dl-peri); margin-bottom: calc(8 * var(--dl-u)); }
    .mh-body { padding: 0; }
    .mh-body p { font-size: calc(13 * var(--dl-u)); line-height: 1.5; }
  }

  @container (orientation: portrait) and (max-width: 600px) {
    .mh-tally { top: auto; transform: none; bottom: max(calc(16 * var(--dl-u)), env(safe-area-inset-bottom, 0px)); width: calc(176 * var(--dl-u)); }
  }
  .mh-head::-webkit-details-marker { display: none; }
  .dl-touch { display: none; }
  @media (pointer: coarse) { .dl-touch { display: inline; } }
</style>
<div class="dl-root mh" data-class-is-your="your" data-class-is-over="over">
  <div class="mh-turn dl-mono" role="status" aria-live="polite">
    <i class="mh-tdisc dl-disc a" data-show="your"></i><i class="mh-tdisc dl-disc t" data-show="thinking"></i>
    <span data-show="your" data-text="turn_yours"></span>
    <span data-show="thinking"><span data-text="turn_theirs"></span><span class="mh-dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></span>
    <span data-show="over" data-text="turn_over"></span>
  </div>

  <section class="dl-card mh-tally">
    <p class="mh-lbl dl-mono" data-text="discs_label"></p>
    <div class="mh-trow">
      <span class="mh-who"><i class="dl-disc a"></i><span class="dl-mono mh-nm" data-text="you_label"></span><b class="mh-n am" data-bind="you"></b></span>
      <span class="mh-sep" aria-hidden="true">·</span>
      <span class="mh-who"><i class="dl-disc t"></i><span class="dl-mono mh-nm" data-text="them_label"></span><b class="mh-n te" data-bind="them"></b></span>
    </div>
  </section>

  <input type="checkbox" id="mh-help-toggle" class="mh-help-toggle" hidden>
  <details class="dl-card mh-howto" open>
    <summary class="mh-head"><span class="dl-mono" data-text="how_to_play"></span><svg class="mh-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></summary>
    <div class="mh-body">
      <p class="mh-pop-h dl-mono" data-text="how_to_play"></p>
      <p><b><span class="dl-desk" data-text="click"></span><span class="dl-touch" data-text="tap"></span></b> <span data-text="how_to_play_body"></span></p>
      <div class="mh-keys dl-mono dl-desk"><span><span class="dl-kbd" data-text="click"></span> <span data-text="drop"></span></span><span><span class="dl-kbd">P</span> <span data-text="pause"></span></span></div>
    </div>
  </details>

  <label class="dl-card mh-help" for="mh-help-toggle" aria-label="How to play">?</label>
  <button class="mh-pause" data-action="pause" aria-label="Pause"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1" fill="currentColor"/><rect x="9.5" y="2" width="3.5" height="12" rx="1" fill="currentColor"/></svg></button>
</div>
