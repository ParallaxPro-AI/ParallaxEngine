<link rel="stylesheet" href="lane_siege.css">
<style>
  /* The template's hud/draft_board in its Lane Siege skin: the title and clock, both teams'
     slots (crest, who, what they took, lock state), the selected champion on a lit stage
     with its nameplate and passive, the portrait cards, and the kit with Lock In. The
     portraits are the template's generated crests (its colour as a lit ground, a hashed
     sigil, the class glyph); the template could also rasterise the real model there. */
  .db { position: fixed; inset: 0; pointer-events: auto; display: grid; grid-template-rows: auto 1fr auto; font-family: var(--ls-ui); background: radial-gradient(120% 80% at 50% 0%, #132038 0%, rgba(7,11,20,.97) 70%); }
  .db-hd { display: flex; align-items: center; justify-content: center; gap: calc(22 * var(--u)); padding: calc(18 * var(--u)) calc(24 * var(--u)) calc(12 * var(--u)); }
  .db-hd h1 { margin: 0; font: 700 calc(36 * var(--u))/1 var(--ls-display); letter-spacing: .05em; color: var(--ls-ink); }
  .db-timer { display: flex; align-items: center; gap: calc(7 * var(--u)); padding: calc(6 * var(--u)) calc(14 * var(--u)); border-radius: calc(4 * var(--u)); background: var(--ls-panel2); box-shadow: var(--ls-bevel); font: 700 calc(28 * var(--u))/1 var(--ls-num); font-variant-numeric: tabular-nums; color: var(--ls-ink); }
  .db-timer svg { width: calc(18 * var(--u)); height: calc(18 * var(--u)); color: var(--ls-ink3); }
  .db-timer.urgent { color: var(--ls-red-hi); box-shadow: var(--ls-bevel), inset 0 0 0 calc(2 * var(--u)) var(--ls-red); animation: ls-pulse 1s ease-in-out infinite; }
  .db-body { display: grid; grid-template-columns: calc(200 * var(--u)) 1fr calc(200 * var(--u)); gap: calc(16 * var(--u)); padding: 0 calc(22 * var(--u)); min-height: 0; }
  .db-col { display: flex; flex-direction: column; gap: calc(6 * var(--u)); min-height: 0; overflow: hidden; justify-content: center; }
  .db-col > div { display: flex; flex-direction: column; gap: calc(6 * var(--u)); }
  .db-col h2 { margin: 0; font: 700 calc(17 * var(--u))/1 var(--ls-ui); letter-spacing: .03em; text-transform: uppercase; padding-bottom: calc(6 * var(--u)); border-bottom: calc(2 * var(--u)) solid var(--ls-blue); color: var(--ls-blue-hi); }
  .db-col.red h2 { color: var(--ls-red-hi); border-bottom-color: var(--ls-red); text-align: right; }
  .db-col.red .db-slot { flex-direction: row-reverse; text-align: right; }
  .db-slot { display: flex; align-items: center; gap: calc(12 * var(--u)); padding: calc(10 * var(--u)) calc(12 * var(--u)); border-radius: var(--ls-r2); background: var(--ls-panel); box-shadow: var(--ls-bevel), inset calc(3 * var(--u)) 0 0 var(--ls-blue); }
  .db-col.red .db-slot { box-shadow: var(--ls-bevel), inset calc(-3 * var(--u)) 0 0 var(--ls-red); }
  .db-slot.you { box-shadow: var(--ls-bevel), inset calc(3 * var(--u)) 0 0 var(--ls-gold), 0 0 0 calc(1 * var(--u)) rgba(242,193,78,.5); }
  .db-slot .crest { position: relative; width: calc(38 * var(--u)); height: calc(38 * var(--u)); flex: 0 0 auto; border-radius: calc(2 * var(--u)); overflow: hidden; }
  .db-slot .who { flex: 1 1 auto; min-width: 0; }
  .db-slot .who b { display: block; font: 700 calc(17 * var(--u))/1.1 var(--ls-ui); color: var(--ls-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .db-slot .who span { display: block; font: 600 calc(15 * var(--u))/1.2 var(--ls-ui); color: var(--ls-ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .db-slot .lk { flex: 0 0 auto; width: calc(13 * var(--u)); height: calc(13 * var(--u)); color: rgba(160,180,204,.35); }
  .db-slot.locked .lk { color: var(--ls-hp); }
  .crest .ground { position: absolute; inset: 0; }
  .crest img.sig { position: absolute; inset: 0; width: 100%; height: 100%; }
  .crest .cls { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: calc(23 * var(--u)); line-height: 0; color: rgba(255,255,255,.92); filter: drop-shadow(0 calc(3 * var(--u)) calc(10 * var(--u)) rgba(0,0,0,.55)); }
  .db-roster { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: calc(12 * var(--u)); min-height: 0; }
  .db-stage { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; justify-items: center; min-height: 0; overflow: hidden; }
  .db-stage .glow { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: min(calc(560 * var(--u)), 74%); height: 78%; border-radius: 50% 50% 12% 12% / 60% 60% 12% 12%; }
  .db-stage .floor { position: absolute; left: 50%; bottom: calc(2 * var(--u)); transform: translateX(-50%); width: min(calc(420 * var(--u)), 56%); height: calc(14 * var(--u)); border-radius: 50%; }
  .db-stage .figure { grid-column: 2; position: relative; height: 100%; aspect-ratio: 1; min-height: 0; opacity: .62; -webkit-mask-image: radial-gradient(closest-side, #000 48%, rgba(0,0,0,.35) 76%, transparent 100%); mask-image: radial-gradient(closest-side, #000 48%, rgba(0,0,0,.35) 76%, transparent 100%); }
  .db-stage .figure .cls { font-size: calc(160 * var(--u)); }
  .db-stage .nameplate { grid-column: 1; grid-row: 1; justify-self: end; align-self: center; text-align: right; padding-right: calc(18 * var(--u)); max-width: calc(300 * var(--u)); min-width: 0; }
  .db-stage .nameplate h3 { margin: 0; overflow-wrap: anywhere; font: 700 calc(38 * var(--u))/1.05 var(--ls-display); letter-spacing: .04em; color: var(--ls-ink); text-shadow: 0 calc(3 * var(--u)) calc(22 * var(--u)) rgba(0,0,0,.8); }
  .db-stage .nameplate .role { display: inline-flex; align-items: center; gap: calc(6 * var(--u)); margin-top: calc(8 * var(--u)); padding: calc(4 * var(--u)) calc(10 * var(--u)); border-radius: calc(999 * var(--u)); background: rgba(255,255,255,.05); box-shadow: var(--ls-bevel); font: 700 calc(14 * var(--u))/1 var(--ls-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--ls-ink2); }
  .db-stage .flavour { grid-column: 3; grid-row: 1; justify-self: start; align-self: center; text-align: left; padding-left: calc(18 * var(--u)); max-width: calc(300 * var(--u)); min-width: 0; white-space: normal; }
  .db-stage .flavour .tag { font: 700 calc(13 * var(--u))/1 var(--ls-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--ls-gold); }
  .db-stage .flavour b { display: block; margin-top: calc(5 * var(--u)); font: 700 calc(21 * var(--u))/1.1 var(--ls-ui); color: var(--ls-ink); }
  .db-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(112 * var(--u)), calc(176 * var(--u)))); gap: calc(12 * var(--u)); justify-content: center; align-content: end; min-height: 0; padding: calc(2 * var(--u)) 0 calc(4 * var(--u)); }
  .ls-root .db-card { position: relative; display: flex; flex-direction: column; border-radius: var(--ls-r2); background: var(--ls-panel); box-shadow: var(--ls-bevel); overflow: hidden; text-align: left; transition: transform .12s ease, box-shadow .12s ease; }
  .ls-root .db-card:hover, .ls-root .db-card[data-parallax-hover] { transform: translateY(calc(-4 * var(--u))); box-shadow: var(--ls-bevel), 0 0 0 calc(1 * var(--u)) var(--ls-line2); }
  .ls-root .db-card.sel { box-shadow: 0 0 0 calc(2 * var(--u)) var(--ls-blue), 0 0 calc(18 * var(--u)) rgba(51,140,242,.45); }
  .db-card .crest { position: relative; aspect-ratio: 3 / 4; width: 100%; }
  .db-card .crest .cls { top: 46%; font-size: calc(64 * var(--u)); }
  .db-card .cap { padding: calc(7 * var(--u)) calc(8 * var(--u)) calc(8 * var(--u)); background: linear-gradient(180deg, rgba(12,20,35,.4), rgba(12,20,35,.95)); }
  .db-card .cap b { display: block; font: 700 calc(20 * var(--u))/1 var(--ls-ui); letter-spacing: .06em; }
  .db-card .cap span { display: block; margin-top: calc(4 * var(--u)); font: 600 calc(13 * var(--u))/1.3 var(--ls-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--ls-ink2); }
  .db-card .taken { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,11,20,.72); color: rgba(220,232,246,.8); font: 700 calc(13 * var(--u))/1 var(--ls-ui); letter-spacing: .14em; text-transform: uppercase; }
  .db-detail { display: grid; grid-template-columns: 1fr auto; gap: calc(18 * var(--u)); align-items: end; padding: calc(12 * var(--u)) calc(24 * var(--u)) calc(16 * var(--u)); border-top: calc(1 * var(--u)) solid var(--ls-line); background: linear-gradient(180deg, rgba(12,20,35,.5), var(--ls-panel)); }
  .db-kit { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: calc(10 * var(--u)); min-width: 0; white-space: normal; }
  .db-ab { display: flex; gap: calc(8 * var(--u)); align-items: flex-start; padding: calc(10 * var(--u)) calc(12 * var(--u)); border-radius: calc(4 * var(--u)); background: rgba(255,255,255,.03); box-shadow: inset 0 0 0 calc(1 * var(--u)) var(--ls-line); }
  .db-ab .k { flex: 0 0 auto; width: calc(24 * var(--u)); height: calc(24 * var(--u)); display: grid; place-items: center; border-radius: calc(4 * var(--u)); background: var(--ls-panel3); box-shadow: inset 0 0 0 calc(1 * var(--u)) var(--ls-line2); color: var(--ls-ink); font: 700 calc(16 * var(--u))/1 var(--ls-num); }
  .db-ab.passive .k { background: var(--ls-gold); color: #1b1404; box-shadow: none; transform: rotate(45deg) scale(.82); }
  .db-ab b { display: block; font: 700 calc(18 * var(--u))/1.05 var(--ls-ui); color: var(--ls-ink); }
  .db-ab span { display: block; font: 500 calc(16 * var(--u))/1.3 var(--ls-ui); color: var(--ls-ink2); }
  .db-actions { display: flex; align-items: center; gap: calc(14 * var(--u)); justify-content: flex-end; }
  .ls-root .db-lock { clip-path: var(--ls-chamfer); background: var(--ls-primary); color: #fff; font: 700 calc(24 * var(--u))/1 var(--ls-ui); letter-spacing: .16em; text-transform: uppercase; min-height: calc(68 * var(--u)); padding: 0 calc(40 * var(--u)); box-shadow: inset 0 calc(1 * var(--u)) 0 rgba(255,255,255,.35); }
  .ls-root .db-lock.locked { background: linear-gradient(180deg, #2c8a5a, #1b5e3c); color: #e7fff1; cursor: default; }
  .db-starting { font: 700 calc(18 * var(--u))/1 var(--ls-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--ls-hp); }
  @media (max-width: 900px), (pointer: coarse) {
    .db-col { display: none; }
    .db-body { grid-template-columns: 1fr; }
    .db-stage .flavour { display: none; }
    .db-kit { grid-template-columns: repeat(auto-fit, minmax(calc(128 * var(--u)), 1fr)); }
    .db-detail { grid-template-columns: 1fr; }
    .db-actions { justify-content: center; }
  }
</style>
<div class="ls-root db">
  <div class="db-hd">
    <h1 data-text="draft_title"></h1>
    <span class="db-timer" data-class-urgent="urgent"><icon name="timer"></icon><span data-bind="seconds_left"></span></span>
  </div>
  <div class="db-body">
    <div class="db-col blue"><h2 data-bind="blue_name"></h2>
      <div data-each="blue_slots"><template>
        <div class="db-slot" data-class-locked="locked" data-class-you="you">
          <span class="crest"><span class="ground" data-style-background="ground"></span><img class="sig" alt="" data-attr-src="sigil_img">
            <span class="cls"><icon name="swords" data-show="icon_swords"></icon><icon name="spark" data-show="icon_spark"></icon><icon name="bow" data-show="icon_bow"></icon><icon name="venom" data-show="icon_venom"></icon><icon name="aegis" data-show="icon_aegis"></icon></span></span>
          <span class="who"><b data-bind="name"></b><span data-bind="champion"></span></span>
          <span class="lk"><icon name="lock" data-show="locked"></icon><icon name="timer" data-hide="locked"></icon></span>
        </div>
      </template></div>
    </div>
    <div class="db-roster">
      <div class="db-stage">
        <span class="glow" data-style-background="stage_glow"></span>
        <span class="floor" data-style-background="stage_floor"></span>
        <span class="nameplate"><h3 data-bind="stage.name"></h3><span class="role"><span data-bind="stage.role"></span></span></span>
        <span class="figure crest"><span class="ground" data-style-background="stage.ground"></span><img class="sig" alt="" data-attr-src="stage.sigil_img">
          <span class="cls"><icon name="swords" data-show="stage.icon_swords"></icon><icon name="spark" data-show="stage.icon_spark"></icon><icon name="bow" data-show="stage.icon_bow"></icon><icon name="venom" data-show="stage.icon_venom"></icon><icon name="aegis" data-show="stage.icon_aegis"></icon></span></span>
        <span class="flavour"><span class="tag" data-text="draft_passive"></span><b data-bind="stage.passive"></b></span>
      </div>
      <div class="db-cards" data-each="champions">
        <template>
          <button class="db-card" data-action="pick" data-class-sel="picked">
            <span class="crest"><span class="ground" data-style-background="ground"></span><img class="sig" alt="" data-attr-src="sigil_img">
              <span class="cls"><icon name="swords" data-show="icon_swords"></icon><icon name="spark" data-show="icon_spark"></icon><icon name="bow" data-show="icon_bow"></icon><icon name="venom" data-show="icon_venom"></icon><icon name="aegis" data-show="icon_aegis"></icon></span>
              <span class="taken" data-show="taken" data-bind="taken"></span></span>
            <span class="cap"><b data-bind="name"></b><span data-bind="role"></span></span>
          </button>
        </template>
      </div>
    </div>
    <div class="db-col red"><h2 data-bind="red_name"></h2>
      <div data-each="red_slots"><template>
        <div class="db-slot" data-class-locked="locked" data-class-you="you">
          <span class="crest"><span class="ground" data-style-background="ground"></span><img class="sig" alt="" data-attr-src="sigil_img">
            <span class="cls"><icon name="swords" data-show="icon_swords"></icon><icon name="spark" data-show="icon_spark"></icon><icon name="bow" data-show="icon_bow"></icon><icon name="venom" data-show="icon_venom"></icon><icon name="aegis" data-show="icon_aegis"></icon></span></span>
          <span class="who"><b data-bind="name"></b><span data-bind="champion"></span></span>
          <span class="lk"><icon name="lock" data-show="locked"></icon><icon name="timer" data-hide="locked"></icon></span>
        </div>
      </template></div>
    </div>
  </div>
  <div class="db-detail">
    <div class="db-kit">
      <div class="db-ab passive"><span class="k">P</span><span><b data-bind="stage.passive"></b><span data-bind="stage.passive_text"></span></span></div>
      <div data-each="kit" style="display: contents"><template>
        <div class="db-ab"><span class="k" data-bind="key"></span><span><b data-bind="name"></b><span data-bind="blurb"></span></span></div>
      </template></div>
    </div>
    <div class="db-actions">
      <span class="db-starting" data-show="locked" data-text="draft_starting"></span>
      <button class="db-lock" data-action="lock" data-class-locked="locked" data-attr-disabled="locked"><span data-hide="locked" data-text="draft_lock_in"></span><span data-show="locked" data-text="draft_locked"></span></button>
    </div>
  </div>
</div>
