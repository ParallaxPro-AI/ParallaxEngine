<link rel="stylesheet" href="pause.css">
<div class="lib">
<div class="pm-overlay visible">
  <div class="pm-ambient"></div>
  <div class="pm-card">
    <div class="pm-title" data-text="paused"></div>
    <div class="pm-line"></div>
    <div class="pm-buttons">
      <button class="pm-btn primary" data-action="resume"><span data-text="resume"></span></button>
      <button class="pm-btn" data-action="quit"><span data-text="main_menu"></span></button>
      <button class="pm-btn" data-action="settings"><span data-text="settings"></span></button>
    </div>
    <div class="pm-hint"><span data-text="pause_press"></span> <span class="pm-kbd">P</span> <span data-text="pause_to_resume"></span></div>
  </div>
</div>
</div>
