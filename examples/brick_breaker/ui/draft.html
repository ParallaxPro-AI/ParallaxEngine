<link rel="stylesheet" href="prism.css">
<style>
  .psd-wrap .ps-scrim { animation: ps-fade var(--ps-dur) ease-out both; }
  .psd { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 22); padding: 0 var(--safe); pointer-events: none; }
  .psd-title { font-size: calc(var(--u) * 80); font-weight: 800; letter-spacing: var(--ps-track-title); line-height: 1; text-align: center; animation: ps-in var(--ps-dur-slow) var(--ps-ease) both; }
  .psd-sub { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 12); text-align: center; animation: ps-in var(--ps-dur-slow) var(--ps-ease) 60ms both; }
  .psd-sub1 { font-size: var(--fs-2xs); font-weight: 700; letter-spacing: .2em; color: var(--ps-ink-2); text-transform: uppercase; }
  .psd-sub1 .ps-num { color: #fff; }
  .psd-sub2 { font-size: var(--fs-sm); color: var(--ps-ink-2); }
  .psd-next { color: var(--psd-next, var(--ps-stage-3)); font-weight: 800; letter-spacing: .12em; }
  .psd-cards { display: grid; grid-template-columns: repeat(3, calc(var(--u) * 420)); gap: calc(var(--u) * 32); margin-top: calc(var(--u) * 26); }
  .ps-root .psd-card { display: flex; flex-direction: column; align-items: flex-start; gap: calc(var(--u) * 20); padding: calc(var(--u) * 34); height: calc(var(--u) * 400); text-align: left; background: var(--ps-glass-strong); border: 2px solid var(--ps-line); transition: transform var(--ps-dur) var(--ps-ease), border-color var(--ps-dur-fast), box-shadow var(--ps-dur); animation: ps-in var(--ps-dur-slow) var(--ps-ease) both; }
  .psd-card:nth-child(1) { animation-delay: 120ms; }
  .psd-card:nth-child(2) { animation-delay: 190ms; }
  .psd-card:nth-child(3) { animation-delay: 260ms; }
  .ps-root .psd-card:hover, .ps-root .psd-card:focus-visible { outline: none; border-color: var(--ps-accent); box-shadow: var(--ps-accent-glow), var(--ps-shadow-panel); transform: translateY(calc(var(--u) * -8)); }
  .psd-card:hover::after, .psd-card:focus-visible::after { content: ''; position: absolute; left: 0; right: 0; top: 0; height: var(--ps-prism-h); background: var(--ps-prism); }
  .ps-root .psd-card:active { background: #fff; color: #000; border-color: #fff; }
  .psd-card:active .psd-desc, .psd-card:active .psd-foot, .psd-card:active .psd-icon { color: #000; border-color: #000; }
  .psd-top { display: flex; justify-content: space-between; align-items: flex-start; width: 100%; }
  .psd-icon { width: calc(var(--u) * 84); height: calc(var(--u) * 84); border: 1px solid var(--ps-line-2); display: grid; place-items: center; color: var(--ps-accent); }
  .psd-icon svg { width: 62%; height: 62%; }
  .psd-name { font-size: calc(var(--u) * 34); font-weight: 800; letter-spacing: .08em; line-height: 1.1; }
  .psd-desc { font-size: calc(var(--u) * 21); line-height: 1.5; color: var(--ps-ink-2); text-wrap: pretty; }
  .psd-foot { margin-top: auto; width: 100%; padding-top: calc(var(--u) * 18); border-top: 1px solid var(--ps-line-3); display: flex; justify-content: space-between; font-size: var(--fs-2xs); font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--ps-ink-3); }
  .psd-card:hover .psd-foot, .psd-card:focus-visible .psd-foot { color: var(--ps-accent); }
  .psd-hint { display: flex; align-items: center; gap: calc(var(--u) * 8); font-size: var(--fs-xs); color: var(--ps-ink-3); margin-top: calc(var(--u) * 8); }
  .psd-tap { display: none; }

  @media (pointer: coarse) {
    .psd { gap: calc(var(--u) * 8); }
    .psd-title { font-size: calc(var(--u) * 24); }
    .psd-sub { gap: calc(var(--u) * 4); }
    .psd-sub2 { font-size: var(--fs-xs); }
    .psd-cards { grid-template-columns: repeat(3, calc(var(--u) * 240)); gap: calc(var(--u) * 12); margin-top: calc(var(--u) * 12); }
    .ps-root .psd-card { gap: calc(var(--u) * 6); padding: calc(var(--u) * 12); height: calc(var(--u) * 170); }
    .ps-root .psd-card:hover { border-color: var(--ps-line); box-shadow: var(--ps-shadow-panel); transform: none; }
    .psd-card:hover::after { content: none; }
    .psd-card:hover .psd-foot { color: var(--ps-ink-3); }
    .ps-root .psd-card:active { background: #fff; color: #000; border-color: #fff; }
    .psd-icon { width: calc(var(--u) * 30); height: calc(var(--u) * 30); }
    .psd-name { font-size: calc(var(--u) * 15); }
    .psd-desc { font-size: calc(var(--u) * 10.5); }
    .psd-foot { padding-top: calc(var(--u) * 7); }
    .psd-key, .psd-hint, .psd-go { display: none; }
    .psd-tap { display: inline; }
  }
  .psd-icon .ic { display: none; }
  .psd-card[data-icon="wide"] .ic-wide { display: block; }
  .psd-card[data-icon="servo"] .ic-servo { display: block; }
  .psd-card[data-icon="cut_angle"] .ic-cut_angle { display: block; }
  .psd-card[data-icon="slowfield"] .ic-slowfield { display: block; }
  .psd-card[data-icon="overclock"] .ic-overclock { display: block; }
  .psd-card[data-icon="soft_accel"] .ic-soft_accel { display: block; }
  .psd-card[data-icon="spare_orb"] .ic-spare_orb { display: block; }
  .psd-card[data-icon="hardlight"] .ic-hardlight { display: block; }
  .psd-card[data-icon="precision"] .ic-precision { display: block; }
</style>
<div class="ps-root psd-wrap" data-style---psd-next="next_color">
  <div class="ps-scrim"></div>
  <main class="psd">
    <h1 class="psd-title" data-text="draft_title"></h1>
    <div class="psd-sub">
      <p class="psd-sub1"><span data-bind="cleared"></span> · <span data-text="score"></span> <span class="ps-num" data-bind="score" data-format="int"></span> · <span data-text="draft_stacks"></span></p>
      <p class="psd-sub2"><span data-text="next_stage"></span>: <span class="psd-next" data-bind="next_stage"></span> — <span data-bind="next_tagline"></span></p>
    </div>
    <div class="psd-cards" role="group" data-each="cards">
      <template>
        <button class="ps-panel psd-card" data-action="pick" data-key="Digit{index1}" data-attr-data-icon="upgrade">
          <div class="psd-top"><span class="psd-icon">
                <svg class="ic ic-wide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><rect x="5" y="14" width="14" height="4"/><path d="M2 8h20M2 8l3-3M2 8l3 3M22 8l-3-3M22 8l-3 3"/></svg>
                <svg class="ic ic-servo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><rect x="7" y="16" width="14" height="4"/><path d="M2 6h6M4 10h6M12 8h9M18 5l3 3-3 3"/></svg>
                <svg class="ic ic-cut_angle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M3 20h18"/><path d="M8 20 19 6"/><circle cx="19" cy="5" r="2"/><path d="M13 20a5 5 0 0 0-2-4"/></svg>
                <svg class="ic ic-slowfield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 8v5l3 2M9 2h6"/></svg>
                <svg class="ic ic-overclock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M13 2 5 13h6l-1 9 8-12h-6z"/></svg>
                <svg class="ic ic-soft_accel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><path d="M3 18c3 0 4-10 9-10s6 10 9 10"/><path d="M3 21h18"/></svg>
                <svg class="ic ic-spare_orb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><circle cx="10" cy="14" r="6"/><path d="M19 2v7M15.5 5.5h7"/></svg>
                <svg class="ic ic-hardlight" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><rect x="4" y="15" width="16" height="4"/><path d="M12 3v8M8 7l4-4 4 4"/></svg>
                <svg class="ic ic-precision" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>
          </span><span class="ps-key psd-key" data-bind="number"></span></div>
          <span class="psd-name" data-bind="name"></span>
          <span class="psd-desc" data-bind="description"></span>
          <span class="psd-foot"><span><span class="psd-go" data-text="draft"></span><span class="psd-tap" data-text="tap_to_draft"></span></span><span>→</span></span>
        </button>
      </template>
    </div>
    <p class="psd-hint"><span class="ps-key">1</span><span class="ps-key">2</span><span class="ps-key">3</span><span data-text="draft_hint"></span></p>
  </main>
</div>
