<!-- Ported from the template: Buccaneer Bay voyage's end - the captain's log card: victory or loss title, gold plundered count-up, the voyage ledger (legs, crew, refits, where she went down) and Play Again / Main Menu. -->

<style>

<div class="bbg-scrim">
  <div class="bbg-card" data-class-won="won">
    <div class="bbg-eyebrow">Captain Log · Voyage's End</div>

    <div class="bbg-rule"></div>
    <div class="bbg-score"><span>Gold plundered</span><b data-bind="purse"></b></div>
    <div class="bbg-stats" data-each="stats"><template><div class="bbg-stat"><span data-bind="label"></span><b data-bind="value"></b></div></template></div>
    <div class="bbg-buttons">
      <button class="bbg-btn primary" data-action="sail_again" data-key="Enter" data-text="sail_again"></button>
    </div>
  </div>
</div>
