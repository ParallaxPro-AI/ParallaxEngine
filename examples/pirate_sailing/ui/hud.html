<!-- Ported from the template: Ship status plate: hull bar, sails and knots, port/starboard ball pips with reload slivers, sailing hint, ANCHOR DOWN, squall and sunk warnings, and the touch-only pause plate. -->
<link rel="stylesheet" href="kit.css">
<style>
.bbs{position:fixed;left:50%;bottom:calc(28 * var(--u));transform:translateX(-50%);width:calc(440 * var(--u));max-width:90cqw;display:flex;flex-direction:column;align-items:center;gap:calc(8 * var(--u));font-family:var(--bb-ui);color:var(--bb-cream);}

.bbs-kn{font-weight:700;font-size:calc(17 * var(--u));color:var(--bb-gold-num);font-variant-numeric:tabular-nums;}
.bbs-guns{display:grid;grid-template-columns:1fr 1fr;gap:calc(18 * var(--u));}

.bbs-balls{display:flex;gap:calc(8 * var(--u));}

.bbs-reload{height:calc(3 * var(--u));background:rgba(0,0,0,.45);}

.bbs-foot{display:flex;justify-content:space-between;gap:calc(12 * var(--u));font-size:calc(13 * var(--u));color:var(--bb-muted);}

.bbs-pause{display:none;}

@media (pointer:coarse){
.bbs{left:50%;bottom:calc(20 * var(--u));width:calc(488 * var(--u));max-width:none;gap:calc(10 * var(--u));}
.bbs-warn{padding:calc(8 * var(--u)) calc(20 * var(--u));font-size:calc(22 * var(--u));letter-spacing:.12em;}
.bbs-anchor-m{display:block;font-weight:700;font-size:calc(22 * var(--u));letter-spacing:.12em;color:var(--bb-gold-num);text-shadow:0 2px calc(4 * var(--u)) #000;}

.bbs-row{gap:calc(16 * var(--u));}
.bbs-lbl{display:none;}
.bbs-bar{height:calc(16 * var(--u));border-radius:calc(8 * var(--u));}
.bbs-pct{width:auto;font-size:calc(26 * var(--u));}
.bbs-sails{font-size:calc(24 * var(--u));}
.bbs-kn{font-size:calc(26 * var(--u));}
.bbs-guns{gap:calc(20 * var(--u));}
.bbs-side{gap:calc(6 * var(--u));}
.bbs-rack{gap:calc(10 * var(--u));}
.bbs-arrow{font-size:calc(24 * var(--u));}
.bbs-tag{font-size:calc(18 * var(--u));}
.bbs-balls{gap:calc(8 * var(--u));}
.bbs-ball{width:calc(18 * var(--u));height:calc(18 * var(--u));border-width:2px;}
.bbs-reload{height:calc(4 * var(--u));}
.bbs-foot{justify-content:center;font-size:calc(20 * var(--u));text-shadow:0 2px calc(4 * var(--u)) #000;}
.bbs-foot b{display:none;}
.bbs-pause{position:fixed;top:calc(20 * var(--u));right:calc(20 * var(--u));width:calc(88 * var(--u));height:calc(88 * var(--u));min-width:calc(88 * var(--u));min-height:calc(88 * var(--u));padding:0;display:grid;place-items:center;border-radius:50%;background:var(--bb-tar-solid);border:calc(4 * var(--u)) solid var(--bb-brass);color:var(--bb-cream);box-shadow:0 calc(4 * var(--u)) calc(12 * var(--u)) rgba(0,0,0,.5);pointer-events:auto;cursor:pointer;touch-action:manipulation;}

}
.bbv{position:fixed;top:calc(32 * var(--u));left:calc(32 * var(--u));width:calc(380 * var(--u));max-width:45cqw;padding:calc(18 * var(--u)) calc(22 * var(--u));background:var(--bb-tar);border:1px solid var(--bb-brass-line);border-radius:calc(6 * var(--u));display:flex;flex-direction:column;gap:calc(12 * var(--u));font-family:var(--bb-ui);color:var(--bb-cream);}

.bbv-title{font:400 calc(22 * var(--u)) var(--bb-sc);letter-spacing:.08em;}

.bbv-time.low{color:var(--bb-bad);animation:bbv-low 1s steps(2,jump-none) infinite;}
@keyframes bbv-low{50%{opacity:.55;}}
.bbv-hold{display:flex;flex-direction:column;gap:calc(6 * var(--u));}
.bbv-gold{display:flex;justify-content:space-between;align-items:baseline;font-size:calc(16 * var(--u));color:var(--bb-muted);}
.bbv-gold b{color:var(--bb-gold-num);font-size:calc(20 * var(--u));font-variant-numeric:tabular-nums;}
.bbv-bar{height:calc(10 * var(--u));background:rgba(0,0,0,.45);border:1px solid var(--bb-brass-line);border-radius:calc(5 * var(--u));overflow:hidden;}
.bbv-fill{height:100%;width:0;background:var(--bb-mid);transition:width .25s,background-color .25s;}
.bbv-fill.full{background:var(--bb-gold);box-shadow:0 0 calc(10 * var(--u)) rgba(252,211,77,.6);}
.bbv-line{display:flex;align-items:center;gap:calc(10 * var(--u));font-size:calc(16 * var(--u));}
.bbv-box{width:calc(18 * var(--u));height:calc(18 * var(--u));flex:none;border:1.5px solid var(--bb-brass);border-radius:calc(3 * var(--u));display:flex;align-items:center;justify-content:center;font-size:calc(13 * var(--u));line-height:1;color:var(--bb-good);}
.bbv-line .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bbv-line .cnt{font-weight:600;color:var(--bb-gold-num);font-variant-numeric:tabular-nums;}
.bbv-line.done .bbv-box{border-color:var(--bb-good);}
.bbv-line.done .lbl{color:var(--bb-good);}
.bbv-line.contract{color:var(--bb-muted);}
.bbv-line.contract .bbv-box{border-style:dashed;border-color:var(--bb-brass-line);}
.bbv-line.offer .cnt,.bbv-line.offer .bbv-box{display:none;}
.bbv-kbd{display:inline-block;min-width:calc(22 * var(--u));padding:1px calc(6 * var(--u));margin-right:calc(6 * var(--u));border:1px solid var(--bb-brass);border-bottom-width:2px;border-radius:calc(3 * var(--u));font-weight:700;font-size:calc(13 * var(--u));color:var(--bb-cream);text-align:center;}
.bbv-race{font-size:calc(14 * var(--u));color:var(--bb-muted);}
.bbv-stand{display:flex;flex-direction:column;gap:calc(8 * var(--u));padding-top:calc(12 * var(--u));border-top:1px solid var(--bb-brass-line);}
.bbv-fac{display:grid;grid-template-columns:1fr auto;gap:calc(3 * var(--u)) calc(12 * var(--u));align-items:baseline;font-size:calc(14 * var(--u));line-height:1.15;}
.bbv-fac .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--bb-muted);}
.bbv-fac .rk{font:400 calc(15 * var(--u)) var(--bb-sc);letter-spacing:.06em;color:var(--bb-gold-num);white-space:nowrap;}
.bbv-fac.bad .rk{color:var(--bb-bad);}
.bbv-fac .pk{grid-column:1/3;font-size:calc(12 * var(--u));color:var(--bb-muted);}
.bbv-fbar{grid-column:1/3;position:relative;height:calc(5 * var(--u));background:rgba(0,0,0,.45);border:1px solid var(--bb-brass-line);border-radius:calc(3 * var(--u));overflow:hidden;}
.bbv-fbar i{display:block;height:100%;width:0;background:var(--bb-mid);transition:width .3s,background-color .3s;}
.bbv-fac.bad .bbv-fbar i{background:var(--bb-bad);}
.bbv-fbar::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--bb-brass);opacity:.7;}
@media (pointer:coarse){
.bbv{top:calc(20 * var(--u));left:calc(20 * var(--u));width:calc(424 * var(--u));max-width:none;padding:calc(16 * var(--u)) calc(22 * var(--u));gap:calc(10 * var(--u));}
.bbv-title{font-size:calc(30 * var(--u));}
.bbv-time{font-size:calc(34 * var(--u));}
.bbv-hold{gap:calc(10 * var(--u));}
.bbv-gold{font-size:calc(24 * var(--u));}
.bbv-gold b{font-size:calc(28 * var(--u));}
.bbv-gold .unit{display:none;}
.bbv-bar{height:calc(12 * var(--u));border-radius:calc(6 * var(--u));}
.bbv-line{font-size:calc(24 * var(--u));gap:calc(10 * var(--u));}
.bbv-box{width:calc(26 * var(--u));height:calc(26 * var(--u));font-size:calc(20 * var(--u));border-width:2px;}
.bbv-line.offer{display:none;}
.bbv-race{font-size:calc(22 * var(--u));}
.bbv-stand{gap:calc(6 * var(--u));padding-top:calc(10 * var(--u));}
.bbv-fac{font-size:calc(22 * var(--u));gap:0 calc(10 * var(--u));}
.bbv-fac .rk{font-size:calc(24 * var(--u));}
.bbv-fac .pk,.bbv-fbar{display:none;}
}
.bbc{position:fixed;top:calc(32 * var(--u));left:50%;transform:translateX(-50%);height:calc(52 * var(--u));padding:0 calc(20 * var(--u)) 0 calc(8 * var(--u));display:flex;align-items:center;gap:calc(12 * var(--u));background:var(--bb-tar);border:1px solid var(--bb-brass-line);border-radius:calc(26 * var(--u));font-family:var(--bb-ui);color:var(--bb-cream);}
.hidden{display:none!important}
.bbc-dial{width:calc(38 * var(--u));height:calc(38 * var(--u));flex:none;border-radius:50%;border:1.5px solid var(--bb-brass);background:var(--bb-tar-solid);display:flex;align-items:center;justify-content:center;}
.bbc-dial svg{width:calc(22 * var(--u));height:calc(22 * var(--u));display:block;transition:transform .18s ease-out;}
.bbc-dist{font-weight:700;font-size:calc(22 * var(--u));font-variant-numeric:tabular-nums;}
.bbc-what{font:400 calc(15 * var(--u)) var(--bb-sc);color:var(--bb-muted);}
@media (pointer:coarse){
.bbc{top:calc(20 * var(--u));height:calc(76 * var(--u));padding:0 calc(28 * var(--u)) 0 calc(10 * var(--u));gap:calc(16 * var(--u));border-radius:calc(38 * var(--u));}
.bbc-dial{width:calc(56 * var(--u));height:calc(56 * var(--u));border-width:2px;}
.bbc-dial svg{width:calc(32 * var(--u));height:calc(32 * var(--u));}
.bbc-dist{font-size:calc(30 * var(--u));}
.bbc-what{display:none;}
}

.sunk-note { position: fixed; top: 40%; left: 0; right: 0; text-align: center; font: 400 calc(44 * var(--u))/1.1 var(--bb-font-display, serif); color: var(--bb-parchment, #f0e2c0); text-shadow: 0 2px calc(8 * var(--u)) rgba(0,0,0,.6); }
.board { position: fixed; top: calc(16 * var(--u)); right: calc(16 * var(--u)); border-collapse: collapse; }
.board td { padding: calc(3 * var(--u)) calc(10 * var(--u)); }
.board tr.me { color: var(--bb-brass, #f0c473); }
</style>
<div class="bbv">
  <div class="bbv-head"><span class="bbv-title" data-bind="leg"></span><span class="bbv-time" data-class-low="clock_low" data-bind="clock"></span></div>
  <div class="bbv-hold"><div class="bbv-gold"><span><b data-bind="gold"></b> / <span data-bind="quota"></span><span class="unit"> gold</span></span><span><span data-bind="crew"></span> crew</span></div><div class="bbv-bar"><div class="bbv-fill" data-class-full="gold_full" data-style-width="gold_width"></div></div></div>
  <div class="bbv-line" data-class-done="bounty_done"><span class="bbv-box" data-bind="bounty_mark"></span><span class="lbl" data-bind="bounty_label"></span><span class="cnt" data-bind="bounty_count"></span></div>
  <div class="bbv-line contract" data-class-offer="no_contract">
    <span class="bbv-box"></span>
    <span class="lbl" data-show="has_contract" data-bind="contract"></span>
    <span class="lbl" data-hide="has_contract"><span class="bbv-kbd">Q</span>Take contract</span>
    <span class="cnt" data-show="has_contract" data-bind="contract_count"></span>
  </div>
  <div class="bbv-stand" data-each="standing">
    <template><div class="bbv-fac" data-class-bad="hostile"><span class="nm" data-bind="name"></span><span class="rk" data-bind="rank"></span><div class="bbv-fbar"><i data-style-width="width"></i></div><span class="pk" data-show="perk" data-bind="perk"></span></div></template>
  </div>
</div>

<div class="bbc" data-show="spyglass"><div class="bbc-dial"><svg viewBox="0 0 24 24" data-style-transform="spy_needle"><path d="M12 2l5 14-5-3-5 3z" fill="#f0c473"/></svg></div><span class="bbc-dist" data-bind="spy_distance"></span><span class="bbc-what" data-bind="spy_label"></span></div>

<table class="board d-only"><tbody data-each="scoreboard"><template><tr data-class-me="me"><td data-bind="name"></td><td data-bind="gold"></td></tr></template></tbody></table>

<div class="sunk-note" data-show="sunk" data-text="sunk_respawning"></div>

<div class="bbs" data-hide="sunk">
  <div class="bbs-warn" data-show="storm" data-text="squall"></div>
  <div class="bbs-anchor-m m-only" data-show="anchored">ANCHOR DOWN</div>
  <div class="bbs-plate">
    <div class="bbs-row"><span class="bbs-lbl" data-text="hull"></span><div class="bbs-bar"><div class="bbs-fill" data-class-low="hull_low" data-style-width="hull_width"></div></div><span class="bbs-pct" data-bind="hull_pct"></span></div>
    <div class="bbs-sails"><span>Sails <b data-bind="sail_pct"></b></span><span class="bbs-kn"><span data-bind="knots"></span> kn</span></div>
    <div class="bbs-guns">
      <div class="bbs-side port" aria-label="Port cannons"><div class="bbs-rack"><span class="bbs-arrow">←</span><div class="bbs-balls" data-each="port"><template><span class="bbs-ball" data-class-empty="empty"></span></template></div><span class="bbs-tag">PORT</span></div><div class="bbs-reload"><i data-style-width="port_reload"></i></div></div>
      <div class="bbs-side star" aria-label="Starboard cannons"><div class="bbs-rack"><span class="bbs-tag">STBD</span><div class="bbs-balls" data-each="starboard"><template><span class="bbs-ball" data-class-empty="empty"></span></template></div><span class="bbs-arrow">→</span></div><div class="bbs-reload"><i data-style-width="starboard_reload"></i></div></div>
    </div>
    <div class="bbs-foot"><span class="d-only">W/S sails · A/D steer · mouse buttons fire</span><b data-show="anchored">ANCHOR DOWN</b></div>
  </div>
</div>
<button class="bbs-pause m-only" data-action="pause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1"/><rect x="13.8" y="5" width="4.2" height="14" rx="1"/></svg></button>
