<link rel="stylesheet" href="menu_kit.css">
<style>
/* Old-engine desktop UI scale: authored px drew at min(view/1920x1080, 1); --u is one such px, measured against the game view (the host is a size container). */
:root { container-type: size; --u: min(100cqw / 1920, 100cqh / 1080, 1px); }

  /* Theme the shared title kit (.pp-menu-* live in the engine bundle). Only the
     war-table palette + the bespoke diorama (tower marks / route plan / pins)
     are authored here; the scene, card shell, entrance fade, button mechanics
     and the coarse-pointer touch floor are inherited. */
  .card {
    --pp-menu-font: Optima, Candara, "Segoe UI", sans-serif;
    --pp-menu-ink: #fffbeb;
    --pp-menu-w: min(calc(680 * var(--u)), calc(100cqw - calc(44 * var(--u))));
    --pp-menu-pad: calc(14 * var(--u));
    --pp-menu-r: calc(6 * var(--u));
    --pp-menu-border: calc(2 * var(--u)) solid rgba(251, 191, 36, 0.72);
    --pp-menu-bg: rgba(67, 36, 16, 0.78);
    --pp-menu-shadow: 0 calc(24 * var(--u)) calc(70 * var(--u)) rgba(0, 0, 0, 0.42), 0 0 calc(32 * var(--u)) rgba(251, 191, 36, 0.16);
    --pp-menu-blur: calc(7 * var(--u));
    --pp-menu-accent: #fbbf24;
    --pp-menu-btn-bg: #78350f;
    --pp-menu-btn-border: #fbbf24;
    --pp-menu-btn-ink: #fffbeb;
    --pp-menu-btn-r: calc(4 * var(--u));
    --pp-menu-btn-shadow: 0 calc(12 * var(--u)) calc(28 * var(--u)) rgba(0, 0, 0, 0.30), 0 0 calc(20 * var(--u)) rgba(251, 191, 36, 0.24);
    /* The war table hangs to the left, not centered. */
    text-align: left;
  }

  /* The table is left-hung (the kit scene centers by default). */
  .pp-menu-scene { justify-content: flex-start; padding: 7cqw; }

  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
  }

  .parchment {
    padding: calc(24 * var(--u)) calc(26 * var(--u)) calc(28 * var(--u));
    border: calc(1 * var(--u)) dashed rgba(253, 230, 138, 0.58);
    border-radius: calc(3 * var(--u));
    background:
      linear-gradient(135deg, rgba(251, 191, 36, 0.15) 0 22%, transparent 22%),
      rgba(120, 53, 15, 0.40);
  }

  .table-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: calc(16 * var(--u));
    color: #fde68a;
    font-size: calc(11 * var(--u));
    font-weight: 900;
    letter-spacing: calc(4 * var(--u));
    text-transform: uppercase;
  }

  .tower-marks {
    display: flex;
    gap: calc(7 * var(--u));
  }

  .tower-mark {
    width: calc(18 * var(--u));
    height: calc(24 * var(--u));
    border: calc(2 * var(--u)) solid #fbbf24;
    background: #78350f;
    box-shadow: inset 0 calc(7 * var(--u)) 0 rgba(251, 191, 36, 0.28);
  }

  .tower-mark.keep {
    width: calc(24 * var(--u));
    height: calc(30 * var(--u));
    border-color: #fde68a;
  }

  .title-area {
    margin-top: calc(26 * var(--u));
    text-align: left;
  }

  .game-title {
    color: #fbbf24;
    font-size: clamp(calc(36 * var(--u)), 7.2cqw, calc(58 * var(--u)));
    font-weight: 800;
    line-height: 0.92;
    letter-spacing: calc(4 * var(--u));
    text-transform: uppercase;
    text-shadow: calc(3 * var(--u)) calc(3 * var(--u)) 0 #78350f, 0 0 calc(18 * var(--u)) rgba(251, 191, 36, 0.30);
  }

  .game-subtitle {
    margin-top: calc(12 * var(--u));
    color: #fde68a;
    font-size: calc(13 * var(--u));
    font-weight: 900;
    letter-spacing: calc(3 * var(--u));
    text-transform: uppercase;
  }

  .route-plan {
    position: relative;
    height: calc(78 * var(--u));
    margin-top: calc(24 * var(--u));
    border: calc(1 * var(--u)) solid rgba(253, 230, 138, 0.30);
    background: rgba(67, 36, 16, 0.34);
  }

  .path {
    position: absolute;
    left: calc(18 * var(--u));
    right: calc(18 * var(--u));
    top: calc(38 * var(--u));
    height: calc(4 * var(--u));
    background: repeating-linear-gradient(90deg, #fde68a 0 calc(18 * var(--u)), transparent calc(18 * var(--u)) calc(28 * var(--u)));
  }

  .tower-pin {
    position: absolute;
    width: calc(18 * var(--u));
    height: calc(18 * var(--u));
    border: calc(2 * var(--u)) solid #fbbf24;
    background: #78350f;
    transform: rotate(45deg);
  }

  .tower-pin.one { left: calc(62 * var(--u)); top: calc(18 * var(--u)); }
  .tower-pin.two { left: 46%; bottom: calc(14 * var(--u)); }
  .tower-pin.three { right: calc(74 * var(--u)); top: calc(18 * var(--u)); }

  .siege-note {
    max-width: calc(500 * var(--u));
    margin-top: calc(18 * var(--u));
    color: rgba(255, 251, 235, 0.78);
    font-size: calc(14 * var(--u));
    line-height: 1.45;
  }

  .btn-group {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: calc(18 * var(--u));
    margin-top: calc(26 * var(--u));
  }

  .wave-status {
    color: #fde68a;
    font-size: calc(11 * var(--u));
    font-weight: 900;
    letter-spacing: calc(2 * var(--u));
    text-transform: uppercase;
  }

  /* Reuse .pp-menu-btn (structure + press + touch floor); only this game's
     wider block sizing, 1px hairline border and heavy tracking are layered on
     top, plus its signature bg-shift hover (the kit uses a brightness filter). */
  .menu-btn {
    width: auto;
    min-width: calc(250 * var(--u));
    padding: calc(16 * var(--u)) calc(22 * var(--u));
    border-width: calc(1 * var(--u));
    font-size: calc(16 * var(--u));
    letter-spacing: calc(4 * var(--u));
    transition: transform 0.14s ease, background 0.14s ease, box-shadow 0.14s ease;
  }

  .menu-btn:hover {
    background: #92400e;
    filter: none;
    box-shadow: 0 calc(14 * var(--u)) calc(30 * var(--u)) rgba(0, 0, 0, 0.32), 0 0 calc(28 * var(--u)) rgba(251, 191, 36, 0.38);
  }

  @media (max-width: 640px) {
    .pp-menu-scene {
      justify-content: center;
      padding: calc(18 * var(--u));
    }

    .card {
      --pp-menu-w: min(calc(460 * var(--u)), calc(100cqw - calc(28 * var(--u))));
      --pp-menu-pad: calc(10 * var(--u));
    }

    .parchment {
      padding: calc(20 * var(--u));
    }

    .table-row,
    .btn-group {
      grid-template-columns: 1fr;
      justify-items: start;
    }

    .menu-btn {
      width: 100%;
      min-width: 0;
    }
  }

.card{--pp-menu-bg:rgba(14,35,39,.95);--pp-menu-border:calc(2 * var(--u)) solid #91a28a;--pp-menu-r:calc(18 * var(--u));--pp-menu-w:min(calc(760 * var(--u)),calc(100cqw - calc(44 * var(--u))));--pp-menu-btn-bg:#c7994c;--pp-menu-btn-border:#ffe1a0;--pp-menu-btn-ink:#182d2e;--pp-menu-btn-r:calc(10 * var(--u));--pp-menu-font:Georgia,serif}
.parchment{border:0;background:transparent;padding:calc(38 * var(--u))}.game-title{font-family:Georgia,serif;font-size:calc(76 * var(--u));color:#ffe0a1;text-shadow:0 calc(5 * var(--u)) 0 #122c30;letter-spacing:calc(1 * var(--u))}.game-subtitle,.table-row{font-size:calc(20 * var(--u));letter-spacing:calc(3 * var(--u))}.siege-note{font:400 calc(25 * var(--u))/1.55 system-ui;color:#c6d5ca}.route-plan{background:#294b48;border-color:#637d68}.pp-menu-scene{background:linear-gradient(90deg,#10272b99,transparent 85%)}
@media(pointer:coarse){.parchment{padding:calc(24 * var(--u))}.game-title{font-size:calc(62 * var(--u))}.siege-note{font-size:calc(25 * var(--u))}.route-plan{height:calc(58 * var(--u));margin-top:calc(16 * var(--u))}.game-subtitle{font-size:calc(22 * var(--u))}}
.wave-status,.route-label,.siege-status,.status,.footer,.controls-hint{font-size:calc(20 * var(--u))!important}
.menu-btn{font-size:calc(25 * var(--u));min-height:calc(76 * var(--u));letter-spacing:calc(2 * var(--u))}
</style>
<div class="bg-layer"></div>
<div class="pp-menu-scene">
  <main class="pp-menu-card card">
    <section class="parchment">
      <div class="table-row">
        <span data-text="war_table"></span>
        <div class="tower-marks" aria-hidden="true">
          <span class="tower-mark"></span>
          <span class="tower-mark keep"></span>
          <span class="tower-mark"></span>
        </div>
      </div>

      <div class="title-area">
        <h1 class="game-title" data-text="game_title"></h1>
        <div class="game-subtitle" data-text="game_subtitle"></div>
      </div>

      <div class="route-plan" aria-hidden="true">
        <span class="path"></span>
        <span class="tower-pin one"></span>
        <span class="tower-pin two"></span>
        <span class="tower-pin three"></span>
      </div>

      <p class="siege-note" data-text="siege_note"></p>

      <div class="btn-group">
        <span class="wave-status" data-text="first_wave"></span>
        <button class="pp-menu-btn menu-btn" data-action="start" data-text="start_siege"></button>
      </div>
    </section>
  </main>
</div>
