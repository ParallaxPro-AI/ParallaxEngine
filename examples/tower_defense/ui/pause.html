<link rel="stylesheet" href="pause.css">
<link rel="stylesheet" href="siege_theme.css">
<div class="lib">
<div class="pm-overlay visible">
  <div class="pm-ambient"></div>
  <div class="pm-card">
    <div class="pm-title" data-text="paused"></div>
    <div class="pm-line"></div>
    <div class="pm-buttons">
      <button class="pm-btn primary" data-action="resume"><span data-text="resume"></span></button>
      <button class="pm-btn" data-action="quit"><span data-text="exit_to_menu"></span></button>
    </div>
    <div class="pm-hint"><span class="desk-only"><span data-text="pause_press"></span> <span class="pm-kbd">P</span> <span data-text="pause_to_resume"></span></span><span class="touch-only" data-text="pause_hint_touch"></span></div>
  </div>
</div>
</div>
<style>
/* Old-engine desktop UI scale: authored px drew at min(view/1920x1080, 1); --u is one such px, measured against the game view (the host is a size container). */
:root { container-type: size; --u: min(100cqw / 1920, 100cqh / 1080, 1px); }
.touch-only{display:none} @media(pointer:coarse){.desk-only{display:none} .touch-only{display:inline}}</style>
